<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" width="100%" height="100%">
  <style>
    .k-font { font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif; font-weight: 900; }
    .jump-arc { animation: hopDot 1.2s ease-in-out infinite; }
    @keyframes hopDot {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
  </style>

  <rect width="180" height="110" rx="12" fill="#0f172a" />

  <!-- W Key -->
  <rect x="52" y="13" width="26" height="25" rx="6" fill="#065f46" />
  <rect x="52" y="10" width="26" height="24" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="2" />
  <text x="65" y="27" text-anchor="middle" fill="#ffffff" font-size="14" class="k-font">W</text>

  <!-- A Key -->
  <rect x="21" y="42" width="26" height="25" rx="6" fill="#065f46" />
  <rect x="21" y="39" width="26" height="24" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="2" />
  <text x="34" y="56" text-anchor="middle" fill="#ffffff" font-size="14" class="k-font">A</text>

  <!-- S Key -->
  <rect x="52" y="42" width="26" height="25" rx="6" fill="#065f46" />
  <rect x="52" y="39" width="26" height="24" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="2" />
  <text x="65" y="56" text-anchor="middle" fill="#ffffff" font-size="14" class="k-font">S</text>

  <!-- D Key -->
  <rect x="83" y="42" width="26" height="25" rx="6" fill="#065f46" />
  <rect x="83" y="39" width="26" height="24" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="2" />
  <text x="96" y="56" text-anchor="middle" fill="#ffffff" font-size="14" class="k-font">D</text>

  <!-- SPACE Bar -->
  <rect x="21" y="75" width="88" height="24" rx="6" fill="#0369a1" />
  <rect x="21" y="72" width="88" height="23" rx="6" fill="#0ea5e9" stroke="#7dd3fc" stroke-width="2" />
  <text x="65" y="88" text-anchor="middle" fill="#ffffff" font-size="11.5" letter-spacing="1.5" class="k-font">SPACE</text>

  <!-- Cute Mini Jump Arc Icon on Right -->
  <path d="M 122 80 Q 144 26 164 80" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round" />
  <circle cx="143" cy="48" r="7" fill="#34d399" stroke="#ffffff" stroke-width="2" class="jump-arc" />
  <text x="144" y="96" text-anchor="middle" fill="#6ee7b7" font-size="9.5" class="k-font">JUMP!</text>
</svg>
