<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070e22" />
      <stop offset="72%" stop-color="#0f1f40" />
      <stop offset="100%" stop-color="#221226" />
    </linearGradient>
    <linearGradient id="magmaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0" />
      <stop offset="100%" stop-color="#ff3b00" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="tractorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.45" />
    </linearGradient>
    <filter id="redGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="shieldGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .label-font { font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif; font-weight: 800; }
    .ufo-bob { animation: ufoFloat 2.8s ease-in-out infinite; }
    .beam-pulse { animation: beamSizzle 0.7s ease-in-out infinite alternate; }
    .bolt-travel { animation: travelBolt 1.1s linear infinite; }
    .ripple-ring { animation: shieldRipple 1.1s ease-out infinite; transform-origin: 394px 165px; }
    .spark-pop { animation: sparkFlash 0.55s ease-in-out infinite alternate; transform-origin: 392px 165px; }
    .star-twinkle { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .star-twinkle-2 { animation: twinkle 3.1s ease-in-out infinite alternate-reverse; }
    @keyframes ufoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes beamSizzle {
      from { opacity: 0.78; }
      to { opacity: 1; }
    }
    @keyframes travelBolt {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shieldRipple {
      0% { transform: scale(0.45); opacity: 0.95; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    @keyframes sparkFlash {
      from { transform: scale(0.85) rotate(0deg); opacity: 0.8; }
      to { transform: scale(1.15) rotate(12deg); opacity: 1; }
    }
    @keyframes twinkle {
      from { opacity: 0.3; }
      to { opacity: 0.95; }
    }
  </style>

  <!-- Night Sky Background -->
  <rect width="760" height="270" rx="16" fill="url(#skyGrad)" />
  <rect y="205" width="760" height="65" rx="0" fill="url(#magmaGlow)" />

  <!-- Twinkling Stars -->
  <g fill="#e0f2fe">
    <circle cx="52" cy="36" r="2" class="star-twinkle" />
    <circle cx="118" cy="64" r="1.5" class="star-twinkle-2" />
    <circle cx="185" cy="28" r="2.2" class="star-twinkle" />
    <circle cx="268" cy="48" r="1.5" class="star-twinkle-2" />
    <circle cx="342" cy="24" r="2" class="star-twinkle" />
    <circle cx="445" cy="34" r="2.3" class="star-twinkle-2" />
    <circle cx="515" cy="54" r="1.6" class="star-twinkle" />
    <circle cx="678" cy="32" r="2.2" class="star-twinkle-2" />
    <circle cx="722" cy="72" r="1.8" class="star-twinkle" />
    <circle cx="478" cy="212" r="1.5" class="star-twinkle-2" />
    <circle cx="315" cy="232" r="1.8" class="star-twinkle" />
  </g>

  <!-- Left Cybernetic Player Platform -->
  <path d="M 10 218 L 195 218 L 210 270 L 10 270 Z" fill="#131c31" stroke="#00e5ff" stroke-width="2" />
  <line x1="18" y1="224" x2="190" y2="224" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="244" r="5" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <circle cx="95" cy="244" r="5" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <circle cx="140" cy="244" r="5" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- Hero Laser Blaster -->
  <g id="laser-blaster">
    <!-- Handle / Grip -->
    <path d="M 55 180 L 78 180 L 72 216 L 47 216 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Main Chassis -->
    <rect x="38" y="146" width="96" height="38" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
    <!-- Top Receiver & Red Heat Vents -->
    <rect x="50" y="138" width="66" height="10" rx="4" fill="#0f172a" />
    <rect x="60" y="140" width="10" height="4" rx="1" fill="#ff2a55" />
    <rect x="76" y="140" width="10" height="4" rx="1" fill="#ff2a55" />
    <rect x="92" y="140" width="10" height="4" rx="1" fill="#ff2a55" />
    <!-- Glowing Cyan Plasma Chamber -->
    <rect x="54" y="154" width="44" height="18" rx="6" fill="#0284c7" fill-opacity="0.45" stroke="#38bdf8" stroke-width="2" />
    <line x1="60" y1="163" x2="92" y2="163" stroke="#ff2a55" stroke-width="5" stroke-linecap="round" />
    <line x1="60" y1="163" x2="92" y2="163" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Armored Barrel & Titanium Nozzle -->
    <rect x="132" y="152" width="32" height="26" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <rect x="160" y="155" width="13" height="20" rx="3" fill="#0f172a" stroke="#ff1744" stroke-width="2.5" />
    <circle cx="173" cy="165" r="7" fill="#ff1744" fill-opacity="0.65" />
    <circle cx="173" cy="165" r="3.5" fill="#ffffff" />
  </g>
  <text x="102" y="258" text-anchor="middle" fill="#93c5fd" font-size="13" class="label-font">YOUR LASER BLASTER</text>

  <!-- Crossed-Out Curved Path (Showing Light CANNOT Curve) -->
  <g>
    <path d="M 192 146 Q 368 42 536 112" fill="none" stroke="#ff4d6d" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round" opacity="0.72" />
    <polygon points="545,116 530,103 535,118" fill="#ff4d6d" opacity="0.78" />
    <!-- Red X Circle Badge -->
    <circle cx="368" cy="70" r="18" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 360 62 L 376 78 M 376 62 L 360 78" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Pill Label -->
    <rect x="248" y="16" width="242" height="30" rx="15" fill="#450a0a" fill-opacity="0.92" stroke="#f87171" stroke-width="2" />
    <text x="369" y="36" text-anchor="middle" fill="#fecaca" font-size="13.5" class="label-font">Light CANNOT curve or bend!</text>
  </g>

  <!-- Straight Laser Beam (Blocked at Shield) -->
  <g class="beam-pulse">
    <line x1="173" y1="165" x2="392" y2="165" stroke="#ff1744" stroke-width="14" stroke-opacity="0.32" stroke-linecap="round" filter="url(#redGlow)" />
    <line x1="173" y1="165" x2="392" y2="165" stroke="#ff1744" stroke-width="7" stroke-linecap="round" />
    <line x1="173" y1="165" x2="392" y2="165" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="178" y1="165" x2="390" y2="165" stroke="#fff3b0" stroke-width="3" stroke-dasharray="12 36" stroke-linecap="round" class="bolt-travel" />
  </g>
  <rect x="210" y="182" width="146" height="26" rx="13" fill="#0f172a" fill-opacity="0.88" stroke="#ff4d6d" stroke-width="1.5" />
  <text x="283" y="199" text-anchor="middle" fill="#fda4af" font-size="12.5" class="label-font">STRAIGHT LINE! ➔</text>

  <!-- Cyan Energy Shield Barrier -->
  <g id="energy-shield">
    <rect x="387" y="88" width="20" height="154" rx="6" fill="url(#shieldGrad)" filter="url(#cyanGlow)" />
    <rect x="387" y="88" width="20" height="154" rx="6" fill="url(#shieldGrid)" stroke="#00e5ff" stroke-width="2.5" />
    <!-- Top & Bottom Emitter Caps -->
    <rect x="383" y="81" width="28" height="10" rx="4" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" />
    <rect x="383" y="239" width="28" height="10" rx="4" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" />

    <!-- Deflection Ripple & Sparks -->
    <polygon points="394,149 408,157 408,173 394,181 380,173 380,157" fill="none" stroke="#67e8f9" stroke-width="2.5" class="ripple-ring" />
    <g class="spark-pop">
      <polygon points="392,149 396,161 407,165 396,169 392,181 388,169 377,165 388,161" fill="#fde047" />
      <circle cx="392" cy="165" r="5" fill="#ffffff" />
    </g>

    <!-- BLOCKED Comic Badge -->
    <rect x="347" y="200" width="98" height="28" rx="14" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
    <text x="396" y="219" text-anchor="middle" fill="#ffffff" font-size="14" class="label-font">BLOCKED!</text>
  </g>
  <text x="397" y="261" text-anchor="middle" fill="#67e8f9" font-size="12.5" class="label-font">ENERGY SHIELD</text>

  <!-- Hovering Alien UFO on Right -->
  <g class="ufo-bob">
    <!-- Downward Purple Tractor Beam -->
    <polygon points="595,180 645,180 676,258 564,258" fill="url(#tractorGrad)" />

    <!-- Saucer Underside Glow -->
    <ellipse cx="620" cy="182" rx="45" ry="11" fill="#1e293b" />
    <!-- Saucer Main Disc -->
    <ellipse cx="620" cy="170" rx="76" ry="20" fill="#475569" stroke="#1e293b" stroke-width="4" />
    <ellipse cx="620" cy="167" rx="70" ry="15" fill="#64748b" />

    <!-- Neon Rim Orbs -->
    <circle cx="556" cy="170" r="5.5" fill="#00e676" />
    <circle cx="585" cy="179" r="5.5" fill="#00a2ff" />
    <circle cx="620" cy="182" r="5.5" fill="#facc15" />
    <circle cx="655" cy="179" r="5.5" fill="#ec4899" />
    <circle cx="684" cy="170" r="5.5" fill="#00e676" />

    <!-- Alien Inside Cockpit -->
    <g>
      <!-- Horns -->
      <polygon points="602,126 593,108 608,120" fill="#0284c7" />
      <polygon points="638,126 647,108 632,120" fill="#0284c7" />
      <!-- Green Blocky Head -->
      <rect x="600" y="121" width="40" height="30" rx="6" fill="#16a34a" stroke="#14532d" stroke-width="2" />
      <!-- Glowing Slanted Red Eyes -->
      <polygon points="606,133 617,136 616,141 606,139" fill="#ff0033" />
      <polygon points="634,133 623,136 624,141 634,139" fill="#ff0033" />
      <circle cx="611" cy="136" r="1.5" fill="#fde047" />
      <circle cx="629" cy="136" r="1.5" fill="#fde047" />
      <!-- Smug Grin -->
      <path d="M 612 145 Q 620 149 628 145" fill="none" stroke="#052e16" stroke-width="2" stroke-linecap="round" />
      <!-- Armor Shoulders -->
      <rect x="596" y="150" width="48" height="15" rx="4" fill="#0f172a" />
    </g>

    <!-- Translucent Glass Dome -->
    <path d="M 574 166 A 46 46 0 0 1 666 166 Z" fill="url(#domeGrad)" stroke="#bae6fd" stroke-width="2.5" />
    <path d="M 588 144 Q 604 127 624 127" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.65" />
  </g>
  <text x="620" y="258" text-anchor="middle" fill="#86efac" font-size="13" class="label-font">SAFE ALIEN UFO</text>
</svg>
