<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" width="100%" height="100%">
  <style>
    .k-font { font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif; font-weight: 800; }
    .click-ring { animation: pulseRing 1.3s ease-out infinite; transform-origin: 72px 35px; }
    @keyframes pulseRing {
      0% { transform: scale(0.6); opacity: 0.95; }
      100% { transform: scale(1.7); opacity: 0; }
    }
  </style>

  <rect width="180" height="110" rx="12" fill="#0f172a" />

  <!-- Side Mouse Move Arrows -->
  <path d="M 38 60 L 24 60 M 29 54 L 22 60 L 29 66" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 134 60 L 148 60 M 143 54 L 150 60 L 143 66" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Laser Bolt Shooting from Left Click -->
  <line x1="65" y1="30" x2="22" y2="12" stroke="#ff1744" stroke-width="6" stroke-opacity="0.45" stroke-linecap="round" />
  <line x1="65" y1="30" x2="22" y2="12" stroke="#ff1744" stroke-width="3" stroke-linecap="round" />
  <line x1="65" y1="30" x2="22" y2="12" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

  <!-- Stylized Gaming Mouse Body -->
  <rect x="54" y="20" width="64" height="80" rx="28" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
  <!-- Highlighted Red Left Click Button -->
  <path d="M 55.5 48 L 55.5 44 A 26.5 26.5 0 0 1 85 21.5 L 85 52 L 55.5 52 Z" fill="#ff1744" stroke="#fda4af" stroke-width="1.5" />
  <!-- Right Mouse Button -->
  <path d="M 87 21.5 A 26.5 26.5 0 0 1 116.5 44 L 116.5 52 L 87 52 Z" fill="#334155" />
  <!-- Divider & Glowing Cyan Scroll Wheel -->
  <line x1="56" y1="53" x2="116" y2="53" stroke="#0f172a" stroke-width="2.5" />
  <rect x="82" y="30" width="8" height="17" rx="4" fill="#00e5ff" stroke="#0f172a" stroke-width="1.5" />

  <!-- Animated Click Ripple -->
  <circle cx="72" cy="35" r="9" fill="none" stroke="#fde047" stroke-width="2" class="click-ring" />

  <!-- Label on Mouse -->
  <text x="86" y="79" text-anchor="middle" fill="#cbd5e1" font-size="9.5" class="k-font">LEFT CLICK</text>
  <text x="86" y="91" text-anchor="middle" fill="#38bdf8" font-size="8.5" class="k-font">ON / OFF</text>
</svg>
