<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" width="100%" height="100%">
  <style>
    .k-font { font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif; font-weight: 800; }
    .spin-wiggle { animation: mirrorWiggle 1.8s ease-in-out infinite alternate; transform-origin: 145px 56px; }
    @keyframes mirrorWiggle {
      from { transform: rotate(-16deg); }
      to { transform: rotate(16deg); }
    }
  </style>

  <rect width="180" height="110" rx="12" fill="#0f172a" />

  <!-- Arrow Keys Cluster -->
  <!-- Up -->
  <rect x="47" y="18" width="28" height="28" rx="6" fill="#0f172a" />
  <rect x="47" y="15" width="28" height="26" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
  <path d="M 61 21 L 55 31 L 67 31 Z" fill="#fbbf24" />

  <!-- Left -->
  <rect x="14" y="51" width="28" height="28" rx="6" fill="#0f172a" />
  <rect x="14" y="48" width="28" height="26" rx="6" fill="#1e293b" stroke="#00e5ff" stroke-width="2" />
  <path d="M 21 61 L 31 55 L 31 67 Z" fill="#00e5ff" />

  <!-- Down -->
  <rect x="47" y="51" width="28" height="28" rx="6" fill="#0f172a" />
  <rect x="47" y="48" width="28" height="26" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
  <path d="M 61 68 L 55 58 L 67 58 Z" fill="#fbbf24" />

  <!-- Right -->
  <rect x="80" y="51" width="28" height="28" rx="6" fill="#0f172a" />
  <rect x="80" y="48" width="28" height="26" rx="6" fill="#1e293b" stroke="#00e5ff" stroke-width="2" />
  <path d="M 101 61 L 91 55 L 91 67 Z" fill="#00e5ff" />

  <text x="61" y="96" text-anchor="middle" fill="#7dd3fc" font-size="9" class="k-font">TURN &amp; TILT</text>

  <!-- Rotating Mirror Diagram on Right -->
  <g class="spin-wiggle">
    <rect x="128" y="49" width="34" height="14" rx="4" fill="#64748b" stroke="#e2e8f0" stroke-width="2" />
    <rect x="131" y="49" width="28" height="6" rx="2" fill="#e0f2fe" />
    <line x1="145" y1="49" x2="145" y2="30" stroke="#00e5ff" stroke-width="2" stroke-dasharray="3 2" />
  </g>

  <!-- Curved Spin Arrows -->
  <path d="M 122 36 A 26 26 0 0 1 166 36" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="169,38 160,38 166,30" fill="#00e5ff" />
  <path d="M 166 78 A 26 26 0 0 1 122 78" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="119,76 128,76 122,84" fill="#fbbf24" />
</svg>
