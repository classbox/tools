<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Battle Arena</title>
  <style>
    :root {
      --bg-color: #060609;
      --card-bg: rgba(18, 18, 26, 0.7);
      --card-border: #242436;
      --team1-color: #00d2ff;
      --team1-glow: rgba(0, 210, 255, 0.4);
      --team2-color: #ff3860;
      --team2-glow: rgba(255, 56, 96, 0.4);
      --text-main: #f5f5f7;
      --text-muted: #9f9fad;
      --crosshair-color: #ff2020;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Setup Screen --- */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      padding: 30px;
      overflow-y: auto;
      z-index: 10;
    }

    .panel-container {
      background-color: #0f0f16;
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 1100px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
    }

    .panel-title {
      text-align: center;
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-box label {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }

    .input-box.t1 label { color: var(--team1-color); }
    .input-box.t2 label { color: var(--team2-color); }

    .input-box input[type="text"] {
      background-color: #040406;
      border: 2px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 12px 16px;
      font-size: 1.3rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-box.t1 input[type="text"]:focus { border-color: var(--team1-color); }
    .input-box.t2 input[type="text"]:focus { border-color: var(--team2-color); }

    .textarea-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .input-box textarea {
      background-color: #040406;
      border: 2px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 16px;
      height: 240px;
      resize: none;
      font-size: 1.3rem;
      line-height: 1.5;
      outline: none;
      font-weight: 600;
      transition: border-color 0.2s;
      position: relative;
      z-index: 2;
      background: transparent;
    }

    .input-box.t1 textarea:focus { border-color: var(--team1-color); }
    .input-box.t2 textarea:focus { border-color: var(--team2-color); }

    /* Shadow Autocomplete Overlay */
    .autocomplete-shadow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 16px;
      font-size: 1.3rem;
      line-height: 1.5;
      font-weight: 600;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      pointer-events: none;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.25);
      z-index: 1;
    }

    .config-row {
      grid-column: span 2;
      display: flex;
      gap: 20px;
      background: rgba(255, 255, 255, 0.02);
      padding: 20px;
      border-radius: 12px;
      border: 2px solid var(--card-border);
    }

    .config-field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .config-field label {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .config-field input {
      background-color: #040406;
      border: 2px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      padding: 12px;
      font-size: 1.3rem;
      font-weight: bold;
      outline: none;
    }

    .btn-primary {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding: 18px 36px;
      background-color: #151522;
      color: #fff;
      border: 3px solid var(--card-border);
      border-radius: 10px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    /* --- Battlefield Screen --- */
    #battle-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      position: relative;
    }

    /* Header & Team Progress Bars */
    .battle-header {
      padding: 20px 40px;
      background-color: rgba(6, 6, 9, 0.95);
      border-bottom: 3px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 5;
    }

    .team-health-bar-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .team-hp-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .team-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .team-name-display {
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .team-name-display.t1 { color: var(--team1-color); }
    .team-name-display.t2 { color: var(--team2-color); }

    .team-hp-text {
      font-family: monospace;
      font-size: 1.8rem;
      font-weight: 900;
    }

    .bar-bg {
      height: 32px;
      background-color: #0d0d12;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--card-border);
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.3s ease-out;
    }

    .t1-fill {
      background: linear-gradient(90deg, #0088cc, var(--team1-color));
      box-shadow: 0 0 12px var(--team1-glow);
    }

    .t2-fill {
      background: linear-gradient(90deg, #cc1144, var(--team2-color));
      box-shadow: 0 0 12px var(--team2-glow);
    }

    /* Battlefield stage */
    .battlefield-stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      padding: 30px;
      overflow: hidden;
      position: relative;
    }

    .team-formation-zone {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-content: space-around;
      gap: 30px;
      padding: 20px;
      position: relative;
      border-radius: 12px;
    }

    .team-formation-zone.t1-zone {
      border-right: 2px dashed rgba(255, 255, 255, 0.05);
    }

    /* Free-standing Soldier */
    .soldier {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 160px;
      text-align: center;
      transform: translate(calc(var(--offset-x, 0) * 1px), calc(var(--offset-y, 0) * 1px));
      transition: opacity 0.5s, filter 0.5s;
    }

    .soldier-graphic-box {
      width: 130px;
      height: 130px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: bottom center;
    }

    .soldier-svg {
      width: 100%;
      height: 100%;
      transition: transform 0.2s, color 0.3s;
    }

    .soldier.t1-soldier .soldier-svg {
      color: var(--team1-color);
      filter: drop-shadow(0 0 8px var(--team1-glow));
    }

    .soldier.t2-soldier .soldier-svg {
      color: var(--team2-color);
      filter: drop-shadow(0 0 8px var(--team2-glow));
    }

    /* --- Custom Idle Personality Animations per Stance --- */
    .stance-0 .soldier-graphic-box {
      animation: disco-bounce 2s ease-in-out infinite alternate !important;
      animation-delay: var(--anim-delay, 0s) !important;
    }
    @keyframes disco-bounce {
      0% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(4deg) scaleX(1.03); }
      100% { transform: translateY(-2px) rotate(-4deg) scaleX(0.97); }
    }

    .stance-1 .soldier-graphic-box {
      animation: matrix-limbo 3.2s ease-in-out infinite alternate !important;
      animation-delay: var(--anim-delay, 0s) !important;
    }
    @keyframes matrix-limbo {
      0% { transform: translateY(0) rotate(0deg) skewX(0deg); }
      50% { transform: translateY(-5px) rotate(-8deg) skewX(-5deg); }
      100% { transform: translateY(1px) rotate(4deg) skewX(4deg); }
    }

    .stance-2 .soldier-graphic-box {
      animation: scared-jitter 0.16s ease-in-out infinite alternate !important;
      animation-delay: var(--anim-delay, 0s) !important;
    }
    @keyframes scared-jitter {
      0% { transform: translate(1px, 0) rotate(-1deg); }
      100% { transform: translate(-1px, -2px) rotate(1deg); }
    }

    .stance-3 .soldier-graphic-box {
      animation: dab-pulse 1.8s ease-in-out infinite alternate !important;
      animation-delay: var(--anim-delay, 0s) !important;
    }
    @keyframes dab-pulse {
      0% { transform: translateY(0) rotate(-2deg) scale(1); }
      50% { transform: translateY(-6px) rotate(5deg) scale(1.04); }
      100% { transform: translateY(0) rotate(-1deg) scale(0.98); }
    }

    .stance-4 .soldier-graphic-box {
      animation: crane-balance 2.2s ease-in-out infinite alternate !important;
      animation-delay: var(--anim-delay, 0s) !important;
    }
    @keyframes crane-balance {
      0% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
      100% { transform: translateY(-2px) rotate(-2deg); }
    }

    .stance-5 .soldier-graphic-box {
      animation: flex-pump 1.5s ease-in-out infinite alternate !important;
      animation-delay: var(--anim-delay, 0s) !important;
    }
    @keyframes flex-pump {
      0% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.08, 0.95) translateY(-4px); }
      100% { transform: scale(0.96, 1.04) translateY(0); }
    }

    .soldier-name-label {
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.9);
      color: #fff;
    }

    .soldier-hp-mini-bar {
      width: 100px;
      height: 12px;
      background-color: #171722;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 6px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
    }

    .soldier-hp-fill {
      height: 100%;
      background-color: #2ecc71;
      width: 100%;
      transition: width 0.3s ease-out, background-color 0.3s;
    }

    /* --- Dizzy Stars Effect --- */
    .dizzy-stars {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      white-space: nowrap;
      user-select: none;
    }

    .soldier.falling-down .dizzy-stars {
      opacity: 1;
      animation: dizzy-stars-spin 0.8s linear infinite;
    }

    @keyframes dizzy-stars-spin {
      0% { transform: translateX(-50%) rotate(0deg) scale(0.8); }
      50% { transform: translateX(-50%) rotate(180deg) scale(1.2); }
      100% { transform: translateX(-50%) rotate(360deg) scale(0.8); }
    }

    /* --- Fall Down / Stumble Animations --- */
    @keyframes fall-and-flop {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        filter: brightness(3.5) drop-shadow(0 0 20px #ff2020);
      }
      15% {
        transform: translate3d(calc(var(--knock-dir) * 40px), -38px, 0) rotate(calc(var(--knock-dir) * -55deg)) scale(1.08);
        filter: brightness(2);
      }
      32% {
        transform: translate3d(calc(var(--knock-dir) * 70px), 52px, 0) rotate(calc(var(--knock-dir) * -90deg)) scale(0.92);
        filter: brightness(1);
      }
      40% {
        transform: translate3d(calc(var(--knock-dir) * 72px), 44px, 0) rotate(calc(var(--knock-dir) * -84deg));
      }
      48%, 100% {
        transform: translate3d(calc(var(--knock-dir) * 75px), 54px, 0) rotate(calc(var(--knock-dir) * -90deg));
      }
    }

    .soldier.falling-down {
      animation: fall-and-flop 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
      z-index: 30;
    }

    .soldier.falling-down .soldier-graphic-box {
      animation: floor-twitch 0.28s ease-in-out infinite alternate !important;
    }

    @keyframes floor-twitch {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-2px) rotate(3deg); }
    }

    /* --- Funny Scramble Get Up Animation --- */
    @keyframes comical-get-up {
      0% {
        transform: translate3d(calc(var(--knock-dir) * 75px), 54px, 0) rotate(calc(var(--knock-dir) * -90deg));
      }
      22% {
        transform: translate3d(calc(var(--knock-dir) * 50px), 30px, 0) rotate(calc(var(--knock-dir) * -45deg)) scaleY(0.85);
      }
      48% {
        transform: translate3d(calc(var(--knock-dir) * 22px), 14px, 0) rotate(calc(var(--knock-dir) * 22deg)) scale(1.1);
      }
      72% {
        transform: translate3d(calc(var(--knock-dir) * -8px), -12px, 0) rotate(calc(var(--knock-dir) * -16deg));
      }
      88% {
        transform: translate3d(0, 4px, 0) rotate(calc(var(--knock-dir) * 8deg));
      }
      100% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
    }

    .soldier.getting-up {
      animation: comical-get-up 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
      z-index: 25;
    }

    /* --- Healed Joy Bounce --- */
    @keyframes heal-joy-dance {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      20% { transform: translate3d(0, -28px, 0) scale(1.22) rotate(-8deg); }
      40% { transform: translate3d(0, 0, 0) scale(0.9) rotate(8deg); }
      60% { transform: translate3d(0, -18px, 0) scale(1.15) rotate(-5deg); }
      80% { transform: translate3d(0, -4px, 0) scale(1.05) rotate(3deg); }
      100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
    }

    .soldier.healed-bounce {
      animation: heal-joy-dance 0.9s ease-out forwards !important;
    }

    /* Red targeting crosshair overlay */
    .crosshair-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.8);
      width: 110px;
      height: 110px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s, transform 0.15s;
      z-index: 10;
    }

    .soldier.targeting .crosshair-overlay {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15);
    }

    .crosshair-svg {
      width: 100%;
      height: 100%;
      color: var(--crosshair-color);
      animation: spin-crosshair 2.5s linear infinite;
    }

    @keyframes spin-crosshair {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Knocked out state (Lying flat on floor permanently) */
    .soldier.knocked-out {
      opacity: 0.35;
      filter: grayscale(1) blur(0.5px);
      transform: translate3d(calc(var(--knock-dir) * 75px), 54px, 0) rotate(calc(var(--knock-dir) * -90deg)) !important;
      animation: none !important;
      z-index: 1;
    }

    .soldier.knocked-out .soldier-graphic-box {
      animation: none !important;
    }

    .soldier.knocked-out .soldier-svg {
      color: #555566 !important;
    }

    .soldier-ko-tag {
      display: none;
      position: absolute;
      background: #e74c3c;
      color: white;
      font-size: 1rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(calc(var(--knock-dir) * 90deg));
      box-shadow: 0 0 8px rgba(231, 76, 60, 0.8);
      z-index: 20;
    }

    .soldier.knocked-out .soldier-ko-tag {
      display: block;
    }

    /* --- Damage Splash Animations --- */
    @keyframes splash-pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.25) rotate(-8deg); opacity: 1; }
      25% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); }
      80% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.7) translateY(-40px); opacity: 0; }
    }

    .damage-splash {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splash-pop 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.25) forwards;
      pointer-events: none;
      z-index: 50;
    }

    .splash-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 15px rgba(255, 17, 54, 0.85));
    }

    .splash-text {
      position: relative;
      color: #ffffff;
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 3.2rem;
      text-align: center;
      text-shadow: 
        -4px -4px 0 #000, 
         4px -4px 0 #000, 
        -4px  4px 0 #000, 
         4px  4px 0 #000,
         0 0 15px rgba(255, 0, 0, 0.9);
      z-index: 2;
    }

    /* Projectiles */
    .rocket-projectile {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      transform-origin: center;
      transition: transform 0.95s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rocket-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px #ff6a00);
    }

    .hadouken-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 18px #00d2ff);
      animation: pulse-hadouken 0.2s infinite alternate;
    }

    @keyframes pulse-hadouken {
      from { transform: scale(0.92); }
      to { transform: scale(1.08); }
    }

    /* Controls Console at bottom */
    .battle-controls {
      background-color: rgba(6, 6, 9, 0.98);
      border-top: 3px solid var(--card-border);
      padding: 15px 30px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 30px;
      align-items: center;
      z-index: 5;
    }

    .team-controls-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls-row {
      display: flex;
      gap: 15px;
    }

    .control-btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      border: 2px solid var(--card-border);
      background-color: #12121c;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      flex: 1;
    }

    .control-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Team 1 Button Colorations */
    .t1-btn { border-color: var(--team1-color); }
    .t1-btn:not(:disabled):hover {
      background-color: var(--team1-color);
      color: #000;
      box-shadow: 0 0 15px var(--team1-glow);
    }
    .t1-heal-btn { border-color: #2ecc71; color: #2ecc71; }
    .t1-heal-btn:not(:disabled):hover {
      background-color: #2ecc71;
      color: #000;
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
    }
    .t1-nuke-btn { border-color: #e67e22; color: #e67e22; }
    .t1-nuke-btn:not(:disabled):hover {
      background-color: #e67e22;
      color: #000;
      box-shadow: 0 0 15px rgba(230, 126, 34, 0.4);
    }

    /* Team 2 Button Colorations */
    .t2-btn { border-color: var(--team2-color); }
    .t2-btn:not(:disabled):hover {
      background-color: var(--team2-color);
      color: #000;
      box-shadow: 0 0 15px var(--team2-glow);
    }
    .t2-heal-btn { border-color: #2ecc71; color: #2ecc71; }
    .t2-heal-btn:not(:disabled):hover {
      background-color: #2ecc71;
      color: #000;
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
    }
    .t2-nuke-btn { border-color: #e67e22; color: #e67e22; }
    .t2-nuke-btn:not(:disabled):hover {
      background-color: #e67e22;
      color: #000;
      box-shadow: 0 0 15px rgba(230, 126, 34, 0.4);
    }

    .shortcut-badge {
      background-color: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.9rem;

    // --- Shadow Autocomplete Engine ---
    function setupAutocomplete(textarea, shadowDiv) {
      function updateShadow() {
        const text = textarea.value;
        const lines = text.split('\n');
        const currentLineIndex = text.substr(0, textarea.selectionStart).split('\n').length - 1;
        const currentLine = lines[currentLineIndex] || "";

        if (currentLine.trim().length > 0 && classroomRosterCache.length > 0) {
          const match = classroomRosterCache.find(name => 
            name.toLowerCase().startsWith(currentLine.toLowerCase()) && 
            name.toLowerCase() !== currentLine.toLowerCase()
          );

          if (match) {
            // Reconstruct all lines up to current with the completion appended to current line
            const completedLines = [...lines];
            completedLines[currentLineIndex] = currentLine + match.slice(currentLine.length);
            shadowDiv.textContent = completedLines.join('\n');
            return;
          }
        }
        shadowDiv.textContent = text + (text.endsWith('\n') ? '' : '');
      }

      textarea.addEventListener('input', updateShadow);
      textarea.addEventListener('keyup', updateShadow);
      textarea.addEventListener('click', updateShadow);
      textarea.addEventListener('scroll', () => {
        shadowDiv.scrollTop = textarea.scrollTop;
        shadowDiv.scrollLeft = textarea.scrollLeft;
      });

      // Handle Tab key to accept suggestion
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          const text = textarea.value;
          const lines = text.split('\n');
          const currentLineIndex = text.substr(0, textarea.selectionStart).split('\n').length - 1;
          const currentLine = lines[currentLineIndex] || "";

          if (currentLine.trim().length > 0 && classroomRosterCache.length > 0) {
            const match = classroomRosterCache.find(name => 
              name.toLowerCase().startsWith(currentLine.toLowerCase()) && 
              name.toLowerCase() !== currentLine.toLowerCase()
            );

            if (match) {
              e.preventDefault();
              lines[currentLineIndex] = match;
              textarea.value = lines.join('\n');
              updateShadow();
              return;
            }
          }
        }
      });
    }

    // Attach autocomplete behavior to all roster textareas
    setupAutocomplete(setupT1Roster, setupT1Shadow);
    setupAutocomplete(setupT2Roster, setupT2Shadow);
    setupAutocomplete(midT1Roster, midT1Shadow);
    setupAutocomplete(midT2Roster, midT2Shadow);

    // Web Audio Synthesizer for targeting jumps
    let audioCtx = null;
    function playTargetBeep(frequency = 520, duration = 0.05) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime); 
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (err) {
        console.warn("Audio Context blocked or unsupported.", err);
      }
    }

    function triggerAudioFile(audioObj) {
      audioObj.currentTime = 0;
      audioObj.play().catch(err => {
        console.log("Audio deferred/blocked by system permissions policy.", err);
      });
    }

    function fadeOutAudio(audioObj, durationMs = 600) {
      try {
        const startVol = audioObj.volume;
        const interval = 40;
        const steps = durationMs / interval;
        const volStep = startVol / steps;

        const fadeTimer = setInterval(() => {
          if (audioObj.volume > volStep) {
            audioObj.volume -= volStep;
          } else {
            audioObj.volume = 0;
            audioObj.pause();
            audioObj.currentTime = 0;
            audioObj.volume = startVol;
            clearInterval(fadeTimer);
          }
        }, interval);
      } catch (e) {
        audioObj.pause();
        audioObj.currentTime = 0;
      }
    }

    function parseNames(text) {
      if (!text) return [];
      return text
        .split(/[\n,]/)
        .map(n => n.trim())
        .filter(n => n.length > 0);
    }

    function cleanHtml(unsafe) {
      return unsafe.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function toggleTriggerLocks(disabled) {
      t1AttackBtn.disabled = disabled;
      t1HealBtn.disabled = disabled;
      t1NukeBtn.disabled = disabled;
      t2AttackBtn.disabled = disabled;
      t2HealBtn.disabled = disabled;
      t2NukeBtn.disabled = disabled;
    }

    function buildGame() {
      const roster1 = parseNames(setupT1Roster.value);
      const roster2 = parseNames(setupT2Roster.value);

      if (roster1.length === 0 || roster2.length === 0) {
        alert("Please enter names on both rosters before starting.");
        return;
      }

      gameConfig.t1Name = setupT1Name.value.trim() || "Team 1";
      gameConfig.t2Name = setupT2Name.value.trim() || "Team 2";
      gameConfig.minDmg = parseInt(setupMinDmg.value) || 10;
      gameConfig.maxDmg = parseInt(setupMaxDmg.value) || 25;
      gameConfig.critChance = Math.min(100, Math.max(0, parseInt(setupCritChance.value) || 0));

      if (gameConfig.minDmg > gameConfig.maxDmg) {
        const swap = gameConfig.minDmg;
        gameConfig.minDmg = gameConfig.maxDmg;
        gameConfig.maxDmg = swap;
      }

      createTeams(roster1, roster2);

      setupScreen.style.display = 'none';
      settingsDrawer.style.display = 'none';
      battleScreen.style.display = 'flex';
      gameState.isGameActive = true;
      gameState.isAttacking = false;

      syncUIHeaders();
      toggleTriggerLocks(false);
    }

    function createTeams(roster1, roster2) {
      gameState.team1 = roster1.map((name, i) => createSoldierObject(name, i, 1));
      gameState.team2 = roster2.map((name, i) => createSoldierObject(name, i, 2));

      renderCrowd(1, gameState.team1, t1Zone);
      renderCrowd(2, gameState.team2, t2Zone);
    }

    function createSoldierObject(name, index, teamNum) {
      return {
        id: `soldier-t${teamNum}-${index}`,
        name: name,
        hp: 100,
        maxHp: 100,
        team: teamNum,
        stance: Math.floor(Math.random() * 6),
        domElement: null
      };
    }

    function renderCrowd(teamNum, soldiers, container) {
      container.innerHTML = '';
      soldiers.forEach((soldier, idx) => {
        const div = document.createElement('div');
        div.className = `soldier t${teamNum}-soldier stance-${soldier.stance}`;
        div.id = soldier.id;

        const offsetValX = (idx % 3 === 0) ? -12 : (idx % 3 === 1) ? 12 : 0;
        const offsetValY = (idx % 2 === 0) ? -14 : 16;
        const randomDelay = (Math.random() * -3).toFixed(2);

        div.style.setProperty('--offset-x', String(offsetValX));
        div.style.setProperty('--offset-y', String(offsetValY));
        div.style.setProperty('--anim-delay', `${randomDelay}s`);

        div.innerHTML = `
          <div class="dizzy-stars">💫 💫 💫</div>
          <div class="soldier-hp-mini-bar">
            <div class="soldier-hp-fill" style="width: 100%;"></div>
          </div>
          <div class="soldier-graphic-box">
            ${getSoldierSVG(soldier.stance, soldier.team)}
            <div class="crosshair-overlay">
              ${crosshairSvgSource}
            </div>
            <span class="soldier-ko-tag">💀 KO</span>
          </div>
          <div class="soldier-name-label">${cleanHtml(soldier.name)}</div>
        `;

        container.appendChild(div);
        soldier.domElement = div;
      });
    }

    function syncUIHeaders() {
      t1TitleDisp.textContent = gameConfig.t1Name;
      t2TitleDisp.textContent = gameConfig.t2Name;
      t1BtnLabel.textContent = gameConfig.t1Name;
      t2BtnLabel.textContent = gameConfig.t2Name;

      const t1Sum = gameState.team1.reduce((sum, p) => sum + p.hp, 0);
      const t1Limit = gameState.team1.length * 100;
      const t1Ratio = t1Limit > 0 ? (t1Sum / t1Limit) * 100 : 0;
      t1CumulativeText.textContent = `${t1Sum} / ${t1Limit} HP`;
      t1CumulativeBar.style.width = `${t1Ratio}%`;

      const t2Sum = gameState.team2.reduce((sum, p) => sum + p.hp, 0);
      const t2Limit = gameState.team2.length * 100;
      const t2Ratio = t2Limit > 0 ? (t2Sum / t2Limit) * 100 : 0;
      t2CumulativeText.textContent = `${t2Sum} / ${t2Limit} HP`;
      t2CumulativeBar.style.width = `${t2Ratio}%`;
    }

    // Attack round processing
    function initiateAttack(attackingTeamNum, mode = 'normal') {
      if (!gameState.isGameActive || gameState.isAttacking) return;

      const defenderTeamNum = attackingTeamNum === 1 ? 2 : 1;
      const defenders = defenderTeamNum === 1 ? gameState.team1 : gameState.team2;
      const activeDefenders = defenders.filter(p => p.hp > 0);

      if (activeDefenders.length === 0) {
        declareWinner(attackingTeamNum);
        return;
      }

      gameState.isAttacking = true;
      toggleTriggerLocks(true);

      let attackType = mode;
      if (mode === 'normal') {
        const roll = Math.random() * 100;
        if (roll < gameConfig.critChance) {
          attackType = 'crit';
        }
      }

      const rouletteLimit = 1500;
      const stepInterval = 80;
      let timeSpent = 0;
      let prevIndex = -1;

      const timer = setInterval(() => {
        activeDefenders.forEach(p => p.domElement.classList.remove('targeting'));

        let index;
        do {
          index = Math.floor(Math.random() * activeDefenders.length);
        } while (activeDefenders.length > 1 && index === prevIndex);

        prevIndex = index;
        activeDefenders[index].domElement.classList.add('targeting');
        
        playTargetBeep(520 + (index * 25), 0.05);

        timeSpent += stepInterval;
        if (timeSpent >= rouletteLimit) {
          clearInterval(timer);
          
          activeDefenders.forEach(p => p.domElement.classList.remove('targeting'));
          
          const targetedPlayer = activeDefenders[index];
          targetedPlayer.domElement.classList.add('targeting');

          const attackers = attackingTeamNum === 1 ? gameState.team1 : gameState.team2;
          const activeLaunchers = attackers.filter(p => p.hp > 0);
          const shooter = activeLaunchers[Math.floor(Math.random() * activeLaunchers.length)] || null;

          if (attackType === 'nuke') {
            triggerAudioFile(nukeLaunchSound);
          } else if (attackType === 'crit') {
            triggerAudioFile(hadoukenLaunchSound);
          } else {
            triggerAudioFile(rocketLaunchSound);
          }

          launchRocket(shooter, targetedPlayer, attackingTeamNum, attackType);
        }
      }, stepInterval);
    }

    function launchRocket(originPlayer, destinationPlayer, attackingTeamNum, attackType) {
      let startX, startY;

      if (originPlayer && originPlayer.domElement) {
        const bounds = originPlayer.domElement.getBoundingClientRect();
        startX = bounds.left + bounds.width / 2;
        startY = bounds.top + bounds.height / 2;
      } else {
        startX = attackingTeamNum === 1 ? 50 : window.innerWidth - 50;
        startY = window.innerHeight / 2;
      }

      const endBounds = destinationPlayer.domElement.getBoundingClientRect();
      const endX = endBounds.left + endBounds.width / 2;
      const endY = endBounds.top + endBounds.height / 2;

      const rocket = document.createElement('div');
      rocket.className = 'rocket-projectile';

      if (attackType === 'crit') {
        rocket.style.width = "180px";
        rocket.style.height = "180px";
        rocket.innerHTML = hadoukenSvgSource;
      } else if (attackType === 'nuke') {
        rocket.style.width = "200px";
        rocket.style.height = "110px";
        rocket.innerHTML = rocketSvgSource;
        const svgElement = rocket.querySelector('.rocket-svg');
        svgElement.style.filter = "drop-shadow(0 0 16px #39ff14)";
        svgElement.querySelectorAll('path').forEach((path, i) => {
          if (i === 0) path.setAttribute('fill', '#39ff14');
          if (i === 1) path.setAttribute('fill', '#9eff70');
          if (i === 3) path.setAttribute('fill', '#39ff14');
          if (i > 3) path.setAttribute('fill', '#1d8a00');
        });
      } else {
        rocket.style.width = "100px";
        rocket.style.height = "50px";
        rocket.innerHTML = rocketSvgSource;
      }

      document.body.appendChild(rocket);

      const dx = endX - startX;
      const dy = endY - startY;
      const angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);

      const mirroredRotation = attackingTeamNum === 2 ? angleDeg + 180 : angleDeg;
      const internalSvg = rocket.querySelector('svg');
      if (attackingTeamNum === 2 && internalSvg) {
        internalSvg.style.transform = 'scaleX(-1)';
      }

      rocket.style.left = '0px';
      rocket.style.top = '0px';
      rocket.style.transform = `translate3d(${startX}px, ${startY}px, 0) translate(-50%, -50%) rotate(${mirroredRotation}deg)`;

      setTimeout(() => {
        rocket.style.transform = `translate3d(${endX}px, ${endY}px, 0) translate(-50%, -50%) rotate(${mirroredRotation}deg)`;
      }, 20);

      rocket.addEventListener('transitionend', () => {
        rocket.remove();
        if (attackType === 'nuke') {
          fadeOutAudio(nukeLaunchSound, 600);
          applyNukeImpact(destinationPlayer, attackingTeamNum);
        } else if (attackType === 'crit') {
          fadeOutAudio(hadoukenLaunchSound, 800);
          applyCritImpact(destinationPlayer, attackingTeamNum);
        } else {
          fadeOutAudio(rocketLaunchSound, 500);
          applyDamageImpact(destinationPlayer, attackingTeamNum);
        }
      });
    }

    function applyDamageImpact(target, attackingTeamNum) {
      triggerAudioFile(rocketHitSound);

      const spread = gameConfig.maxDmg - gameConfig.minDmg + 1;
      const finalDmg = Math.floor(Math.random() * spread) + gameConfig.minDmg;

      inflictDamage(target, finalDmg);

      const splashDiv = document.createElement('div');
      splashDiv.className = 'damage-splash';
      splashDiv.innerHTML = `
        ${splashSvgSource}
        <span class="splash-text">-${finalDmg}</span>
      `;
      target.domElement.appendChild(splashDiv);

      syncUIHeaders();

      setTimeout(() => {
        target.domElement.classList.remove('targeting');
        target.domElement.classList.remove('falling-down');
        splashDiv.remove();

        if (target.hp > 0) {
          target.domElement.classList.add('getting-up');
          setTimeout(() => {
            target.domElement.classList.remove('getting-up');
          }, 850);
        } else {
          target.domElement.classList.add('knocked-out');
        }

        verifyActiveStatus();

        gameState.isAttacking = false;
        if (gameState.isGameActive) {
          toggleTriggerLocks(false);
        }
      }, 1600);
    }

    function applyCritImpact(target, attackingTeamNum) {
      triggerAudioFile(hadoukenHitSound);

      const spread = gameConfig.maxDmg - gameConfig.minDmg + 1;
      const baseDmg = Math.floor(Math.random() * spread) + gameConfig.minDmg;
      const critDmg = Math.floor(baseDmg * 1.5);

      inflictDamage(target, critDmg);

      const splashDiv = document.createElement('div');
      splashDiv.className = 'damage-splash';
      splashDiv.innerHTML = `
        ${critSplashSvgSource}
        <span class="splash-text" style="color:#00d2ff; text-shadow: -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000, 0 0 15px #00d2ff; font-size:2.4rem;">CRIT!<br>-${critDmg}</span>
      `;
      target.domElement.appendChild(splashDiv);

      syncUIHeaders();

      setTimeout(() => {
        target.domElement.classList.remove('targeting');
        target.domElement.classList.remove('falling-down');
        splashDiv.remove();

        if (target.hp > 0) {
          target.domElement.classList.add('getting-up');
          setTimeout(() => {
            target.domElement.classList.remove('getting-up');
          }, 850);
        } else {
          target.domElement.classList.add('knocked-out');
        }

        verifyActiveStatus();

        gameState.isAttacking = false;
        if (gameState.isGameActive) {
          toggleTriggerLocks(false);
        }
      }, 1600);
    }

    function applyNukeImpact(target, attackingTeamNum) {
      triggerAudioFile(nukeHitSound);

      const spread = gameConfig.maxDmg - gameConfig.minDmg + 1;
      const baseDmg = Math.floor(Math.random() * spread) + gameConfig.minDmg;
      const primaryDmg = Math.floor(baseDmg * 1.5);

      inflictDamage(target, primaryDmg);

      const splashDiv = document.createElement('div');
      splashDiv.className = 'damage-splash';
      splashDiv.innerHTML = `
        <svg class="splash-svg" viewBox="0 0 100 100" style="filter: drop-shadow(0 0 15px rgba(57, 255, 20, 0.85));">
          <polygon points="50,2 59,28 86,16 71,40 98,50 71,60 86,84 59,72 50,98 41,72 14,84 29,60 2,50 29,40 14,16 41,28" fill="#39ff14" />
          <polygon points="50,12 56,31 77,22 66,42 88,50 66,58 77,78 56,69 50,88 44,69 23,78 34,58 12,50 34,42 23,22 44,31" fill="#1d8a00" />
        </svg>
        <span class="splash-text" style="text-shadow: -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000, 0 0 15px #39ff14;">-${primaryDmg}</span>
      `;
      target.domElement.appendChild(splashDiv);

      const splashDmgValue = Math.floor(primaryDmg * 0.40);
      const defenderTeamNum = attackingTeamNum === 1 ? 2 : 1;
      const defenders = defenderTeamNum === 1 ? gameState.team1 : gameState.team2;
      
      const otherActiveDefenders = defenders.filter(p => p.hp > 0 && p.id !== target.id);
      
      const splashTargets = [];
      const tempPool = [...otherActiveDefenders];
      while (tempPool.length > 0 && splashTargets.length < 3) {
        const randIndex = Math.floor(Math.random() * tempPool.length);
        splashTargets.push(tempPool.splice(randIndex, 1)[0]);
      }

      splashTargets.forEach(victim => {
        inflictDamage(victim, splashDmgValue);

        const splashPop = document.createElement('div');
        splashPop.style.position = "absolute";
        splashPop.style.top = "20%";
        splashPop.style.left = "50%";
        splashPop.style.transform = "translateX(-50%)";
        splashPop.style.fontSize = "2.2rem";
        splashPop.style.fontWeight = "900";
        splashPop.style.color = "#39ff14";
        splashPop.style.textShadow = "0 0 6px #000, 0 0 10px #39ff14";
        splashPop.style.zIndex = "60";
        splashPop.textContent = `-${splashDmgValue}`;
        victim.domElement.appendChild(splashPop);

        setTimeout(() => {
          victim.domElement.classList.remove('falling-down');
          splashPop.remove();

          if (victim.hp > 0) {
            victim.domElement.classList.add('getting-up');
            setTimeout(() => {
              victim.domElement.classList.remove('getting-up');
            }, 850);
          } else {
            victim.domElement.classList.add('knocked-out');
          }
        }, 1200);
      });

      syncUIHeaders();

      setTimeout(() => {
        target.domElement.classList.remove('targeting');
        target.domElement.classList.remove('falling-down');
        splashDiv.remove();

        if (target.hp > 0) {
          target.domElement.classList.add('getting-up');
          setTimeout(() => {
            target.domElement.classList.remove('getting-up');
          }, 850);
        } else {
          target.domElement.classList.add('knocked-out');
        }

        verifyActiveStatus();

        gameState.isAttacking = false;
        if (gameState.isGameActive) {
          toggleTriggerLocks(false);
        }
      }, 1600);
    }

    function inflictDamage(player, damageValue) {
      player.hp = Math.max(0, player.hp - damageValue);

      const barFill = player.domElement.querySelector('.soldier-hp-fill');
      const ratio = (player.hp / player.maxHp) * 100;
      barFill.style.width = `${ratio}%`;

      if (ratio <= 25) {
        barFill.style.backgroundColor = '#ff1122';
      } else if (ratio <= 50) {
        barFill.style.backgroundColor = '#f1c40f';
      } else {
        barFill.style.backgroundColor = '#2ecc71';
      }

      const dirCoefficient = player.team === 1 ? -1 : 1;
      player.domElement.style.setProperty('--knock-dir', String(dirCoefficient));

      player.domElement.classList.remove('getting-up', 'healed-bounce', 'falling-down');
      void player.domElement.offsetWidth;
      player.domElement.classList.add('falling-down');
    }

    function initiateHeal(teamNum) {
      if (!gameState.isGameActive || gameState.isAttacking) return;

      const teammates = teamNum === 1 ? gameState.team1 : gameState.team2;
      if (teammates.length === 0) return;

      gameState.isAttacking = true;
      toggleTriggerLocks(true);

      const woundedTeammates = teammates.filter(p => p.hp < 100);

      if (woundedTeammates.length === 0) {
        gameState.isAttacking = false;
        toggleTriggerLocks(false);
        return;
      }

      const target = woundedTeammates[Math.floor(Math.random() * woundedTeammates.length)];

      triggerAudioFile(healSound);

      const healAmount = Math.floor(Math.random() * 16) + 25;
      const originalHp = target.hp;
      target.hp = Math.min(100, target.hp + healAmount);

      const barFill = target.domElement.querySelector('.soldier-hp-fill');
      const ratio = (target.hp / target.maxHp) * 100;
      barFill.style.width = `${ratio}%`;

      if (ratio <= 25) {
        barFill.style.backgroundColor = '#ff1122';
      } else if (ratio <= 50) {
        barFill.style.backgroundColor = '#f1c40f';
      } else {
        barFill.style.backgroundColor = '#2ecc71';
      }

      if (originalHp === 0 && target.hp > 0) {
        target.domElement.classList.remove('knocked-out');
      }

      target.domElement.classList.remove('getting-up', 'falling-down', 'healed-bounce');
      void target.domElement.offsetWidth;
      target.domElement.classList.add('healed-bounce');

      const healSplash = document.createElement('div');
      healSplash.className = 'damage-splash';
      healSplash.innerHTML = `
        ${healHeartSvgSource}
        <span class="splash-text" style="color:#ffffff; text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 0 10px rgba(0,0,0,0.8); font-size: 2.5rem; margin-top: -6px;">+${healAmount}</span>
      `;
      target.domElement.appendChild(healSplash);

      syncUIHeaders();

      setTimeout(() => {
        healSplash.remove();
        target.domElement.classList.remove('healed-bounce');
        gameState.isAttacking = false;
        toggleTriggerLocks(false);
      }, 1500);
    }

    function verifyActiveStatus() {
      const t1Status = gameState.team1.some(p => p.hp > 0);
      const t2Status = gameState.team2.some(p => p.hp > 0);

      if (!t1Status && !t2Status) {
        declareWinner(0);
      } else if (!t2Status) {
        declareWinner(1);
      } else if (!t1Status) {
        declareWinner(2);
      }
    }

    function declareWinner(winningTeamNum) {
      gameState.isGameActive = false;
      toggleTriggerLocks(true);

      victoryBox.className = 'victory-box';
      if (winningTeamNum === 1) {
        victoryBox.classList.add('winner-t1');
        winnerText.textContent = `${gameConfig.t1Name} wins the battle!`;
        winnerText.style.color = 'var(--team1-color)';
      } else if (winningTeamNum === 2) {
        victoryBox.classList.add('winner-t2');
        winnerText.textContent = `${gameConfig.t2Name} wins the battle!`;
        winnerText.style.color = 'var(--team2-color)';
      } else {
        winnerText.textContent = 'Draw Game!';
        winnerText.style.color = 'var(--text-main)';
      }

      setTimeout(() => {
        victoryOverlay.style.display = 'flex';
      }, 700);
    }

    function openSettingsDrawer() {
      if (gameState.isAttacking) return;

      midT1Name.value = gameConfig.t1Name;
      midT2Name.value = gameConfig.t2Name;
      midMinDmg.value = gameConfig.minDmg;
      midMaxDmg.value = gameConfig.maxDmg;
      midCritChance.value = gameConfig.critChance;

      midT1Roster.value = gameState.team1.map(p => p.name).join('\n');
      midT2Roster.value = gameState.team2.map(p => p.name).join('\n');

      settingsDrawer.style.display = 'flex';
    }

    function saveSettingsDrawer() {
      gameConfig.t1Name = midT1Name.value.trim() || "Team 1";
      gameConfig.t2Name = midT2Name.value.trim() || "Team 2";
      gameConfig.minDmg = parseInt(midMinDmg.value) || 10;
      gameConfig.maxDmg = parseInt(midMaxDmg.value) || 25;
      gameConfig.critChance = Math.min(100, Math.max(0, parseInt(midCritChance.value) || 0));

      if (gameConfig.minDmg > gameConfig.maxDmg) {
        const swap = gameConfig.minDmg;
        gameConfig.minDmg = gameConfig.maxDmg;
        gameConfig.maxDmg = swap;
      }

      const updatedNamesT1 = parseNames(midT1Roster.value);
      const updatedNamesT2 = parseNames(midT2Roster.value);

      if (updatedNamesT1.length === 0 || updatedNamesT2.length === 0) {
        alert("Rosters must have at least one active player.");
        return;
      }

      reconcileTeam(1, updatedNamesT1, gameState.team1);
      reconcileTeam(2, updatedNamesT2, gameState.team2);

      renderCrowd(1, gameState.team1, t1Zone);
      renderCrowd(2, gameState.team2, t2Zone);

      syncUIHeaders();
      settingsDrawer.style.display = 'none';
      verifyActiveStatus();
    }

    function reconcileTeam(teamNum, newNamesList, existingRoster) {
      const targetMap = new Map();
      existingRoster.forEach(player => targetMap.set(player.name.toLowerCase(), player));

      const finalRoster = [];

      newNamesList.forEach((name, i) => {
        const match = targetMap.get(name.toLowerCase());
        if (match) {
          finalRoster.push({
            id: `soldier-t${teamNum}-${i}`,
            name: match.name,
            hp: match.hp,
            maxHp: match.maxHp,
            team: teamNum,
            stance: match.stance,
            domElement: null
          });
        } else {
          finalRoster.push(createSoldierObject(name, i, teamNum));
        }
      });

      if (teamNum === 1) {
        gameState.team1 = finalRoster;
      } else {
        gameState.team2 = finalRoster;
      }
    }

    function closeSettingsDrawer() {
      settingsDrawer.style.display = 'none';
    }

    function returnToSetup() {
      victoryOverlay.style.display = 'none';
      battleScreen.style.display = 'none';
      setupScreen.style.display = 'flex';
      gameState.isGameActive = false;
      gameState.isAttacking = false;
    }

    // Event Listeners
    btnStart.addEventListener('click', buildGame);
    btnRestart.addEventListener('click', returnToSetup);

    t1AttackBtn.addEventListener('click', () => initiateAttack(1, 'normal'));
    t2AttackBtn.addEventListener('click', () => initiateAttack(2, 'normal'));

    t1HealBtn.addEventListener('click', () => initiateHeal(1));
    t1NukeBtn.addEventListener('click', () => initiateAttack(1, 'nuke'));
    t2HealBtn.addEventListener('click', () => initiateHeal(2));
    t2NukeBtn.addEventListener('click', () => initiateAttack(2, 'nuke'));

    btnOpenSettings.addEventListener('click', openSettingsDrawer);
    btnSaveSettings.addEventListener('click', saveSettingsDrawer);
    btnCloseSettings.addEventListener('click', closeSettingsDrawer);

    // Keyboard Hotkeys
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') {
        return;
      }

      if (e.key === '1') {
        initiateAttack(1, 'normal');
      } else if (e.key === '2') {
        initiateAttack(2, 'normal');
      } else if (e.key === '3') {
        initiateHeal(1);
      } else if (e.key === '4') {
        initiateAttack(1, 'nuke');
      } else if (e.key === '5') {
        initiateHeal(2);
      } else if (e.key === '6') {
        initiateAttack(2, 'nuke');
      }
    });
  </script>
</body>
</html>
