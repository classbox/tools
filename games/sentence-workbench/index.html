<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sentence Workbench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f5f4ef;
  --ink: #1d2330;
  --muted: #8b91a0;
  --line: #c5cad3;
  --card: #ffffff;
  --chip-border: #d3d7de;
  --accent: #2f6fe4;
  --green: #18995a;
  --green-soft: #e2f5ea;
  --red: #d6403f;
  --red-soft: #fde7e6;
  --gold: #f2b632;
  --word: clamp(24px, 3.2vw, 60px);
  --lens: clamp(170px, 15vw, 300px);
  font-family: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

button { font: inherit; color: inherit; }

svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.view { position: fixed; inset: 0; display: none; flex-direction: column; }
.view.active { display: flex; }

/* ================= LANDING ================= */
#home { align-items: center; justify-content: center; gap: 6vh; }

.home-head h1 {
  margin: 0;
  font-size: clamp(30px, 3.6vw, 64px);
  font-weight: 600;
  letter-spacing: -0.02em;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2.5vw;
  width: min(92vw, 1600px);
}

.tab {
  position: relative;
  background: var(--card);
  border: none;
  border-radius: 28px;
  padding: clamp(24px, 2.8vw, 52px);
  min-height: clamp(260px, 46vh, 520px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 2px 0 rgba(0,0,0,.03), 0 18px 40px rgba(20,30,50,.07);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
}
.tab::before {
  content: '';
  position: absolute; left: 0; right: 0; top: 0; height: 10px;
  background: var(--tab-color);
}
.tab.t1 { --tab-color: var(--accent); }
.tab.t2 { --tab-color: #ef8a3c; }
.tab.t3 { --tab-color: #8a5cd6; }

.tab:not(.soon):hover { transform: translateY(-8px); box-shadow: 0 2px 0 rgba(0,0,0,.03), 0 28px 50px rgba(20,30,50,.12); }
.tab.soon { cursor: default; opacity: .55; }

.tab-title { font-size: clamp(24px, 2.5vw, 46px); font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
.tab-sub { margin-top: .6em; font-size: clamp(15px, 1.2vw, 22px); color: var(--muted); }

.tab-art { position: relative; height: 40%; min-height: 110px; font-size: clamp(16px, 1.4vw, 26px); }

.art-exploded span {
  position: absolute;
  padding: .3em .7em;
  border: 2px solid var(--chip-border);
  border-radius: .4em;
  background: #fff;
  box-shadow: 0 3px 0 var(--chip-border);
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
}
.art-exploded span:nth-child(1) { left: 2%;  top: 10%; transform: rotate(-8deg); }
.art-exploded span:nth-child(2) { left: 36%; top: 48%; transform: rotate(6deg); }
.art-exploded span:nth-child(3) { left: 62%; top: 4%;  transform: rotate(-4deg); }
.art-exploded span:nth-child(4) { left: 14%; top: 62%; transform: rotate(10deg); }
.tab.t1:hover .art-exploded span { transform: rotate(0deg) scale(1.05); }

.art-w { display: flex; flex-wrap: wrap; gap: .5em; align-content: flex-start; }
.art-w span { padding: .3em .7em; border-radius: 1em; background: #fdecdf; color: #c4651d; font-weight: 500; }

.art-notebook { display: flex; flex-direction: column; justify-content: center; gap: 18%; padding-right: 30%; }
.art-notebook i { display: block; height: 3px; background: #ddd2f3; border-radius: 3px; }

/* ================= ACTIVITY ================= */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  height: 84px;
}
.top-right { display: flex; gap: 8px; }

.icon-btn {
  width: 48px; height: 48px;
  padding: 12px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background .2s, color .2s;
}
.icon-btn:hover { background: #fff; color: var(--ink); }
.icon-btn .snd-off { display: none; }
.icon-btn.muted .snd-on { display: none; }
.icon-btn.muted .snd-off { display: block; }

.dots { display: flex; gap: 10px; align-items: center; }
.dot {
  width: 14px; height: 14px;
  padding: 0;
  border: none;
  border-radius: 999px;
  background: #d9dce2;
  cursor: pointer;
  transition: width .3s cubic-bezier(.2,.8,.2,1), background .3s;
}
.dot.done { background: #9bd8b6; }
.dot.current { width: 40px; background: var(--ink); }
.dot.current.done { background: var(--green); }

.stage { position: relative; flex: 1; overflow: hidden; }

.nav {
  position: absolute;
  top: 50%;
  z-index: 10;
  width: 64px; height: 64px;
  margin-top: -32px;
  padding: 16px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: #b4b9c4;
  cursor: pointer;
  transition: all .3s cubic-bezier(.2,.8,.2,1);
}
.nav svg { stroke-width: 2.5; }
.nav:hover:not(:disabled) { background: #fff; color: var(--ink); }
.nav:disabled { opacity: 0; pointer-events: none; }
.nav.prev { left: 1.5vw; }
.nav.next { right: 1.5vw; }
.nav.next.ready {
  width: 96px; height: 96px; margin-top: -48px; padding: 24px;
  background: var(--green);
  color: #fff;
  box-shadow: 0 10px 30px rgba(24,153,90,.35);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 10px 40px rgba(24,153,90,.5); } }

/* ---- slide ---- */
.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(20px, 5vh, 64px);
  padding: 0 7vw 6vh;
}
.slide.in-right { animation: inRight .5s cubic-bezier(.2,.8,.2,1) both; }
.slide.in-left  { animation: inLeft .5s cubic-bezier(.2,.8,.2,1) both; }
.slide.in-fade  { animation: inFade .4s ease both; }
.slide.out-left  { animation: outLeft .35s ease both; pointer-events: none; }
.slide.out-right { animation: outRight .35s ease both; pointer-events: none; }
@keyframes inRight { from { opacity: 0; transform: translateX(90px); } }
@keyframes inLeft  { from { opacity: 0; transform: translateX(-90px); } }
@keyframes inFade  { from { opacity: 0; } }
@keyframes outLeft  { to { opacity: 0; transform: translateX(-90px); } }
@keyframes outRight { to { opacity: 0; transform: translateX(90px); } }

/* ---- sentence line ---- */
.line-wrap {
  width: min(88vw, 1600px);
  min-height: calc(var(--word) * 3.4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(20px, 3vw, 50px) clamp(20px, 3vw, 56px);
  background: var(--card);
  border-radius: 28px;
  box-shadow: 0 2px 0 rgba(0,0,0,.03), 0 18px 40px rgba(20,30,50,.06);
  outline: 4px dashed transparent;
  outline-offset: -14px;
  transition: outline-color .2s, box-shadow .5s;
}
.line-wrap.drop-hover { outline-color: rgba(47,111,228,.35); }
.line-wrap.celebrate { box-shadow: 0 0 0 6px var(--green-soft), 0 18px 40px rgba(24,153,90,.15); }

.line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: .45em .3em;
  font-size: var(--word);
  line-height: 1.25;
  min-height: 1.7em;
  transition: gap .5s;
}
.line.text-mode { gap: .45em .24em; }

.slot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 1.7em;
  min-width: 2.4em;
  padding: 0;
  line-height: 1;
  border: 3px solid transparent;
  border-bottom-color: var(--line);
  border-radius: 2px;
  white-space: nowrap;
  transition: background .5s, border-color .5s, padding .5s, box-shadow .5s, color .5s, border-radius .5s;
}
.slot.filled {
  min-width: 0;
  padding: 0 .45em;
  border-radius: .28em;
}
.slot.ghost { color: transparent; border-color: transparent; }
.slot.correct {
  background: var(--green-soft);
  border-color: var(--green);
  color: #11643c;
  box-shadow: 0 3px 0 var(--green);
}
.slot.pop { animation: slotIn .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes slotIn {
  0%   { transform: scale(.82); }
  60%  { transform: scale(1.1); }
  100% { transform: scale(1); }
}
.line.all-correct .slot { animation: wave .55s ease both; animation-delay: calc(var(--k) * 70ms); }
@keyframes wave { 40% { transform: translateY(-.28em); } }

.line.text-mode .slot {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  padding: 0 .05em;
  color: var(--ink);
}

.cap-target, .end-target { display: inline-block; line-height: 1; border-radius: .15em; }
.end-target { min-width: .32em; min-height: 1em; }
.fixed { color: var(--green); font-weight: 600; }

.cap-target.cap-out { animation: capOut .22s ease-in forwards; }
@keyframes capOut { to { transform: translateY(-.15em) scale(.2) rotate(-90deg); opacity: 0; } }
.cap-target.cap-in { animation: capIn .6s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes capIn {
  0%   { transform: scale(.2) rotate(90deg); opacity: 0; }
  100% { transform: none; opacity: 1; }
}
.end-target.mark-in { animation: markIn .7s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes markIn {
  0%   { transform: translateY(-1.3em) scale(1.8); opacity: 0; }
  60%  { transform: translateY(.06em) scale(.9); opacity: 1; }
  100% { transform: none; }
}
.hint { animation: hint 1.4s ease-in-out infinite; }
@keyframes hint { 50% { background: rgba(242,182,50,.4); box-shadow: 0 0 0 .12em rgba(242,182,50,.4); } }

/* ---- prompt ---- */
.prompt {
  min-height: 1.6em;
  display: flex;
  align-items: center;
  gap: .6em;
  font-size: clamp(20px, 2vw, 38px);
  color: var(--ink);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .4s, transform .4s cubic-bezier(.2,.8,.2,1);
}
.prompt.show { opacity: 1; transform: none; }
.badge {
  display: inline-grid;
  place-items: center;
  width: 1.6em; height: 1.6em;
  border-radius: 50%;
  background: var(--gold);
  color: #fff;
  font-weight: 600;
}
.badge.bump { animation: bump .4s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { 0% { transform: scale(1.5); } }
.badge.ok { background: var(--green); }

/* ---- word bank ---- */
.bank {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .45em;
  width: min(88vw, 1600px);
  min-height: 2em;
  font-size: var(--word);
  line-height: 1;
  transition: opacity .4s, transform .4s;
}
.bank.gone { opacity: 0; transform: translateY(24px); pointer-events: none; }

.chip {
  height: 1.7em;
  padding: 0 .45em;
  font-size: 1em;
  line-height: 1;
  white-space: nowrap;
  border: 3px solid var(--chip-border);
  border-radius: .28em;
  background: #fff;
  color: var(--ink);
  box-shadow: 0 3px 0 var(--chip-border);
  cursor: grab;
  touch-action: none;
  transition: transform .15s, border-color .15s;
}
.chip:hover { transform: translateY(-3px); border-color: #aeb4bf; }
.chip.placeholder { visibility: hidden; }
.chip.dud { animation: dud 1.1s ease-out; }
@keyframes dud { 0%, 30% { border-color: var(--red); background: var(--red-soft); color: var(--red); } }

.chip.floating {
  position: fixed;
  margin: 0;
  z-index: 60;
  font-size: var(--word);
  pointer-events: none;
  cursor: grabbing;
  transition: none;
  box-shadow: 0 16px 34px rgba(20,30,50,.2);
}
.chip.floating.wrong {
  border-color: var(--red);
  background: var(--red-soft);
  color: var(--red);
  box-shadow: 0 3px 0 var(--red);
}

/* ---- fix mode ---- */
body.fix-mode #stage { cursor: none; }

#lens {
  position: fixed;
  left: 0; top: 0;
  width: var(--lens); height: var(--lens);
  margin: calc(var(--lens) / -2) 0 0 calc(var(--lens) / -2);
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  transform: scale(.5);
  transition: opacity .25s, transform .3s cubic-bezier(.3,1.5,.5,1);
}
#lens.on { opacity: 1; transform: scale(1); }

.lens-glass {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  background: #fff;
  border: 6px solid #2b3340;
  box-shadow: 0 14px 34px rgba(0,0,0,.25);
  transition: background .2s;
}
.lens-glass::before {
  content: '';
  position: absolute;
  inset: 10%;
  border-radius: 50%;
  border: 2px dashed rgba(24,153,90,.4);
  z-index: 2;
}
.lens-glass::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 24%, rgba(255,255,255,.6), transparent 38%);
  z-index: 3;
}
.lens-content { position: absolute; inset: 0; z-index: 1; transition: opacity .15s; }

.lens-handle {
  position: absolute;
  left: 50%; top: 50%;
  width: 13%; height: 46%;
  border-radius: 999px;
  background: linear-gradient(90deg, #3a4352, #222934);
  transform-origin: 50% 0;
  transform: translateX(-50%) rotate(-45deg) translateY(calc(var(--lens) * .46));
}
.lens-dot {
  position: absolute;
  left: 50%; top: 50%;
  width: 8px; height: 8px;
  margin: -4px;
  border-radius: 50%;
  background: rgba(24,153,90,.6);
}

#lens.applying .lens-glass { background: transparent; animation: stamp .45s cubic-bezier(.3,1.5,.5,1); }
#lens.applying .lens-content { opacity: 0; }
@keyframes stamp { 30% { transform: scale(.86); } }
#lens.miss .lens-glass { animation: lensShake .4s ease; }
@keyframes lensShake {
  20% { transform: translateX(-8px) rotate(-3deg); }
  40% { transform: translateX(7px) rotate(3deg); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(3px); }
}

/* ================= W-QUESTIONS ACTIVITY ================= */
.w-sentence {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: center;
  gap: 0.28em 0.25em;
  font-size: var(--word);
  line-height: 1.45;
  text-align: center;
}

.w-stem-text {
  color: var(--ink);
  white-space: pre-wrap;
}

/* The spelling line for the W-word */
.w-input-slot {
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
  position: relative;
  min-width: 4.2em;
  height: 1.35em;
  padding: 0 0.2em;
  border-bottom: 4px solid var(--ink);
  cursor: text;
  transition: border-color 0.3s, background 0.3s, color 0.3s, box-shadow 0.3s;
}
.w-input-slot.focused {
  border-bottom-color: var(--accent);
  box-shadow: 0 4px 0 -1px rgba(47, 111, 228, 0.25);
}
.w-input-slot.correct {
  border-bottom-color: var(--green);
  background: var(--green-soft);
  border-radius: 0.2em;
  color: #11643c;
}
.w-input-slot.shake {
  animation: dud 0.7s ease-out;
  border-bottom-color: var(--red);
  background: var(--red-soft);
  color: var(--red);
}

/* Floating animated badge showing other valid W-word choices above typed word */
.w-alt-badge {
  position: absolute;
  bottom: calc(100% + 14px);
  left: 50%;
  transform: translateX(-50%) translateY(10px) scale(0.6);
  opacity: 0;
  display: inline-flex;
  align-items: center;
  gap: 0.45em;
  padding: 0.22em 0.75em;
  background: #ffffff;
  border: 2.5px solid var(--accent);
  box-shadow: 0 8px 24px rgba(47, 111, 228, 0.22);
  border-radius: 999px;
  font-size: clamp(14px, 1.25vw, 22px);
  font-weight: 600;
  white-space: nowrap;
  pointer-events: none;
  z-index: 25;
  color: var(--ink);
  line-height: 1.2;
}
.w-alt-badge::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  margin-left: -7px;
  border-width: 7px 7px 0 7px;
  border-style: solid;
  border-color: var(--accent) transparent transparent transparent;
}
.w-alt-badge.show {
  animation: altBadgePop 0.65s cubic-bezier(0.25, 1.6, 0.4, 1) forwards;
}
@keyframes altBadgePop {
  0% { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.5); }
  60% { opacity: 1; transform: translateX(-50%) translateY(-4px) scale(1.08); }
  100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
.w-alt-badge .w-alt-tag {
  color: var(--muted);
  font-weight: 500;
  font-size: 0.88em;
}
.w-alt-badge .w-alt-word {
  color: var(--accent);
  background: #edf3fd;
  padding: 0.08em 0.45em;
  border-radius: 0.4em;
  display: inline-block;
}

.w-letters {
  display: inline-flex;
  align-items: baseline;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.w-char {
  display: inline-block;
  transform-origin: center bottom;
}
.w-char.pop {
  animation: charPop 0.28s cubic-bezier(0.3, 1.8, 0.5, 1) both;
}
@keyframes charPop {
  0% { transform: translateY(-0.35em) scale(0.65); opacity: 0; }
  60% { transform: translateY(0.05em) scale(1.18); opacity: 1; }
  100% { transform: none; opacity: 1; }
}

.w-cursor {
  display: inline-block;
  width: 3px;
  height: 0.9em;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: -0.05em;
  animation: blink 1s step-start infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.w-hidden-input {
  position: absolute;
  opacity: 0;
  pointer-events: auto;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  font-size: 16px; /* avoid auto-zoom on mobile/touch */
  border: none;
  cursor: text;
}

.w-prompt {
  font-size: clamp(18px, 1.8vw, 32px);
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 0.5em;
  min-height: 1.5em;
}
.w-prompt .badge {
  background: #ef8a3c;
}

/* ---- effects ---- */
.fx { position: fixed; pointer-events: none; z-index: 90; }
.fx-ring { width: 130px; height: 130px; border-radius: 50%; border: 5px solid var(--green); }
.fx-p { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; }

.fx-sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 95;
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.fx-sparkle svg {
  width: 100%;
  height: 100%;
  fill: currentColor;
  stroke: none;
  filter: drop-shadow(0 0 6px rgba(255, 220, 100, 0.8));
}

/* ---- finish ---- */
.finish { display: flex; flex-direction: column; align-items: center; text-align: center; }
.finish-check {
  width: clamp(90px, 9vw, 160px); height: clamp(90px, 9vw, 160px);
  padding: 2.2%;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  animation: capIn .7s cubic-bezier(.3,1.6,.5,1) both;
}
.finish-check svg { stroke-width: 3; }
.finish h2 { margin: .5em 0 .1em; font-size: clamp(36px, 4.5vw, 84px); font-weight: 600; }
.finish p { margin: 0; font-size: clamp(18px, 1.8vw, 32px); color: var(--muted); }
.finish-actions { display: flex; gap: 16px; margin-top: 2em; }
.btn {
  padding: .7em 1.5em;
  border: 3px solid var(--chip-border);
  border-radius: 999px;
  background: #fff;
  font-size: clamp(18px, 1.6vw, 28px);
  cursor: pointer;
}
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }

@media (max-width: 800px) {
  .tabs { grid-template-columns: 1fr; }
  .tab { min-height: 160px; }
  .tab-art { display: none; }
}
  </style>
</head>
<body>

  <!-- ============ LANDING ============ -->
  <section id="home" class="view active">
    <header class="home-head">
      <h1>Sentence Workbench</h1>
    </header>

    <div class="tabs">
      <button class="tab t1" data-go="exploded" type="button">
        <div class="tab-art art-exploded">
          <span>put</span><span>the</span><span>desk</span><span>on</span>
        </div>
        <div>
          <div class="tab-title">Exploded<br />Sentences</div>

  <!-- ============ MAGNIFIER LENS ============ -->
  <div id="lens" aria-hidden="true">

  <script>
(() => {
  'use strict';

  /* =========================================================
     DATA — EXPLODED SENTENCES
     ========================================================= */
  const RAW_EXPLODED = [
    ['your / desk / books / on / put / the',        ['put your books on the desk', 'put the books on your desk'], '.'],
    ['line / scissors / along / cut / the / with',  ['cut along the line with scissors'], '.'],
    ['door / behind / please / the / close / you',  ['please close the door behind you'], '.'],
    ['can / pencil / borrow / your / I',            ['can I borrow your pencil'], '?'],
    ['making / what / you / are / paper / with',    ['what are you making with paper'], '?'],
    ['lunch / we / noodles / eat / for / hot',      ['we eat hot noodles for lunch', 'for lunch we eat hot noodles'], '.'],
    ['today / help / you / can / me',               ['can you help me today'], '?'],
    ['like / game / to / play / this / you / do',   ['do you like to play this game'], '?'],
    ['bus / why / the / late / is / school',        ['why is the school bus late'], '?'],
    ['sweet / we / market / fruit / buy / at / the',['we buy sweet fruit at the market', 'at the market we buy sweet fruit'], '.'],
  ];
  const SENTENCES = RAW_EXPLODED.map(([w, a, end]) => ({
    words: w.split('/').map(s => s.trim()),
    answers: a.map(x => x.split(' ')),
    end,
  }));

  /* =========================================================
     DATA — W-QUESTIONS
     ========================================================= */
  const RAW_W = [
    { stem: 'is sitting next to the door?', answers: ['Who'] },
    { stem: 'forgot their water bottle on the playground?', answers: ['Who'] },
    { stem: 'is the fastest runner in our class?', answers: ['Who'] },
    { stem: 'did you bring for morning snack?', answers: ['What'] },
    { stem: 'do we do after art class?', answers: ['What'] },
    { stem: 'do the teachers go during lunch break?', answers: ['Where'] },
    { stem: 'is my shoe?  I think someone is hiding it!', answers: ['Where'] },
    { stem: 'do we have our swimming lesson?', answers: ['When', 'Where', 'Why'] },
    { stem: 'is your birthday party?', answers: ['When', 'Where'] },
    { stem: 'is the floor so wet?', answers: ['Why'] },
    { stem: 'are you running inside the hallway?', answers: ['Why'] },
  ];

  const ZOOM = 1.5;

  /* =========================================================
     SOUND — soft synthesized tones through a low-pass filter
     ========================================================= */
  const Sound = (() => {
    let ctx, master, muted = false;
    function init() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 3000; lp.Q.value = 0.4;
      master = ctx.createGain(); master.gain.value = 0.55;
      master.connect(lp); lp.connect(ctx.destination);
    }
    function tone(freq, when = 0, dur = 0.2, o = {}) {
      if (!ctx || muted) return;
      const t = ctx.currentTime + when;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      if (o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t + dur);
      const peak = o.gain ?? 0.2, a = o.attack ?? 0.008;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.05);
    }
    // gentle pentatonic ladder
    const LADDER = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
    return {
      init,
      toggle() { muted = !muted; return muted; },
      pick()  { tone(620, 0, 0.07, { gain: 0.07 }); },
      letter(len) {
        // Soft marimba-like typing tone scaling with letter position
        const f = LADDER[Math.min(len - 1, LADDER.length - 1)] || 440;
        tone(f, 0, 0.16, { type: 'triangle', gain: 0.15 });
        tone(f * 1.5, 0, 0.08, { gain: 0.04 });
      },
      backspace() {
        tone(330, 0, 0.08, { type: 'sine', gain: 0.08, glide: 260 });
      },
      place(i) {
        const f = LADDER[Math.min(i, LADDER.length - 1)];
        tone(f, 0, 0.4, { type: 'triangle', gain: 0.22 });
        tone(f * 2, 0, 0.16, { gain: 0.04 });
      },
      wrong() {
        tone(196, 0, 0.17, { type: 'triangle', gain: 0.26, glide: 150 });
        tone(147, 0.1, 0.26, { type: 'triangle', gain: 0.22, glide: 110 });
      },
      complete() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.085, 0.7, { type: 'triangle', gain: 0.15 }));
      },
      fix() {
        tone(440, 0, 0.35, { type: 'triangle', gain: 0.12 });
        [880, 1108.73, 1318.51, 1760].forEach((f, i) => tone(f, i * 0.045, 0.35, { gain: 0.07 }));
      },
      miss() { tone(250, 0, 0.12, { gain: 0.1, glide: 180 }); },
      finale() {
        [523.25, 659.25, 783.99].forEach(f => tone(f, 0, 1.3, { type: 'triangle', gain: 0.11 }));
        [1046.5, 1318.51, 1567.98, 2093].forEach((f, i) => tone(f, 0.18 + i * 0.07, 0.6, { gain: 0.05 }));
      },
    };
  })();

  /* =========================================================
     BURST FX
     ========================================================= */
  function burst(el, count = 14) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;

    const ring = document.createElement('div');
    ring.className = 'fx fx-ring';
    Object.assign(ring.style, { left: cx + 'px', top: cy + 'px' });
    document.body.appendChild(ring);
    ring.animate(
      [{ transform: 'translate(-50%,-50%) scale(.2)', opacity: 0.9 }, { transform: 'translate(-50%,-50%) scale(1.5)', opacity: 0 }],
      { duration: 650, easing: 'cubic-bezier(.2,.7,.3,1)' }
    ).onfinish = () => ring.remove();

    const colors = ['#18995a', '#f2b632', '#2f6fe4', '#5cc98d'];
    for (let k = 0; k < count; k++) {
      const p = document.createElement('div');
      p.className = 'fx fx-p';
      p.style.background = colors[k % colors.length];
      Object.assign(p.style, { left: cx + 'px', top: cy + 'px' });
      document.body.appendChild(p);
      const a = (k / count) * Math.PI * 2 + Math.random() * 0.4;
      const d = 70 + Math.random() * 70;
      p.animate(
        [{ transform: 'translate(0,0) scale(1)', opacity: 1 },
         { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(0)`, opacity: 0.6 }],
        { duration: 600 + Math.random() * 300, easing: 'cubic-bezier(.2,.7,.3,1)' }
      ).onfinish = () => p.remove();
    }
  }

  /* Full screen sparkly explosion with 4-point star SVGs */
  function sparkleExplosion(originEl, count = 28) {
    const r = originEl ? originEl.getBoundingClientRect() : { left: innerWidth / 2 - 50, top: innerHeight / 2 - 20, width: 100, height: 40 };
    const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
    const sparkleColors = ['#ffd700', '#ffea79', '#ff9f1c', '#2ec4b6', '#3a86ff', '#ffffff', '#70e000', '#ff006e'];

    // 1. Concentric shockwave sparkles
    for (let i = 0; i < count; i++) {
      const sp = document.createElement('div');
      sp.className = 'fx fx-sparkle';
      sp.style.color = sparkleColors[i % sparkleColors.length];
      sp.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>';
      
      const startX = ox + (Math.random() - 0.5) * 40;
      const startY = oy + (Math.random() - 0.5) * 20;
      Object.assign(sp.style, { left: startX + 'px', top: startY + 'px' });
      document.body.appendChild(sp);

      const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
      const dist = 120 + Math.random() * 260;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      const spin = (Math.random() > 0.5 ? 1 : -1) * (180 + Math.random() * 360);
      const scale = 0.8 + Math.random() * 1.4;
      const dur = 750 + Math.random() * 500;

      sp.animate([
        { transform: 'scale(0.1) rotate(0deg)', opacity: 1 },
        { transform: `translate(${tx * 0.5}px, ${ty * 0.5}px) scale(${scale * 1.3}) rotate(${spin * 0.5}deg)`, opacity: 1, offset: 0.4 },
        { transform: `translate(${tx}px, ${ty}px) scale(0) rotate(${spin}deg)`, opacity: 0 }
      ], {
        duration: dur,
        easing: 'cubic-bezier(0.15, 0.85, 0.35, 1.2)'
      }).onfinish = () => sp.remove();
    }

    // 2. Additional ambient sparkles popping around the whole view
    for (let j = 0; j < 14; j++) {
      const amb = document.createElement('div');
      amb.className = 'fx fx-sparkle';
      amb.style.color = sparkleColors[(j + 2) % sparkleColors.length];
      amb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>';
      
      const rx = innerWidth * (0.15 + Math.random() * 0.7);
      const ry = innerHeight * (0.15 + Math.random() * 0.7);
      Object.assign(amb.style, { left: rx + 'px', top: ry + 'px' });
      document.body.appendChild(amb);

      const delay = 100 + Math.random() * 400;
      const dur = 600 + Math.random() * 400;
      amb.animate([
        { transform: 'scale(0) rotate(-60deg)', opacity: 0 },
        { transform: 'scale(1.2) rotate(45deg)', opacity: 1, offset: 0.5 },
        { transform: 'scale(0) rotate(120deg)', opacity: 0 }
      ], {
        duration: dur,
        delay: delay,
        easing: 'ease-out'
      }).onfinish = () => amb.remove();
    }
  }

  /* =========================================================
     GLOBAL NAV & SETUP
     ========================================================= */
  const $ = s => document.querySelector(s);
  const wait = ms => new Promise(r => setTimeout(r, ms));

  document.addEventListener('pointerdown', () => Sound.init(), true);

  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id));
    if (id !== 'exploded') {
      exitFixMode();
    }
  }

  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const target = b.dataset.go;
    if (target === 'exploded') {
      showView('exploded');
      renderSlide(idx < SENTENCES.length ? idx : 0, 0);
    } else if (target === 'wquestions') {
      showView('wquestions');
      startWQuestions();
    }
  }));

  $('#homeBtn').onclick = () => showView('home');
  $('#wHomeBtn').onclick = () => showView('home');

  document.querySelectorAll('.sound-toggle-btn').forEach(btn => {
    btn.onclick = () => {
      const isMuted = Sound.toggle();
      document.querySelectorAll('.sound-toggle-btn').forEach(b => b.classList.toggle('muted', isMuted));
    };
  });

  document.querySelectorAll('.fs-btn').forEach(btn => {
    btn.onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    };
  });

  // Global arrow navigation based on active view
  document.addEventListener('keydown', e => {
    if ($('#exploded').classList.contains('active')) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') goNext();
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') goPrev();
    } else if ($('#wquestions').classList.contains('active')) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') wGoNext();
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') wGoPrev();
    }
  });

  /* =========================================================
     1. EXPLODED SENTENCES MODULE
     ========================================================= */
  const stage = $('#stage'), dotsEl = $('#dots');
  const prevBtn = $('#prevBtn'), nextBtn = $('#nextBtn');
  const lens = $('#lens'), lensGlass = $('#lens .lens-glass'), lensContent = $('#lens .lens-content');

  let idx = 0, placed = [], busy = false, phase = 'idle', token = 0;
  let cur = null, targets = [], misses = 0, cloneInfo = null;
  let px = innerWidth / 2, py = innerHeight / 2, hasPointer = false, raf = 0;
  const completed = new Set();

  $('#restartBtn').onclick = () => { if (idx < SENTENCES.length) renderSlide(idx, 0); };
  prevBtn.onclick = goPrev;
  nextBtn.onclick = goNext;

  function goNext() {
    if (idx < SENTENCES.length - 1) renderSlide(idx + 1, 1);
    else if (idx === SENTENCES.length - 1) renderFinish();
  }
  function goPrev() { if (idx > 0) renderSlide(idx - 1, -1); }

  SENTENCES.forEach((_, k) => {
    const d = document.createElement('button');
    d.className = 'dot'; d.type = 'button'; d.title = `Sentence ${k + 1}`;
    d.onclick = () => { if (k !== idx) renderSlide(k, k > idx ? 1 : -1); };
    dotsEl.appendChild(d);
  });
  function updateDots() {
    [...dotsEl.children].forEach((d, k) => {
      d.classList.toggle('current', k === idx);
      d.classList.toggle('done', completed.has(k));
    });
  }

  function swapSlide(slide, dir) {
    const old = stage.querySelector('.slide:not(.leaving)');
    if (old) {
      old.classList.add('leaving', dir < 0 ? 'out-right' : 'out-left');
      setTimeout(() => old.remove(), 400);
    }
    slide.classList.add(dir > 0 ? 'in-right' : dir < 0 ? 'in-left' : 'in-fade');
    stage.appendChild(slide);
  }

  function renderSlide(i, dir) {
    exitFixMode();
    document.querySelectorAll('.chip.floating, .fx').forEach(n => n.remove());
    token++; idx = i; placed = []; busy = false; phase = 'sort'; misses = 0; targets = [];

    const s = SENTENCES[i];
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = '<div class="line-wrap"><div class="line"></div></div><div class="prompt"></div><div class="bank"></div>';
    const line = slide.querySelector('.line'), bank = slide.querySelector('.bank');

    s.words.forEach((w, k) => {
      const sl = document.createElement('span');
      sl.className = 'slot';
      sl.style.setProperty('--k', k);
      line.appendChild(sl);

      const c = document.createElement('button');
      c.type = 'button'; c.className = 'chip';
      c.textContent = w; c.dataset.word = w;
      attachChip(c);
      bank.appendChild(c);
    });

    cur = { slide, line, bank, s, wrap: slide.querySelector('.line-wrap'), prompt: slide.querySelector('.prompt') };
    swapSlide(slide, dir);
    updateDots();
    prevBtn.disabled = i === 0;
    nextBtn.disabled = false;
    nextBtn.classList.remove('ready');
  }

  function attachChip(chip) {
    chip.addEventListener('pointerdown', e => {
      if (phase !== 'sort' || chip.classList.contains('placeholder')) return;
      e.preventDefault();
      const start = { x: e.clientX, y: e.clientY };
      const rect = chip.getBoundingClientRect();
      let drag = null, dx = 0, dy = 0;
      chip.setPointerCapture(e.pointerId);

      const move = ev => {
        dx = ev.clientX - start.x; dy = ev.clientY - start.y;
        if (!drag) {
          if (busy || Math.hypot(dx, dy) < 8) return;
          drag = makeFloating(chip, rect);
          chip.classList.add('placeholder');
          Sound.pick();
        }
        drag.style.transform = `translate(${dx}px, ${dy}px) scale(1.06) rotate(${Math.max(-4, Math.min(4, dx / 40))}deg)`;
        cur.wrap.classList.toggle('drop-hover', overLine(ev));
      };
      const up = ev => {
        chip.removeEventListener('pointermove', move);
        chip.removeEventListener('pointerup', up);
        chip.removeEventListener('pointercancel', up);
        cur.wrap.classList.remove('drop-hover');
        if (drag) {
          if (ev.type === 'pointerup' && overLine(ev) && !busy) {
            drag.remove();
            tryPlace(chip, { left: rect.left + dx, top: rect.top + dy, width: rect.width, height: rect.height });
          } else {
            flyBack(drag, chip, dx, dy);
          }
        } else if (ev.type === 'pointerup' && !busy) {
          Sound.pick();
          tryPlace(chip, rect);
        }
      };
      chip.addEventListener('pointermove', move);
      chip.addEventListener('pointerup', up);
      chip.addEventListener('pointercancel', up);
    });
  }

  function overLine(ev) {
    const r = cur.wrap.getBoundingClientRect(), pad = 40;
    return ev.clientX > r.left - pad && ev.clientX < r.right + pad && ev.clientY > r.top - pad && ev.clientY < r.bottom + pad;
  }

  function makeFloating(chip, r) {
    const f = chip.cloneNode(true);
    f.classList.remove('placeholder', 'dud');
    f.classList.add('floating');
    Object.assign(f.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    document.body.appendChild(f);
    return f;
  }

  function flyTo(f, to, dur = 360) {
    const from = { left: f.style.left, top: f.style.top };
    f.style.left = to.left + 'px';
    f.style.top = to.top + 'px';
    return f.animate(
      [{ left: from.left, top: from.top }, { left: to.left + 'px', top: to.top + 'px' }],
      { duration: dur, easing: 'cubic-bezier(.25,.8,.25,1)' }
    ).finished;
  }

  async function flyBack(f, chip, dx, dy) {
    const tk = token;
    f.style.transform = 'none';
    await f.animate(
      [{ transform: `translate(${dx}px, ${dy}px) scale(1.06)` }, { transform: 'none' }],
      { duration: 320, easing: 'cubic-bezier(.25,.8,.25,1)' }
    ).finished;
    f.remove();
    if (tk === token) chip.classList.remove('placeholder');
  }

  async function tryPlace(chip, from) {
    if (busy || phase !== 'sort') return;
    busy = true;
    const tk = token;
    const word = chip.dataset.word, i = placed.length;
    const slot = cur.line.children[i];
    chip.classList.add('placeholder');

    slot.textContent = word;
    slot.classList.add('filled', 'ghost');
    const to = slot.getBoundingClientRect();
    const valid = cur.s.answers.some(a => a[i] === word && placed.every((w, k) => a[k] === w));

    const fly = makeFloating(chip, from);
    await flyTo(fly, to, 340);
    if (tk !== token) { fly.remove(); return; }

    if (valid) {
      placed.push(word);
      slot.classList.remove('ghost');
      slot.classList.add('correct', 'pop');
      slot.addEventListener('animationend', () => slot.classList.remove('pop'), { once: true });
      fly.remove();
      removeFromBank(chip);
      Sound.place(i);
      busy = false;
      if (placed.length === cur.s.words.length) onSorted();
    } else {
      Sound.wrong();
      fly.classList.add('wrong');
      await fly.animate(
        [0, -16, 13, -10, 7, -3, 0].map(x => ({ transform: `translateX(${x}px)` })),
        { duration: 460, easing: 'ease-out' }
      ).finished;
      slot.textContent = '';
      slot.classList.remove('filled', 'ghost');
      if (tk !== token) { fly.remove(); return; }
      await flyTo(fly, chip.getBoundingClientRect(), 380);
      fly.remove();
      if (tk !== token) return;
      chip.classList.remove('placeholder');
      chip.classList.add('dud');
      chip.addEventListener('animationend', () => chip.classList.remove('dud'), { once: true });
      busy = false;
    }
  }

  function removeFromBank(chip) {
    const sibs = [...cur.bank.children].filter(c => c !== chip);
    const before = sibs.map(c => c.getBoundingClientRect());
    chip.remove();
    sibs.forEach((c, k) => {
      const b = c.getBoundingClientRect();
      const dx = before[k].left - b.left, dy = before[k].top - b.top;
      if (dx || dy) c.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
        { duration: 320, easing: 'cubic-bezier(.25,.8,.25,1)' });
    });
  }

  async function onSorted() {
    const tk = token;
    phase = 'transition';
    await wait(300);
    if (tk !== token) return;
    cur.line.classList.add('all-correct');
    Sound.complete();
    await wait(1100);
    if (tk !== token) return;
    cur.line.classList.remove('all-correct');
    cur.line.classList.add('text-mode');
    cur.bank.classList.add('gone');
    await wait(650);
    if (tk !== token) return;
    setupFix();
  }

  function setupFix() {
    const slots = [...cur.line.children];
    targets = [];

    const first = slots[0], w = first.textContent;
    if (w[0] !== w[0].toUpperCase()) {
      first.innerHTML = `<span class="cap-target">${w[0]}</span>${w.slice(1)}`;
      targets.push({ type: 'cap', el: first.querySelector('.cap-target'), value: w[0].toUpperCase(), done: false });
    }
    const end = document.createElement('span');
    end.className = 'end-target';
    slots[slots.length - 1].appendChild(end);
    targets.push({ type: 'end', el: end, value: cur.s.end, done: false });

    updatePrompt();
    cur.prompt.classList.add('show');
    enterFixMode();
  }

  function updatePrompt(bump) {
    const left = targets.filter(t => !t.done).length;
    if (!left) return;
    cur.prompt.innerHTML =
      `<span class="badge${bump ? ' bump' : ''}">${left}</span>` +
      `<span>${left === 1 ? 'thing is' : 'things are'} missing — use the magnifier to fix ${left === 1 ? 'it' : 'them'}!</span>`;
  }

  function enterFixMode() {
    phase = 'fix';
    document.body.classList.add('fix-mode');
    if (!hasPointer) {
      const r = cur.line.getBoundingClientRect();
      px = r.left + r.width / 2; py = r.top + r.height / 2;
    }
    buildClone();
    updateLens();
    lens.classList.add('on');
  }

  function exitFixMode() {
    document.body.classList.remove('fix-mode');
    lens.classList.remove('on', 'applying', 'miss');
    cloneInfo = null;
    lensContent.replaceChildren();
  }

  function buildClone() {
    if (!cur) return;
    const src = cur.line, r = src.getBoundingClientRect();
    const c = src.cloneNode(true);
    [c, ...c.querySelectorAll('*')].forEach(n => { n.style.animation = 'none'; n.style.transition = 'none'; });
    Object.assign(c.style, {
      position: 'absolute', left: '0', top: '0', margin: '0',
      width: r.width + 'px', height: r.height + 'px',
      transformOrigin: '0 0',
    });
    lensContent.replaceChildren(c);
    cloneInfo = { left: r.left, top: r.top, el: c };
  }

  function updateLens() {
    lens.style.left = px + 'px';
    lens.style.top = py + 'px';
    if (!cloneInfo) return;
    const R = lensGlass.clientWidth / 2;
    const lx = px - cloneInfo.left, ly = py - cloneInfo.top;
    cloneInfo.el.style.transform = `translate(${R - lx * ZOOM}px, ${R - ly * ZOOM}px) scale(${ZOOM})`;
  }

  window.addEventListener('pointermove', e => {
    px = e.clientX; py = e.clientY; hasPointer = true;
    if (phase !== 'fix') return;
    lens.classList.toggle('on', !!e.target.closest('#stage'));
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; updateLens(); });
  });
  document.documentElement.addEventListener('mouseleave', () => { if (phase === 'fix') lens.classList.remove('on'); });
  window.addEventListener('resize', () => { if (phase === 'fix') { buildClone(); updateLens(); } });

  stage.addEventListener('pointerdown', e => {
    if (phase !== 'fix') return;
    px = e.clientX; py = e.clientY;
    lens.classList.add('on');
    updateLens();

    const reach = (lensGlass.clientWidth / 2) * 0.8 / ZOOM + 12;
    const hits = targets.filter(t => !t.done && distToRect(px, py, t.el.getBoundingClientRect()) <= reach);

    if (!hits.length) {
      misses++;
      Sound.miss();
      lens.classList.remove('miss'); void lens.offsetWidth; lens.classList.add('miss');
      if (misses >= 3) targets.forEach(t => !t.done && t.el.classList.add('hint'));
      return;
    }
    hits.forEach(applyFix);
  });

  function distToRect(x, y, r) {
    const dx = Math.max(r.left - x, 0, x - r.right);
    const dy = Math.max(r.top - y, 0, y - r.bottom);
    return Math.hypot(dx, dy);
  }

  function applyFix(t) {
    const tk = token;
    t.done = true;
    t.el.classList.remove('hint');
    if (t.type === 'cap') {
      t.el.classList.add('cap-out');
      setTimeout(() => {
        t.el.textContent = t.value;
        t.el.classList.remove('cap-out');
        t.el.classList.add('fixed', 'cap-in');
      }, 220);
    } else {
      t.el.textContent = t.value;
      t.el.classList.add('fixed', 'mark-in');
    }
    setTimeout(() => burst(t.el), t.type === 'cap' ? 220 : 120);
    Sound.fix();

    lens.classList.add('applying');
    setTimeout(() => {
      if (tk !== token || phase !== 'fix') return;
      buildClone(); updateLens();
      lens.classList.remove('applying');
    }, 950);

    updatePrompt(true);
    if (targets.every(x => x.done)) setTimeout(() => { if (tk === token) onAllFixed(); }, 900);
  }

  function onAllFixed() {
    phase = 'done';
    exitFixMode();
    completed.add(idx);
    updateDots();
    cur.wrap.classList.add('celebrate');
    cur.prompt.innerHTML = '<span class="badge ok bump">✓</span><span>Perfect sentence!</span>';
    Sound.finale();
    sparkleExplosion(cur.wrap, 32);
    nextBtn.classList.add('ready');
  }

  function renderFinish() {
    exitFixMode();
    token++; phase = 'finish'; idx = SENTENCES.length;
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = `
      <div class="finish">
        <div class="finish-check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2>All done!</h2>
        <p>${completed.size} of ${SENTENCES.length} sentences fixed</p>
        <div class="finish-actions">
          <button class="btn primary" data-act="again" type="button">Start again</button>
          <button class="btn" data-act="home" type="button">Home</button>
        </div>
      </div>`;
    slide.querySelector('[data-act="again"]').onclick = () => { completed.clear(); renderSlide(0, 1); };
    slide.querySelector('[data-act="home"]').onclick = () => { completed.clear(); idx = 0; showView('home'); };
    swapSlide(slide, 1);
    updateDots();
    prevBtn.disabled = false;
    nextBtn.disabled = true;
    nextBtn.classList.remove('ready');
    setTimeout(() => { Sound.finale(); burst(slide.querySelector('.finish-check'), 24); }, 350);
  }

  /* Helper to shuffle array (Fisher-Yates) */
  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* =========================================================
     2. W-QUESTIONS MODULE
     ========================================================= */
  const wStage = $('#wStage'), wDotsEl = $('#wDots');
  const wPrevBtn = $('#wPrevBtn'), wNextBtn = $('#wNextBtn');

  let wList = shuffleArray(RAW_W);
  let wIdx = 0, wToken = 0, wState = null;
  const wCompleted = new Set();

  function initWDots() {
    wDotsEl.innerHTML = '';
    wList.forEach((_, k) => {
      const d = document.createElement('button');
      d.className = 'dot'; d.type = 'button'; d.title = `Question ${k + 1}`;
      d.onclick = () => { if (k !== wIdx) wRenderSlide(k, k > wIdx ? 1 : -1); };
      wDotsEl.appendChild(d);
    });
  }

  function startWQuestions() {
    wList = shuffleArray(RAW_W);
    wCompleted.clear();
    initWDots();
    wRenderSlide(0, 0);
  }

  $('#wRestartBtn').onclick = () => { if (wIdx < wList.length) wRenderSlide(wIdx, 0); };
  wPrevBtn.onclick = wGoPrev;
  wNextBtn.onclick = wGoNext;

  function wGoNext() {
    if (wIdx < wList.length - 1) wRenderSlide(wIdx + 1, 1);
    else if (wIdx === wList.length - 1) wRenderFinish();
  }
  function wGoPrev() { if (wIdx > 0) wRenderSlide(wIdx - 1, -1); }

  function wUpdateDots() {
    [...wDotsEl.children].forEach((d, k) => {
      d.classList.toggle('current', k === wIdx);
      d.classList.toggle('done', wCompleted.has(k));
    });
  }

  function wSwapSlide(slide, dir) {
    const old = wStage.querySelector('.slide:not(.leaving)');
    if (old) {
      old.classList.add('leaving', dir < 0 ? 'out-right' : 'out-left');
      setTimeout(() => old.remove(), 400);
    }
    slide.classList.add(dir > 0 ? 'in-right' : dir < 0 ? 'in-left' : 'in-fade');
    wStage.appendChild(slide);
  }

  function wRenderSlide(i, dir) {
    document.querySelectorAll('.fx').forEach(n => n.remove());
    wToken++; wIdx = i;
    const item = wList[i];

    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = `
      <div class="line-wrap">
        <div class="w-sentence">
          <div class="w-input-slot" tabindex="0">
            <span class="w-letters"></span>
            <span class="w-cursor"></span>
            <input class="w-hidden-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
          </div>
          <span class="w-stem-text"> ${item.stem}</span>
        </div>
      </div>
      <div class="w-prompt">
        <span class="badge">W</span>
        <span>Type the question word (remember Capital Letter!) to complete</span>
      </div>
    `;

    const inputSlot = slide.querySelector('.w-input-slot');
    const lettersEl = slide.querySelector('.w-letters');
    const hiddenInput = slide.querySelector('.w-hidden-input');
    const wrap = slide.querySelector('.line-wrap');
    const prompt = slide.querySelector('.w-prompt');

    wState = {
      i,
      item,
      slide,
      wrap,
      prompt,
      inputSlot,
      lettersEl,
      hiddenInput,
      value: '',
      done: false,
      busy: false,
    };

    wSwapSlide(slide, dir);
    wUpdateDots();
    wPrevBtn.disabled = i === 0;
    wNextBtn.disabled = false;
    wNextBtn.classList.remove('ready');

    setupWInput(wState);
  }

  function setupWInput(state) {
    const { inputSlot, hiddenInput, lettersEl, wrap, prompt, item } = state;

    function renderLetters(str, isAddingChar = false) {
      lettersEl.innerHTML = '';
      for (let k = 0; k < str.length; k++) {
        const span = document.createElement('span');
        span.className = 'w-char';
        span.textContent = str[k];
        if (isAddingChar && k === str.length - 1) {
          span.classList.add('pop');
        }
        lettersEl.appendChild(span);
      }
    }

    inputSlot.addEventListener('click', () => hiddenInput.focus());
    hiddenInput.addEventListener('focus', () => inputSlot.classList.add('focused'));
    hiddenInput.addEventListener('blur', () => inputSlot.classList.remove('focused'));

    setTimeout(() => {
      if ($('#wquestions').classList.contains('active')) {
        hiddenInput.focus();
      }
    }, 150);

    hiddenInput.addEventListener('keydown', async e => {
      if (state.done || state.busy) {
        if (e.key === 'Enter' && state.done) {
          wGoNext();
        }
        return;
      }

      if (e.key === 'Backspace') {
        if (state.value.length > 0) {
          state.value = state.value.slice(0, -1);
          renderLetters(state.value);
          Sound.backspace();
        }
        return;
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        checkAnswer();
        return;
      }

      // Preserve exact case as typed by student so they must capitalize the first letter themselves!
      if (e.key.length === 1 && /^[a-zA-Z]$/.test(e.key)) {
        e.preventDefault();
        const char = e.key;

        state.value += char;
        renderLetters(state.value, true);
        Sound.letter(state.value.length);

        // Instant validation check if word matches target answers with EXACT case
        const isExactMatch = item.answers.some(ans => ans === state.value);
        if (isExactMatch) {
          checkAnswer();
        }
      }
    });

    async function checkAnswer() {
      if (state.done || state.busy || !state.value.trim()) return;
      const val = state.value.trim();
      
      // Strict case-sensitive match (requires Capital first letter, e.g., 'Who', 'What', 'Where', 'When', 'Why')
      const matched = item.answers.find(ans => ans === val);

      if (matched) {
        state.busy = true;
        state.done = true;
        state.value = matched;
        renderLetters(matched);

        inputSlot.classList.remove('focused');
        inputSlot.classList.add('correct');
        const cursor = inputSlot.querySelector('.w-cursor');
        if (cursor) cursor.remove();
        hiddenInput.disabled = true;

        Sound.complete();
        burst(inputSlot, 16);
        sparkleExplosion(inputSlot, 32);
        wrap.classList.add('celebrate');

        // Animate-show other valid choices above the typed in word if multiple exist
        const otherOptions = item.answers.filter(ans => ans !== matched);
        if (otherOptions.length > 0) {
          const badge = document.createElement('div');
          badge.className = 'w-alt-badge';
          const listHtml = otherOptions.map(w => `<span class="w-alt-word">${w}</span>`).join(' or ');
          badge.innerHTML = `<span class="w-alt-tag">Also works:</span> ${listHtml}`;
          inputSlot.appendChild(badge);
          setTimeout(() => badge.classList.add('show'), 200);
        }

        prompt.innerHTML = '<span class="badge ok bump">✓</span><span>Great job! Perfect Capital Letter.</span>';
        wCompleted.add(state.i);
        wUpdateDots();
        wNextBtn.classList.add('ready');
        state.busy = false;
      } else {
        state.busy = true;
        Sound.wrong();
        inputSlot.classList.add('shake');
        
        // Helpful gentle tip if they got the word right but forgot the capital letter
        const matchIgnoringCase = item.answers.find(ans => ans.toLowerCase() === val.toLowerCase());
        if (matchIgnoringCase && val[0] !== val[0].toUpperCase()) {
          prompt.innerHTML = '<span class="badge" style="background:var(--red);">!</span><span>Remember: start with a Capital Letter!</span>';
        }
        
        await wait(750);
        inputSlot.classList.remove('shake');
        state.busy = false;
      }
    }
  }

  function wRenderFinish() {
    wToken++; wIdx = wList.length;
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = `
      <div class="finish">
        <div class="finish-check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2>All done!</h2>
        <p>${wCompleted.size} of ${wList.length} questions completed</p>
        <div class="finish-actions">
          <button class="btn primary" data-act="again" type="button">Start again</button>
          <button class="btn" data-act="home" type="button">Home</button>
        </div>
      </div>`;
    slide.querySelector('[data-act="again"]').onclick = () => { startWQuestions(); };
    slide.querySelector('[data-act="home"]').onclick = () => { wCompleted.clear(); wIdx = 0; showView('home'); };
    wSwapSlide(slide, 1);
    wUpdateDots();
    wPrevBtn.disabled = false;
    wNextBtn.disabled = true;
    wNextBtn.classList.remove('ready');
    setTimeout(() => {
      Sound.finale();
      burst(slide.querySelector('.finish-check'), 24);
      sparkleExplosion(slide.querySelector('.finish-check'), 40);
    }, 350);
  }


})();
  </script>
</body>
</html>
