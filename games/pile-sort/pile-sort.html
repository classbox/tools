<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Game</title>
    <style>
        /* Default CSS Theme Variables */
        :root {
            --bg-color: #f0f8ff;
            --bin-0-color: #bbdefb;
            --bin-1-color: #f8bbd0;
            --bin-2-color: #ffcc80;
            --bin-3-color: #c8e6c9;
            --bin-text-color: #333333;
            --word-bg: #ffffff;
            --word-text: #222222;
            --word-border: #333333;
            --correct-color: #00e676;
            --wrong-color: #ff1744;
        }

        /* Color Themes */
        body.theme-pastel {
            --bg-color: #f0f8ff;
            --bin-0-color: #bbdefb;
            --bin-1-color: #f8bbd0;
            --bin-2-color: #ffcc80;
            --bin-3-color: #c8e6c9;
            --bin-text-color: #333333;
            --word-bg: #ffffff;
            --word-text: #222222;
            --word-border: #333333;
        }

        body.theme-neon {
            --bg-color: #121212;
            --bin-0-color: #00e5ff;
            --bin-1-color: #ff007f;
            --bin-2-color: #ffea00;
            --bin-3-color: #76ff03;
            --bin-text-color: #000000;
            --word-bg: #1e1e2e;
            --word-text: #ffffff;
            --word-border: #00e5ff;
        }

        body.theme-forest {
            --bg-color: #e8efe6;
            --bin-0-color: #81c784;
            --bin-1-color: #a1887f;
            --bin-2-color: #ffd54f;
            --bin-3-color: #4db6ac;
            --bin-text-color: #1b2e1c;
            --word-bg: #ffffff;
            --word-text: #1b2e1c;
            --word-border: #2e3d2f;
        }

        body.theme-ocean {
            --bg-color: #e0f7fa;
            --bin-0-color: #4dd0e1;
            --bin-1-color: #80deea;
            --bin-2-color: #80cbc4;
            --bin-3-color: #90caf9;
            --bin-text-color: #00363a;
            --word-bg: #ffffff;
            --word-text: #00251a;
            --word-border: #004d40;
        }

        body.theme-sunset {
            --bg-color: #2a1b3d;
            --bin-0-color: #ff6b6b;
            --bin-1-color: #fca311;
            --bin-2-color: #ff758f;
            --bin-3-color: #9d4edd;
            --bin-text-color: #ffffff;
            --word-bg: #443152;
            --word-text: #ffffff;
            --word-border: #ff758f;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', system-ui, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            touch-action: none;
            transition: background-color 0.4s ease;
        }

        /* Top Controls Container */
        #top-controls {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 50;
        }

        .control-btn {
            padding: 8px 18px;
            font-size: 1.1rem;
            background: var(--word-bg);
            color: var(--word-text);
            border: 2px solid var(--word-border);
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.1s, background-color 0.2s;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        /* 4 Corner Bins */
        .bin {
            position: absolute;
            width: 18vw;
            height: 15vh;
            min-width: 120px;
            min-height: 75px;
            border: 4px dashed rgba(0,0,0,0.3);
            border-radius: 16px;
            display: none; /* Controlled dynamically via JS */
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--bin-text-color);
            user-select: none;
            transition: background-color 0.3s, transform 0.2s, border-color 0.3s;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.1);
            z-index: 10;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
            word-break: break-word;
        }

        #bin-0 { top: 15px; left: 15px; background-color: var(--bin-0-color); }
        #bin-1 { top: 15px; right: 15px; background-color: var(--bin-1-color); }
        #bin-2 { bottom: 15px; left: 15px; background-color: var(--bin-2-color); }
        #bin-3 { bottom: 15px; right: 15px; background-color: var(--bin-3-color); }

        .bin.correct {
            background-color: var(--correct-color) !important;
            border-color: #fff;
            color: #ffffff;
            transform: scale(1.1);
        }

        .bin.wrong {
            background-color: var(--wrong-color) !important;
            border-color: #fff;
            color: white;
            transform: translateX(-8px) rotate(-4deg);
        }

        /* Central Word Pile */
        #word-cloud {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            z-index: 20;
        }

        .word {
            position: absolute;
            padding: 10px 20px;
            background: var(--word-bg);
            border: 2px solid var(--word-border);
            border-radius: 16px;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--word-text);
            cursor: grab;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
            user-select: none;
            touch-action: none; 
            transition: transform 0.4s ease, opacity 0.4s ease, left 0.4s ease, top 0.4s ease;
        }

        .word.dragging {
            transition: none !important; 
            z-index: 100 !important;
            cursor: grabbing;
            box-shadow: 8px 8px 20px rgba(0,0,0,0.3);
            transform: scale(1.1) !important; 
        }

        /* Dark overlay for settings */
        #settings-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
        }

        /* Spacious Settings Menu (approx 80% width and height) */
        #settings-menu {
            display: none; 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw; 
            height: 90vh;
            max-width: 1000px;
            max-height: 900px;
            background: white;
            color: #222;
            border: 4px solid #333;
            border-radius: 20px;
            padding: 24px;
            z-index: 2000;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            display: none; /* Controlled by toggleMenu */
            flex-direction: column;
            box-sizing: border-box;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .settings-header h3 {
            margin: 0;
            font-size: 1.6rem;
        }

        .theme-select-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-select-container label {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .theme-select-container select {
            padding: 6px 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 2px solid #ccc;
            font-family: inherit;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .settings-col {
            background: #fcfcfc;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .bucket-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .bucket-header-row label {
            font-weight: bold;
            font-size: 1rem;
        }

        .bucket-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
        }

        .bucket-toggle input[type="checkbox"] {
            transform: scale(1.2);
            cursor: pointer;
        }

        .settings-col input[type="text"] {
            width: 100%;
            font-family: inherit;
            font-size: 1.1rem;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #ccc;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .settings-col textarea {
            width: 100%; 
            flex-grow: 1;
            min-height: 120px;
            font-family: inherit; 
            font-size: 1rem;
            padding: 10px; 
            border-radius: 8px;
            border: 2px solid #ccc; 
            box-sizing: border-box;
            resize: vertical;
        }

        .controls { 
            margin-top: 16px; 
            padding-top: 12px;
            border-top: 2px solid #ddd;
            text-align: center; 
            flex-shrink: 0;
        }
        
        .controls button {
            padding: 10px 24px; font-size: 1.1rem; font-weight: bold;
            background: #4caf50; color: white;
            border: none; border-radius: 10px; cursor: pointer; margin: 0 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.15);
        }
        #close-btn { background: #f44336; }

        /* Win Screen */
        #win-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.92);
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff4081;
            z-index: 3000;
            text-align: center;
        }
    </style>
</head>
<body class="theme-pastel">

    <!-- Top Controls -->
    <div id="top-controls">
        <button id="shuffle-btn" class="control-btn">🔀 Shuffle</button>
        <button id="settings-btn" class="control-btn">⚙️ Settings</button>
    </div>

    <!-- 4 Corner Bins -->
    <div id="bin-0" class="bin" data-bin-index="0">HE</div>
    <div id="bin-1" class="bin" data-bin-index="1">SHE</div>
    <div id="bin-2" class="bin" data-bin-index="2">IT</div>
    <div id="bin-3" class="bin" data-bin-index="3">THEY</div>

    <!-- Central Word Container -->
    <div id="word-cloud"></div>

    <!-- Win Screen -->
    <div id="win-screen">
        <div>Great Job! 🎉<br>
        <button id="play-again-btn" style="font-size: 1.8rem; padding: 10px 24px; margin-top: 15px; cursor: pointer; border-radius: 12px; border: none; background: #2196f3; color: white; font-weight: bold;">Play Again</button></div>
    </div>

    <!-- Settings Overlay and Menu -->
    <div id="settings-overlay"></div>
    <div id="settings-menu">
        <div class="settings-header">
            <h3>Settings</h3>
            <div class="theme-select-container">
                <label for="theme-select">Theme:</label>
                <select id="theme-select">
                    <option value="theme-pastel">Pastel</option>
                    <option value="theme-neon">Neon</option>
                    <option value="theme-forest">Forest</option>
                    <option value="theme-ocean">Ocean</option>
                    <option value="theme-sunset">Sunset</option>
                </select>
            </div>
        </div>
        
        <div class="settings-grid">
            <div class="settings-col">
                <div class="bucket-header-row">
                    <label>Bucket 1:</label>
                    <label class="bucket-toggle"><input type="checkbox" id="bucket-active-0" checked> Active</label>
                </div>
                <input type="text" id="bucket-name-0">
                <textarea id="bucket-words-0" placeholder="One item per line"></textarea>
            </div>
            <div class="settings-col">
                <div class="bucket-header-row">
                    <label>Bucket 2:</label>
                    <label class="bucket-toggle"><input type="checkbox" id="bucket-active-1" checked> Active</label>
                </div>
                <input type="text" id="bucket-name-1">
                <textarea id="bucket-words-1" placeholder="One item per line"></textarea>
            </div>
            <div class="settings-col">
                <div class="bucket-header-row">
                    <label>Bucket 3:</label>
                    <label class="bucket-toggle"><input type="checkbox" id="bucket-active-2" checked> Active</label>
                </div>
                <input type="text" id="bucket-name-2">
                <textarea id="bucket-words-2" placeholder="One item per line"></textarea>
            </div>
            <div class="settings-col">
                <div class="bucket-header-row">
                    <label>Bucket 4:</label>
                    <label class="bucket-toggle"><input type="checkbox" id="bucket-active-3" checked> Active</label>
                </div>
                <input type="text" id="bucket-name-3">
                <textarea id="bucket-words-3" placeholder="One item per line"></textarea>
            </div>
        </div>
        
        <div class="controls">
            <button id="save-btn">Save & Restart</button>
            <button id="close-btn">Cancel</button>
        </div>
    </div>

<script>
    // --- Audio API setup ---
    let audioCtx;
    const correctAudio = new Audio('pile-sort_correct.mp3');

    function initAudio() {
        try {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) { console.warn("Audio disabled", e); }
    }

    function playCorrectSound() {
        try {
            correctAudio.currentTime = 0;
            correctAudio.play().catch(e => console.warn("Audio play blocked", e));
        } catch(e) {}
    }

    function playBuzzer() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch(e) {}
    }

    // --- Dynamic Game Data ---
    let gameBuckets = [
        { active: true, name: "HE", words: ["father", "Mr. Green", "a policeman", "brother", "uncle"] },
        { active: true, name: "SHE", words: ["grandmother", "Mrs. Jelly", "the little girl"] },
        { active: true, name: "IT", words: ["the tuk-tuk", "a mango", "my backpack", "the rain", "the dog"] },
        { active: true, name: "THEY", words: ["my sisters", "the teachers", "the cows", "Tom and Jessica", "three monkeys", "our shoes", "the books"] }
    ];

    let currentTheme = "theme-pastel";
    let wordsRemaining = 0;
    let draggedElement = null;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization Mechanism ---
    function initializeGameSystem() {
        document.getElementById('settings-btn').onclick = () => toggleMenu(true);
        document.getElementById('close-btn').onclick = () => toggleMenu(false);
        document.getElementById('save-btn').onclick = saveAndRestart;
        document.getElementById('play-again-btn').onclick = startGame;
        document.getElementById('shuffle-btn').onclick = shufflePile;

        // Instant Theme Preview
        document.getElementById('theme-select').onchange = (e) => {
            currentTheme = e.target.value;
            document.body.className = currentTheme;
        };

        populateSettings();
        startGame();
    }

    function toggleMenu(show) {
        if(show) {
            populateSettings(); // Reset fields to current config on open
        }
        document.getElementById('settings-menu').style.display = show ? 'flex' : 'none';
        document.getElementById('settings-overlay').style.display = show ? 'block' : 'none';
    }

    function populateSettings() {
        document.getElementById('theme-select').value = currentTheme;
        for (let i = 0; i < 4; i++) {
            document.getElementById(`bucket-active-${i}`).checked = gameBuckets[i].active;
            document.getElementById(`bucket-name-${i}`).value = gameBuckets[i].name;
            document.getElementById(`bucket-words-${i}`).value = gameBuckets[i].words.join("\n");
        }
    }

    function saveAndRestart() {
        currentTheme = document.getElementById('theme-select').value;
        document.body.className = currentTheme;

        for (let i = 0; i < 4; i++) {
            gameBuckets[i].active = document.getElementById(`bucket-active-${i}`).checked;
            const nameInput = document.getElementById(`bucket-name-${i}`).value.trim();
            const wordsInput = document.getElementById(`bucket-words-${i}`).value;
            
            gameBuckets[i].name = nameInput || `Bucket ${i+1}`;
            gameBuckets[i].words = wordsInput.split("\n").map(w => w.trim()).filter(w => w !== "");
        }

        toggleMenu(false);
        startGame();
    }

    function startGame() {
        document.getElementById('win-screen').style.display = 'none';
        
        // Update Bins UI & visibility
        for (let i = 0; i < 4; i++) {
            const binEl = document.getElementById(`bin-${i}`);
            if (gameBuckets[i].active) {
                binEl.style.display = 'flex';
                binEl.innerText = gameBuckets[i].name;
            } else {
                binEl.style.display = 'none';
            }
        }

        const cloud = document.getElementById('word-cloud');
        cloud.innerHTML = '';
        
        let allWords = [];
        gameBuckets.forEach((bucket, index) => {
            if (bucket.active) {
                bucket.words.forEach(text => {
                    allWords.push({ text, binIndex: index.toString() });
                });
            }
        });

        allWords.sort(() => Math.random() - 0.5); // Shuffle array
        wordsRemaining = allWords.length;

        const cloudRect = cloud.getBoundingClientRect();
        const boxWidth = cloudRect.width || (window.innerWidth * 0.6);
        const boxHeight = cloudRect.height || (window.innerHeight * 0.6);

        allWords.forEach(item => {
            const el = document.createElement('div');
            el.className = 'word';
            el.innerText = item.text;
            el.dataset.binIndex = item.binIndex;
            
            cloud.appendChild(el);

            setTimeout(() => {
                positionWordRandomly(el, boxWidth, boxHeight);
            }, 50);

            el.onmousedown = startDrag;
            el.ontouchstart = startDrag;
        });
    }

    function positionWordRandomly(el, boxWidth, boxHeight) {
        const eWidth = el.offsetWidth || 130;
        const eHeight = el.offsetHeight || 42;

        let maxX = Math.max(0, boxWidth - eWidth);
        let maxY = Math.max(0, boxHeight - eHeight);

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;
        const randomRot = (Math.random() * 20) - 10;

        el.style.left = randomX + 'px';
        el.style.top = randomY + 'px';
        el.style.transform = `rotate(${randomRot}deg)`;

        el.dataset.baseLeft = randomX;
        el.dataset.baseTop = randomY;
        el.dataset.baseRot = randomRot;
    }

    function shufflePile() {
        initAudio();
        const cloud = document.getElementById('word-cloud');
        const words = cloud.querySelectorAll('.word');
        const cloudRect = cloud.getBoundingClientRect();
        const boxWidth = cloudRect.width || (window.innerWidth * 0.6);
        const boxHeight = cloudRect.height || (window.innerHeight * 0.6);

        words.forEach(el => {
            positionWordRandomly(el, boxWidth, boxHeight);
        });
    }

    // --- Drag and Drop Engine ---
    function startDrag(e) {
        initAudio();
        e.preventDefault();
        
        draggedElement = e.target;
        
        document.querySelectorAll('.word').forEach(w => w.style.zIndex = "10");
        draggedElement.style.zIndex = "100";
        draggedElement.classList.add('dragging');

        const rect = draggedElement.getBoundingClientRect();
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;

        document.addEventListener('mousemove', moveDrag, { passive: false });
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
    }

    function moveDrag(e) {
        if (!draggedElement) return;
        e.preventDefault();

        const cloudRect = document.getElementById('word-cloud').getBoundingClientRect();
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

        const newLeft = clientX - cloudRect.left - offsetX;
        const newTop = clientY - cloudRect.top - offsetY;

        draggedElement.style.left = newLeft + 'px';
        draggedElement.style.top = newTop + 'px';
    }

    function endDrag(e) {
        if (!draggedElement) return;

        document.removeEventListener('mousemove', moveDrag);
        document.removeEventListener('touchmove', moveDrag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchend', endDrag);

        draggedElement.classList.remove('dragging');
        checkCollision(draggedElement);
        draggedElement = null;
    }

    function checkCollision(element) {
        const bins = document.querySelectorAll('.bin');
        const elRect = element.getBoundingClientRect();
        let droppedBin = null;

        bins.forEach(bin => {
            if (bin.style.display !== 'none') {
                const binRect = bin.getBoundingClientRect();
                if (elRect.left < binRect.right && elRect.right > binRect.left &&
                    elRect.top < binRect.bottom && elRect.bottom > binRect.top) {
                    if (!droppedBin) droppedBin = bin;
                }
            }
        });

        if (droppedBin) {
            if (element.dataset.binIndex === droppedBin.dataset.binIndex) {
                // ---- Correct Match ----
                playCorrectSound();
                droppedBin.classList.add('correct');
                
                element.style.transform = `scale(0)`;
                element.style.opacity = '0';

                setTimeout(() => {
                    droppedBin.classList.remove('correct');
                    if(element.parentNode) element.parentNode.removeChild(element);
                    
                    wordsRemaining--;
                    if (wordsRemaining <= 0) {
                        setTimeout(() => {
                            document.getElementById('win-screen').style.display = 'flex';
                            playCorrectSound();
                        }, 300);
                    }
                }, 400);

            } else {
                // ---- Wrong Match ----
                playBuzzer();
                droppedBin.classList.add('wrong');
                setTimeout(() => droppedBin.classList.remove('wrong'), 400);
                resetElement(element);
            }
        } else {
            // Dropped outside any bin
            resetElement(element);
        }
    }

    function resetElement(element) {
        element.style.left = element.dataset.baseLeft + 'px';
        element.style.top = element.dataset.baseTop + 'px';
        element.style.transform = `rotate(${element.dataset.baseRot}deg)`;
    }

    // Initialize Game
    initializeGameSystem();

</script>
</body>
</html>
