<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy</title>
    <style>
        /* --- CORE CSS VARIABLES --- */
        :root {
            --bg-top: #1a110a; 
            --bg-bottom: #2c1e16;
            --text-color: #f4e4bc;
            
            --c1: rgba(212, 175, 55, 0.15);
            --c2: rgba(38, 97, 156, 0.25);
            --c3: rgba(179, 90, 56, 0.2);
            --c4: rgba(46, 139, 87, 0.2);
            --c5: rgba(218, 165, 32, 0.15);
            
            --card-border: rgba(212, 175, 55, 0.5);
            --card-glow: rgba(255, 215, 0, 0.8);
            --header-bg: rgba(15, 8, 5, 0.85);
            --modal-bg: rgba(10, 5, 2, 0.95);
            
            --score-bg: rgba(212, 175, 55, 0.05);
            --score-border: rgba(212, 175, 55, 0.4);
            --score-active: #ffd700;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text-color);
            transition: background 0.5s ease, color 0.3s ease;
        }

        /* --- THEMES --- */
        body[data-theme="egypt"] { font-family: 'Georgia', 'Times New Roman', serif; }
        body[data-theme="egypt"] .board-cell {
            border-radius: 4px;
            border: 1px solid var(--card-border);
            box-shadow: 4px 6px 15px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.5);
        }

        body[data-theme="classic"] { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
        body[data-theme="classic"] .category-header,
        body[data-theme="classic"] .card,
        body[data-theme="classic"] .score-val {
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 1px;
        }
        body[data-theme="classic"] .board-cell {
            border-radius: 8px;
            border: 3px solid #ffd700;
            box-shadow: 0 6px 0 #040d2a, 0 12px 20px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.4);
            text-transform: uppercase;
        }
        body[data-theme="classic"] .card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 0 #040d2a, 0 15px 25px rgba(255,215,0,0.5);
        }

        body[data-theme="cyber"] { font-family: 'Courier New', 'Consolas', monospace; }
        body[data-theme="cyber"] .category-header,
        body[data-theme="cyber"] .card,
        body[data-theme="cyber"] .score-val {
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--score-active), 0 0 20px var(--card-glow);
        }
        body[data-theme="cyber"] .board-cell {
            border-radius: 0;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            border: 1px solid var(--card-border);
            box-shadow: 0 0 15px var(--card-glow), inset 0 0 10px var(--score-bg);
            background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
        }
        body[data-theme="cyber"] .card:hover {
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            background-color: var(--score-active) !important;
            color: #000 !important;
            text-shadow: none;
        }

        body[data-theme="space"] { font-family: 'Segoe UI', -apple-system, sans-serif; }
        body[data-theme="space"] .board-cell {
            border-radius: 18px;
            border: 1px solid rgba(128, 222, 234, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(128, 222, 234, 0.2);
        }
        body[data-theme="space"] .card:hover {
            border-color: #80deea;
            box-shadow: 0 0 30px #80deea, inset 0 0 20px rgba(255,255,255,0.4);
            transform: scale(1.04);
        }

        body[data-theme="forest"] { font-family: 'Palatino Linotype', 'Book Antiqua', 'Georgia', serif; }
        body[data-theme="forest"] .board-cell {
            border-radius: 12px;
            border: 2px solid rgba(212, 163, 89, 0.5);
            box-shadow: 2px 6px 15px rgba(0,0,0,0.6), inset 0 0 12px rgba(45, 106, 79, 0.4);
        }
        body[data-theme="forest"] .card:hover {
            border-color: #dda15e;
            box-shadow: 0 8px 25px rgba(221, 161, 94, 0.5), inset 0 0 15px rgba(183, 228, 199, 0.3);
        }

        body[data-theme="stoneage"] { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', Arial, sans-serif; 
        }
        body[data-theme="stoneage"] .category-header {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 1.4vw;
            line-height: 1.25;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
            border-bottom: 3px solid var(--card-border);
            border-radius: 10px 10px 4px 4px;
            padding: 6px 8px;
        }
        body[data-theme="stoneage"] .card {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 800;
            font-size: 3.2vw;
            letter-spacing: 0.5px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px var(--card-glow);
        }
        body[data-theme="stoneage"] .score-val {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.8), 0 0 12px var(--card-glow);
        }
        body[data-theme="stoneage"] .team-name {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
        }
        body[data-theme="stoneage"] #q-text {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 600;
            font-size: 3vw;
            line-height: 1.35;
            letter-spacing: 0.2px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.95), 0 0 15px var(--card-glow);
        }
        body[data-theme="stoneage"] .board-cell {
            border-radius: 8px 16px 8px 14px;
            border: 2px solid rgba(212, 134, 60, 0.45);
            box-shadow: 0 4px 0 #100a06, 0 8px 18px rgba(0,0,0,0.65), inset 0 0 10px rgba(0,0,0,0.5);
            background-image: radial-gradient(circle at 35% 30%, rgba(255, 140, 40, 0.08), transparent 70%);
        }
        body[data-theme="stoneage"] .card:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: #ff9933;
            box-shadow: 0 6px 0 #100a06, 0 10px 22px rgba(255, 120, 20, 0.55), inset 0 0 15px rgba(255, 180, 60, 0.3);
            color: #fff9ed;
        }
        body[data-theme="stoneage"] .team-score {
            border-radius: 10px 6px 10px 6px;
            border: 2px solid var(--score-border);
            box-shadow: 0 4px 0 #100a06, inset 0 0 10px rgba(0,0,0,0.5);
        }
        body[data-theme="stoneage"] .team-score.active {
            box-shadow: 0 0 20px var(--card-glow), 0 4px 0 #100a06, inset 0 0 10px var(--score-border);
        }
        body[data-theme="stoneage"] .card.disabled {
            border-radius: 8px 16px 8px 14px;
            opacity: 0.3;
        }

        /* --- AMBIENT PARTICLES --- */
        #ambient-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-particle {
            position: absolute;
            color: var(--score-active);
            opacity: 0.8;
            font-size: 1.5rem;
            animation: drift linear infinite;
            text-shadow: 0 0 8px var(--card-glow);
        }

        @keyframes drift {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(110vh) translateX(25px); opacity: 0; }
        }

        /* --- FLOATING SETTINGS BUTTON --- */
        .btn-settings-floating {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 50;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--header-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            padding: 0;
        }
        
        .btn-settings-floating:hover {
            transform: scale(1.1) rotate(30deg);
            box-shadow: 0 0 15px var(--card-glow);
            background: var(--card-border);
            color: #fff;
        }

        /* --- GAME BOARD GRID --- */
        #game-board {
            flex-grow: 1;
            display: grid;
            grid-template-rows: 75px repeat(5, 1fr);
            gap: 12px;
            padding: 15px;
            z-index: 10;
        }

        .board-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .board-cell:nth-child(5n+1) { background-color: var(--c1); }
        .board-cell:nth-child(5n+2) { background-color: var(--c2); }
        .board-cell:nth-child(5n+3) { background-color: var(--c3); }
        .board-cell:nth-child(5n+4) { background-color: var(--c4); }
        .board-cell:nth-child(5n+5) { background-color: var(--c5); }

        .category-header {
            background: var(--header-bg) !important;
            color: var(--score-active);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.8vw;
            padding: 5px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            border-bottom: 3px solid var(--card-border);
        }

        .card {
            color: var(--text-color);
            font-size: 3.5vw;
            font-weight: 900;
            cursor: pointer;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 10px var(--card-glow);
        }
        
        .card.disabled { 
            background: rgba(0,0,0,0.4) !important; 
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8) !important;
            backdrop-filter: none;
            opacity: 0.35;
            pointer-events: none;
            color: var(--score-active);
            clip-path: none !important;
        }

        /* --- SCOREBOARD --- */
        #scoreboard {
            background: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            border-top: 2px solid var(--card-border);
            backdrop-filter: blur(10px);
            z-index: 10;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
        }

        .team-score {
            text-align: center;
            padding: 10px 25px;
            border-radius: 6px;
            background: var(--score-bg);
            border: 2px solid var(--score-border);
            min-width: 140px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .team-score.active {
            border-color: var(--score-active);
            transform: scale(1.08);
            box-shadow: 0 0 20px var(--card-glow), inset 0 0 15px var(--score-border);
            background: rgba(0, 0, 0, 0.6);
        }

        .score-val { 
            font-size: 2.5rem;
            font-weight: 900; 
            color: #fff; 
            line-height: 1;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8), 0 0 15px var(--card-glow);
        }

        .team-name { 
            font-size: 0.9rem; 
            color: var(--text-color); 
            margin-bottom: 4px; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .team-score.active .team-name { color: var(--score-active); text-shadow: 0 0 8px var(--score-active); }

        .score-controls {
            display: flex;
            gap: 8px;
            margin: 4px 0;
            justify-content: center;
        }

        .btn-adjust {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            border: 1px solid var(--score-border);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-color);
            font-size: 1.1rem;
            line-height: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-adjust:hover {
            background: var(--card-border);
            transform: scale(1.1);
            color: #fff;
        }

        /* --- QUESTION MODAL --- */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--modal-bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background-image: radial-gradient(circle at center, var(--c1) 0%, transparent 70%);
        }

        #q-text {
            font-size: 3.8vw;
            font-weight: 800;
            text-align: center;
            color: #fff;
            padding: 40px;
            max-width: 90%;
            margin-bottom: 40px;
            line-height: 1.3;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9), 0 0 25px var(--card-glow);
        }

        .modal-controls { display: flex; gap: 30px; }

        .btn-correct { 
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            color: white; 
            font-size: 1.8rem; 
            padding: 18px 50px; 
            border: 2px solid var(--card-border);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.4);
            cursor: pointer;
        }
        
        .btn-dismiss { 
            background: linear-gradient(135deg, #7f0000, #b71c1c);
            color: white; 
            font-size: 1.8rem; 
            padding: 18px 50px;
            border: 2px solid var(--card-border);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(183, 28, 28, 0.4);
            cursor: pointer;
        }

        .btn-correct:hover, .btn-dismiss:hover {
            filter: brightness(1.2);
            box-shadow: 0 15px 40px var(--card-glow);
            transform: scale(1.05);
        }

        .modal-controls-secondary {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        .btn-pass {
            background: var(--score-bg);
            color: var(--text-color);
            font-size: 1.1rem;
            padding: 12px 30px;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-pass:hover {
            background: var(--card-border);
            color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 8px 20px var(--card-glow);
        }

        /* --- RESPONSIVE SETTINGS MODAL & OVERLAY --- */
        #settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            z-index: 199;
        }

        #settings-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--header-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            color: var(--text-color);
            border-radius: 12px;
            border: 2px solid var(--card-border);
            width: 480px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 32px);
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 40px var(--card-glow);
            display: none;
            flex-direction: column;
            z-index: 200;
            overflow: hidden;
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px 14px 22px;
            border-bottom: 1px solid var(--score-border);
            background: rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
        }

        .settings-header h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--score-active);
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.3rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 4px;
            line-height: 1;
            transition: all 0.2s;
        }

        .btn-close-modal:hover {
            opacity: 1;
            transform: scale(1.2);
            color: var(--score-active);
        }

        .settings-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 22px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .settings-footer {
            padding: 12px 22px 16px 22px;
            border-top: 1px solid var(--score-border);
            background: rgba(0, 0, 0, 0.35);
            flex-shrink: 0;
        }

        .settings-body::-webkit-scrollbar,
        .scroll-inputs-container::-webkit-scrollbar {
            width: 6px;
        }

        .settings-body::-webkit-scrollbar-track,
        .scroll-inputs-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 3px;
        }

        .settings-body::-webkit-scrollbar-thumb,
        .scroll-inputs-container::-webkit-scrollbar-thumb {
            background: var(--score-border);
            border-radius: 3px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
        }

        .setting-group label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: var(--score-active); 
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .setting-group input, .setting-group select { 
            width: 100%; 
            padding: 8px 10px; 
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid var(--score-border); 
            border-radius: 4px; 
            font-size: 0.95rem;
            box-sizing: border-box; 
            font-family: inherit;
        }

        .setting-group select:focus,
        .setting-group input:focus {
            outline: none;
            border-color: var(--score-active);
            box-shadow: 0 0 8px var(--card-glow);
        }

        /* Fixed-height scrollable containers prevent modal layout shift */
        .scroll-inputs-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 95px;
            overflow-y: auto;
            padding-right: 5px;
            margin-top: 6px;
        }

        .edit-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .edit-row input[type="text"] { flex: 2; }
        .edit-row input[type="number"] { flex: 1; }

        .btn-action { 
            width: 100%; 
            background: linear-gradient(135deg, var(--score-active), var(--card-border)); 
            color: #000; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            font-size: 1.05rem; 
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }
        .btn-action:hover { 
            filter: brightness(1.2); 
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--card-glow);
        }

        .btn-secondary {
            width: 100%;
            background: var(--score-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            padding: 9px 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-secondary:hover {
            background: var(--card-border);
            color: #fff;
            transform: translateY(-1px);
        }

        @media (max-height: 700px) {
            #settings-modal {
                max-height: calc(100vh - 16px);
            }
            .settings-header {
                padding: 10px 18px 8px 18px;
            }
            .settings-body {
                padding: 12px 18px;
                gap: 10px;
            }
            .scroll-inputs-container {
                height: 75px;
            }
            .settings-footer {
                padding: 10px 18px 12px 18px;
            }
        }

    </style>
</head>
<body data-theme="classic"> 

<!-- Floating Settings Cog Button -->
<button class="btn-settings-floating" onclick="openSettings()" title="Settings">⚙</button>

<!-- Ambient Background Particles -->
<div id="ambient-container"></div>

<div id="game-board"></div>

<div id="scoreboard"></div>

<div id="modal-overlay">
    <div id="q-text">Loading Question...</div>
    <div class="modal-controls">
        <button class="btn-correct" onclick="handleAnswer(true)">✔ CORRECT</button>
        <button class="btn-dismiss" onclick="handleAnswer(false)">✖ DISMISS</button>
    </div>
    <div class="modal-controls-secondary">
        <button class="btn-pass" onclick="handleGiveToNextTeam()">⏭ Give to Next Team (Half Points)</button>
    </div>
</div>

<!-- Settings Modal Backdrop Overlay -->
<div id="settings-overlay" onclick="closeSettings()"></div>

<div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-header">
        <h2 id="settings-title">⚙ Settings</h2>

    let currentThemeKey = localStorage.getItem('jeopardy_theme') || 'stoneage';

    function onThemeSelect(themeKey) {
        if (themeKey === 'stoneage') {
            loadStoneAgeQuiz(false);
        } else {
            applyTheme(themeKey);
        }
    }

    function applyTheme(themeKey) {
        if (!themes[themeKey]) themeKey = 'classic';
        currentThemeKey = themeKey;
        try { localStorage.setItem('jeopardy_theme', themeKey); } catch (e) {}
        const theme = themes[themeKey];

        document.body.setAttribute('data-theme', themeKey);

        for (let [prop, val] of Object.entries(theme.vars)) {
            document.documentElement.style.setProperty(prop, val);
        }

        createAmbientEffect();
    }

    // --- Game Data ---
    const defaultData = {
        categories: ["Category 1", "Category 2", "Category 3", "Category 4", "Category 5"],
        questions: []
    };

    let gameData = JSON.parse(JSON.stringify(defaultData));
    let teams = [
        { name: "Team 1", score: 0 },
        { name: "Team 2", score: 0 }
    ];
    let currentTeamIndex = 0;
    let currentCardValue = 0;
    let currentCardElement = null;

    const activeScoreAnimations = {};

    // --- Ambient Particle Generator ---
    function createAmbientEffect() {
        const container = document.getElementById('ambient-container');
        container.innerHTML = '';
        const symbols = themes[currentThemeKey].particles;
        
        for(let i=0; i<30; i++) {
            const particle = document.createElement('div');
            particle.className = 'ambient-particle';
            particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            particle.style.animationDuration = (Math.random() * 15 + 12) + 's';
            particle.style.animationDelay = (Math.random() * 12) + 's';
            particle.style.opacity = Math.random() * 0.4 + 0.15;
            
            container.appendChild(particle);
        }
    }

    // --- Sound Engine ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        const wave = themes[currentThemeKey].synthWave || 'triangle';

        if (type === 'click') {
            // Smooth chime/pop at standard audible volume
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
            gainNode.gain.setValueAtTime(0.01, now);
            gainNode.gain.linearRampToValueAtTime(0.65, now + 0.015);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.start(now);
            osc.stop(now + 0.16);
        } else if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); 
            osc.frequency.setValueAtTime(659.25, now + 0.1); 
            gainNode.gain.setValueAtTime(0.01, now);
            gainNode.gain.linearRampToValueAtTime(0.75, now + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
            osc.start(now);
            osc.stop(now + 0.65);
        } else if (type === 'dismiss') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(45, now + 0.3);
            gainNode.gain.setValueAtTime(0.5, now);
            gainNode.gain.linearRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    function playScoreTickerSound(progress, isPositive) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        osc.type = themes[currentThemeKey].synthWave || 'sine';
        const baseFreq = isPositive ? 380 + (progress * 480) : 480 - (progress * 220);
        osc.frequency.setValueAtTime(baseFreq, now);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.start(now);
        osc.stop(now + 0.05);
    }

    // --- Initialization ---
    function initGame(resetBoard = true) {
        if (currentThemeKey === 'stoneage' && (!gameData.questions || gameData.questions.length === 0)) {
            gameData = JSON.parse(JSON.stringify(stoneAgeQuizData));
        }
        applyTheme(currentThemeKey);
        if (resetBoard) {
            renderBoard();
        }
        renderScoreboard();
        document.getElementById('settings-modal').style.display = 'none';
        const overlay = document.getElementById('settings-overlay');
        if (overlay) overlay.style.display = 'none';
    }

    function renderBoard() {
        const board = document.getElementById('game-board');
        board.innerHTML = '';

        const catCount = gameData.categories.length;
        board.style.gridTemplateColumns = `repeat(${catCount}, 1fr)`;

        // Render Headers
        gameData.categories.forEach(cat => {
            const div = document.createElement('div');
            div.className = 'board-cell category-header';
            div.innerText = cat;
            board.appendChild(div);
        });

        // Render Grid
        for(let r=1; r<=5; r++) {
            for(let c=1; c<=catCount; c++) {
                const qData = gameData.questions.find(q => q.col === c && q.row === r);
                const div = document.createElement('div');
                div.className = 'board-cell card';
                div.innerText = `$${r*100}`;
                div.dataset.value = r * 100;
                
                // Modular Fallback Question Prompt
                const currentCatName = gameData.categories[c - 1] || `Category ${c}`;
                div.dataset.question = (qData && qData.q) ? qData.q : `${currentCatName}: Question for $${r*100}`;

                div.onclick = function() {
                    if(!div.classList.contains('disabled')) {
                        activateCard(div);
                    }
                };
                board.appendChild(div);
            }
        }
    }

    // --- Scoreboard & Animated Ticker ---
    function renderScoreboard() {
        const board = document.getElementById('scoreboard');
        board.innerHTML = '';

        if (currentTeamIndex >= teams.length) {
            currentTeamIndex = 0;
        }

        teams.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = `team-score ${i === currentTeamIndex ? 'active' : ''}`;
            div.innerHTML = `
                <div class="team-name">${t.name}</div>
                <div class="score-controls">
                    <button class="btn-adjust" onclick="adjustScore(${i}, 100)">+</button>
                    <button class="btn-adjust" onclick="adjustScore(${i}, -100)">−</button>
                </div>
                <div class="score-val" id="score-val-${i}">$${t.score}</div>
            `;
            board.appendChild(div);
        });
    }

    function animateScore(teamIndex, amount) {
        const team = teams[teamIndex];
        const startScore = team.score;
        const targetScore = startScore + amount;
        team.score = targetScore;

        const scoreValElement = document.getElementById(`score-val-${teamIndex}`);
        if (!scoreValElement) {
            renderScoreboard();
            return;
        }

        const isPositive = amount >= 0;
        const duration = 2200;
        const startTime = performance.now();
        let lastSoundTime = 0;

        if (activeScoreAnimations[teamIndex]) {
            cancelAnimationFrame(activeScoreAnimations[teamIndex]);
        }

        function update(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            const easeProgress = 1 - Math.pow(1 - progress, 3);
            const currentScore = Math.round(startScore + (amount * easeProgress));

            scoreValElement.innerText = `$${currentScore}`;

            if (elapsed - lastSoundTime > 65 && progress < 0.98) {
                playScoreTickerSound(progress, isPositive);
                lastSoundTime = elapsed;
            }

            if (progress < 1) {
                activeScoreAnimations[teamIndex] = requestAnimationFrame(update);
            } else {
                scoreValElement.innerText = `$${targetScore}`;
                delete activeScoreAnimations[teamIndex];
                if (isPositive && amount > 0) playSound('correct');
            }
        }

        activeScoreAnimations[teamIndex] = requestAnimationFrame(update);
    }

    function adjustScore(teamIndex, amount) {
        animateScore(teamIndex, amount);
    }

    // --- Gameplay ---
    function activateCard(cardElement) {
        playSound('click');
        currentCardElement = cardElement;
        currentCardValue = parseInt(cardElement.dataset.value);
        
        document.getElementById('q-text').innerText = cardElement.dataset.question;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function handleAnswer(isCorrect) {
        document.getElementById('modal-overlay').style.display = 'none';

        const teamToAward = currentTeamIndex;

        currentCardElement.classList.add('disabled');
        currentCardElement.innerHTML = themes[currentThemeKey].disabledIcon;
        
        currentTeamIndex = (currentTeamIndex + 1) % teams.length;
        renderScoreboard();

        if (isCorrect) {
            animateScore(teamToAward, currentCardValue);
        } else {
            playSound('dismiss');
        }
    }

    function handleGiveToNextTeam() {
        document.getElementById('modal-overlay').style.display = 'none';

        const nextTeamIndex = (currentTeamIndex + 1) % teams.length;
        const halfValue = Math.floor(currentCardValue / 2);

        currentCardElement.classList.add('disabled');
        currentCardElement.innerHTML = themes[currentThemeKey].disabledIcon;

        currentTeamIndex = nextTeamIndex;
        renderScoreboard();

        animateScore(nextTeamIndex, halfValue);
    }

    // --- Settings Modal Logic ---
    function openSettings() {
        document.getElementById('theme-select').value = currentThemeKey;

        renderTeamInputs();

    function closeSettings() {
        document.getElementById('settings-modal').style.display = 'none';
        const overlay = document.getElementById('settings-overlay');
        if (overlay) overlay.style.display = 'none';
    }

    function renderCategoryInputs() {
        const container = document.getElementById('category-inputs-container');
        const count = parseInt(document.getElementById('category-count').value) || 5;
        container.innerHTML = '';

        for (let i = 0; i < count; i++) {
            const defaultPlaceholder = `Category ${i + 1}`;
            const existingCat = gameData.categories[i];
            
            // Displays empty input if it matches default placeholder so user can type freely
            const displayVal = (existingCat && existingCat !== defaultPlaceholder) ? existingCat : '';

            const row = document.createElement('div');
            row.className = 'edit-row';
            row.innerHTML = `
                <input type="text" id="cat-name-${i}" value="${displayVal}" placeholder="${defaultPlaceholder}">
            `;
            container.appendChild(row);
        }
    }

    function renderTeamInputs() {
        const container = document.getElementById('team-inputs-container');
        const count = parseInt(document.getElementById('team-count').value) || 2;
        container.innerHTML = '';

        for (let i = 0; i < count; i++) {
            const currentName = teams[i] ? teams[i].name : `Team ${i + 1}`;
            const currentScore = teams[i] ? teams[i].score : 0;

            const row = document.createElement('div');
            row.className = 'edit-row';
            row.innerHTML = `
                <input type="text" id="team-name-${i}" value="${currentName}" placeholder="Team ${i + 1}">
                <input type="number" id="team-score-${i}" value="${currentScore}" placeholder="Score">
            `;
            container.appendChild(row);
        }
    }

    function saveSettings() {
        // 1. Save Selected Visual Theme
        const selectedTheme = document.getElementById('theme-select').value;
        applyTheme(selectedTheme);

        // 2. Save Categories
        const catCount = parseInt(document.getElementById('category-count').value) || 5;
        const newCats = [];
        for (let i = 0; i < catCount; i++) {
            const input = document.getElementById(`cat-name-${i}`);
            const val = input ? input.value.trim() : '';
            newCats.push(val !== '' ? val : `Category ${i + 1}`);
        }
        gameData.categories = newCats;

        // 3. Save Teams & Scores
        const teamCount = parseInt(document.getElementById('team-count').value) || 2;
        const newTeams = [];
        for (let i = 0; i < teamCount; i++) {
            const nameInput = document.getElementById(`team-name-${i}`);
            const scoreInput = document.getElementById(`team-score-${i}`);
            
            const name = nameInput && nameInput.value.trim() ? nameInput.value.trim() : `Team ${i + 1}`;
            const score = scoreInput && scoreInput.value !== '' ? parseInt(scoreInput.value) : 0;
            
            newTeams.push({ name, score });
        }
        teams = newTeams;

        // 4. Handle Question File Ingestion (.txt)
        const fileInput = document.getElementById('file-input');
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const content = e.target.result;
                const parsedData = parseTxtQuestions(content);

                if (parsedData && parsedData.categories && parsedData.questions) {
                    gameData = parsedData;
                    fileInput.value = '';
                    initGame(true); // File uploaded: Reset board completely
                } else {
                    alert("Unable to parse question file. Please check formatting.");
                }
            };
            reader.readAsText(file);
        } else {
            initGame(false); // No file uploaded: update settings, keep board progress
            renderBoard();
        }
    }

    // --- Content-Agnostic TXT Parser ---
    function parseTxtQuestions(text) {
        const lines = text.split(/\r?\n/);
        const categories = [];
        const questions = [];
        
        let currentCol = 0;
        let currentRow = 0;

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;

            const catMatch = line.match(/^(?:category\s*\d*\s*:?|#|\[)\s*(.+?)(?:\])?$/i);
            
            if (catMatch && !line.match(/^\$?\d+\s*[:\.\-]/)) {
                if (categories.length < 6) {
                    let cleanCatName = catMatch[1].replace(/[\[\]]/g, '').trim();
                    categories.push(cleanCatName || `Category ${categories.length + 1}`);
                    currentCol = categories.length;
                    currentRow = 0;
                }
                continue;
            }

            if (currentCol === 0) {
                currentCol = 1;
                categories.push("Category 1");
                currentRow = 0;
            }

            let qText = line;
            const valMatch = line.match(/^(?:\$)?(\d+)\s*[:\.\-]\s*(.+)$/);
            
            if (valMatch) {
                const val = parseInt(valMatch[1]);
                if (val >= 100 && val <= 500) {
                    currentRow = Math.round(val / 100);
                } else {
                    currentRow++;
                }
                qText = valMatch[2].trim();
            } else {
                currentRow++;
            }

            if (currentCol <= 6 && currentRow >= 1 && currentRow <= 5) {
                const existingIdx = questions.findIndex(q => q.col === currentCol && q.row === currentRow);
                if (existingIdx >= 0) {
                    questions[existingIdx].q = qText;
                } else {
                    questions.push({ col: currentCol, row: currentRow, q: qText });
                }
            }
        }

        if (categories.length === 0) {
            categories.push("Category 1", "Category 2", "Category 3", "Category 4", "Category 5");
        }

        return { categories, questions };
    }
