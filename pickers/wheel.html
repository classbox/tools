<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Wheel Spinner</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --panel-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            user-select: none;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            backdrop-filter: blur(5px);
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Fixed Top-Right Controls */
        .wheel-controls {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.75rem;
            z-index: 50;
        }

		main {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			position: relative;
			width: 100%;
			max-width: 900px;
			padding: 1rem;
		}

		.wheel-wrapper {
			position: relative;
			width: min(85vw, calc(100vh - 120px));
			height: min(85vw, calc(100vh - 120px));
			display: flex;
			align-items: center;
			justify-content: center;
            margin: auto;
		}

        /* Pointer / Indicator */
        .pointer-container {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            transition: transform 0.05s ease;
            transform-origin: 50% 0%;
        }

        .pointer-container.bounce {
            transform: translateX(-50%) rotate(-12deg) scale(1.1);
        }

        .pointer-svg {
            width: 48px;
            height: 56px;
        }

        #pointerPath {
            transition: fill 0.15s ease;
        }

        /* Wheel Canvas */
        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), 0 0 0 12px rgba(255, 255, 255, 0.1);
        }

        /* Spin Center Button */
        .center-spin-btn {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ffffff;
            color: var(--text-dark);
            border: 6px solid #f1f5f9;
            font-size: 1.25rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.05em;
        }

        .center-spin-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 14px 30px rgba(0,0,0,0.4);
            color: var(--primary);
        }

        .center-spin-btn:active {
            transform: scale(0.95);
        }

        .center-spin-btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
            transform: scale(1) !important;
        }

        /* Settings Drawer / Panel */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 100vw;
            height: 100%;
            background: var(--panel-bg);
            color: var(--text-dark);
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
            z-index: 100;
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            backdrop-filter: blur(20px);
        }

        .settings-panel.open {
            right: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
        }

        .panel-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #64748b;
            line-height: 1;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .setting-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 0.75rem;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .preset-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 6px;
            background: #e2e8f0;
            color: #334155;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-small:hover {
            background: #cbd5e1;
        }

        /* Overlay Backdrop */
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Winner Modal Popup */
        .winner-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #ffffff;
            color: var(--text-dark);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 110;
            text-align: center;
            max-width: 90vw;
            width: 440px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .winner-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .winner-modal h3 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .winner-name {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 1.5rem;
            word-break: break-word;
            line-height: 1.2;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        /* Confetti Overlay Canvas */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 105;
        }

    </style>
</head>
<body>

    <!-- Top Right Corner Floating Controls -->
    <div class="wheel-controls">
        <button id="btnSound" class="btn" title="Toggle Sound">🔊 Sound On</button>
        <button id="btnSettings" class="btn btn-primary">⚙️ Settings</button>
    </div>

    <!-- Main Spinner Area -->
    <main>
        <div class="wheel-wrapper">
            <!-- Dynamic Arrow Pointer -->
            <div id="pointer" class="pointer-container">
                <svg class="pointer-svg" viewBox="0 0 40 50">
                    <path id="pointerPath" d="M 20 50 L 0 5 C 0 0, 40 0, 40 5 Z" fill="#ff4757" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <canvas id="wheelCanvas"></canvas>
            <button id="btnSpin" class="center-spin-btn">SPIN</button>
        </div>
    </main>

    <!-- Settings Slide-out Panel -->
    <div id="settingsPanel" class="settings-panel">
        <div class="panel-header">
            <h2>Wheel Settings</h2>
            <button id="btnCloseSettings" class="close-btn">&times;</button>
        </div>

        <div class="setting-group">
            <label for="contestantsInput">
                <span>Contestants / Students</span>
                <span id="contestantCount" style="color: var(--primary); font-weight:700;">0</span>
            </label>
            <textarea id="contestantsInput" placeholder="Enter student names, one per line..."></textarea>
            <div class="preset-btns">
                <button id="btnShuffle" class="btn-small">🔀 Shuffle</button>
                <button id="btnLoadSample" class="btn-small">📋 Load Sample Class</button>
            </div>
        </div>

        <div class="setting-group">
            <label for="spinDuration">
                <span>Spin Duration</span>
                <span id="durationValue">7s</span>
            </label>
            <input type="range" id="spinDuration" min="3" max="15" step="1" value="7">
        </div>

        <div style="margin-top: auto;">
            <button id="btnSaveSettings" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem;">
                Apply & Close
            </button>
        </div>
    </div>

    <!-- Backdrop Overlay -->
    <div id="backdrop" class="backdrop"></div>

    <!-- Winner Modal Popup -->
    <div id="winnerModal" class="winner-modal">
        <h3>🎉 Selected Student 🎉</h3>
        <div id="winnerName" class="winner-name">Alex</div>
        <div class="modal-actions">
            <button id="btnRemoveWinner" class="btn-small" style="background: #fee2e2; color: #991b1b; padding: 0.6rem 1rem;">
                Remove Name
            </button>
            <button id="btnCloseWinner" class="btn btn-primary" style="padding: 0.6rem 1.2rem;">
                Keep & Close
            </button>
        </div>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <script>
        // --- Default Roster ---
        const DEFAULT_STUDENTS = [
            "Alex", "Sam", "Jordan", "Taylor", 
            "Morgan", "Casey", "Riley", "Avery"
        ];

        // --- Application State ---
        let students = [...DEFAULT_STUDENTS];
        let colors = [];
        let spinDuration = 7; // seconds
        let soundEnabled = true;
        
        let currentAngle = 0; // In radians
        let isSpinning = false;
        let lastTickIndex = -1;

        // --- Web Audio Synthesizer ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.03);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) {
                console.error(e);
            }
        }

        function playFanfareSound() {
            if (!soundEnabled) return;
            initAudio();
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.4);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(audioCtx.currentTime + idx * 0.1);
                osc.stop(audioCtx.currentTime + idx * 0.1 + 0.4);
            });
        }

        // --- Color Generator ---
        function generateColors(count) {
            const arr = [];
            for (let i = 0; i < count; i++) {
                const hue = (i * (360 / count) + 15) % 360;
                arr.push(`hsl(${hue}, 85%, 55%)`);
            }
            return arr;
        }

        // --- DOM Elements ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const pointer = document.getElementById('pointer');
        const pointerPath = document.getElementById('pointerPath');
        const btnSpin = document.getElementById('btnSpin');
        const btnSettings = document.getElementById('btnSettings');
        const btnCloseSettings = document.getElementById('btnCloseSettings');
        const settingsPanel = document.getElementById('settingsPanel');
        const backdrop = document.getElementById('backdrop');
        const contestantsInput = document.getElementById('contestantsInput');
        const contestantCount = document.getElementById('contestantCount');
        const spinDurationInput = document.getElementById('spinDuration');
        const durationValue = document.getElementById('durationValue');
        const btnSaveSettings = document.getElementById('btnSaveSettings');
        const btnSound = document.getElementById('btnSound');
        const btnShuffle = document.getElementById('btnShuffle');
        const btnLoadSample = document.getElementById('btnLoadSample');
        
        const winnerModal = document.getElementById('winnerModal');
        const winnerNameEl = document.getElementById('winnerName');
        const btnRemoveWinner = document.getElementById('btnRemoveWinner');
        const btnCloseWinner = document.getElementById('btnCloseWinner');

        let lastWinnerIndex = -1;

        // --- Canvas Sizing & Rendering ---
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            drawWheel();
            updatePointerAndTicks();
        }

        function drawWheel() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const cx = width / 2;
            const cy = height / 2;
            const radius = Math.min(cx, cy) - 10;

            ctx.clearRect(0, 0, width, height);

            if (students.length === 0) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e2e8f0';
                ctx.fill();
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 18px system-ui';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Add contestants in settings!', cx, cy);
                return;
            }

            const arc = (2 * Math.PI) / students.length;

            // Define central SPIN button doughnut hole radius + padding
            const hubRadius = 58; 
            const outerMargin = 25; 
            // Exact radial length available for text between inner hub and outer rim
            const maxTextWidth = radius - hubRadius - outerMargin;

            for (let i = 0; i < students.length; i++) {
                const startAngle = currentAngle + i * arc;
                const endAngle = startAngle + arc;

                // Slice Segment
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i];
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Text Label Rendering
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + arc / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';

                const name = students[i];
                
                // Calculate base font size depending on slice angle & radius
                let fontSize = Math.min(radius * 0.16, Math.max(12, Math.floor((radius / students.length) * 1.25)));
                const minFontSize = 8;

                // Dynamically scale down font size until name fits within doughnut track (maxTextWidth)
                ctx.font = `800 ${fontSize}px system-ui, -apple-system, sans-serif`;
                while (ctx.measureText(name).width > maxTextWidth && fontSize > minFontSize) {
                    fontSize--;
                    ctx.font = `800 ${fontSize}px system-ui, -apple-system, sans-serif`;
                }

                // Black text outline/stroke for contrast
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = Math.max(2, Math.floor(fontSize / 5));
                ctx.lineJoin = 'round';
                ctx.miterLimit = 2;
                ctx.strokeText(name, radius - outerMargin, 0);

                // Crisp White inner fill
                ctx.fillStyle = '#ffffff';
                ctx.fillText(name, radius - outerMargin, 0);

                ctx.restore();

                // Outer Boundary Pegs
                const pegX = cx + Math.cos(startAngle) * (radius - 8);
                const pegY = cy + Math.sin(startAngle) * (radius - 8);
                ctx.beginPath();
                ctx.arc(pegX, pegY, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // Outer Shiny Rim
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 6;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.stroke();

            // Inner Doughnut Ring Outline (Surrounding SPIN button)
            ctx.beginPath();
            ctx.arc(cx, cy, hubRadius - 4, 0, 2 * Math.PI);
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.stroke();
        }

        // --- Dynamic Pointer Color & Tick Trigger ---
        function updatePointerAndTicks() {
            if (students.length === 0) return;

            const arc = (2 * Math.PI) / students.length;
            
            // Pointer is fixed at top: 270 degrees or 1.5 * PI radians
            let pointerAngleOnWheel = (1.5 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
            if (pointerAngleOnWheel < 0) pointerAngleOnWheel += 2 * Math.PI;

            const currentIndex = Math.floor(pointerAngleOnWheel / arc) % students.length;

            // Dynamically match pointer fill color to active segment
            if (colors[currentIndex]) {
                pointerPath.setAttribute('fill', colors[currentIndex]);
            }

            // Trigger tick sound & pointer bounce on slice change
            if (currentIndex !== lastTickIndex) {
                if (isSpinning) {
                    playTickSound();
                    triggerPointerBounce();
                }
                lastTickIndex = currentIndex;
            }

            return currentIndex;
        }

        function triggerPointerBounce() {
            pointer.classList.remove('bounce');
            void pointer.offsetWidth; // Force reflow
            pointer.classList.add('bounce');
            setTimeout(() => pointer.classList.remove('bounce'), 50);
        }

        // --- Wheel Spin Dynamics ---
        function spin() {
            if (isSpinning || students.length === 0) return;

            initAudio();
            isSpinning = true;
            btnSpin.disabled = true;

            const durationMs = spinDuration * 1000;
            const startAngle = currentAngle;

            // Pick fair random winner index
            const winningIndex = Math.floor(Math.random() * students.length);
            const arc = (2 * Math.PI) / students.length;

            // Position winner under top pointer (1.5 * PI) with slight random internal offset
            const sliceOffset = (0.15 + Math.random() * 0.7) * arc;
            const targetWheelAngle = winningIndex * arc + sliceOffset;

            let finalAngleBase = 1.5 * Math.PI - targetWheelAngle;
            
            // Revolutions (between 6 and 9 full turns)
            const minTurns = 6;
            const extraTurns = minTurns * 2 * Math.PI;

            let delta = (finalAngleBase - (startAngle % (2 * Math.PI)));
            if (delta <= 0) delta += 2 * Math.PI;

            const totalRotation = extraTurns + delta;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / durationMs);

                // Quintic Ease-Out curve for dramatic crawl/tapering stop
                const ease = 1 - Math.pow(1 - progress, 5);

                currentAngle = startAngle + totalRotation * ease;
                drawWheel();
                updatePointerAndTicks();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    btnSpin.disabled = false;
                    lastWinnerIndex = winningIndex;
                    onSpinComplete(students[winningIndex]);
                }
            }

            requestAnimationFrame(animate);
        }

        // --- Winner Sequence & Confetti ---
        function onSpinComplete(winnerName) {
            playFanfareSound();
            winnerNameEl.textContent = winnerName;
            
            winnerModal.classList.add('active');
            backdrop.classList.add('active');
            
            launchConfetti();
        }

        // Simple built-in Particle Confetti Engine
        const confettiCanvas = document.getElementById('confettiCanvas');
        const cCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];

        function launchConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            confettiParticles = [];

            const particleColors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ffffff'];

            for (let i = 0; i < 120; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 4,
                    color: particleColors[Math.floor(Math.random() * particleColors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    life: 1
                });
            }

            animateConfetti();
        }

        function animateConfetti() {
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let activeParticles = false;

            confettiParticles.forEach(p => {
                if (p.life <= 0) return;
                activeParticles = true;

                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3; // Gravity
                p.vx *= 0.98; // Drag
                p.rotation += p.vRot;
                p.life -= 0.01;

                cCtx.save();
                cCtx.translate(p.x, p.y);
                cCtx.rotate((p.rotation * Math.PI) / 180);
                cCtx.fillStyle = p.color;
                cCtx.globalAlpha = Math.max(0, p.life);
                cCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                cCtx.restore();
            });

            if (activeParticles) {
                requestAnimationFrame(animateConfetti);
            }
        }

        // --- Roster & Settings Logic ---
        function updateRoster(newNames) {
            students = newNames.filter(name => name.trim() !== "");
            colors = generateColors(students.length);
            contestantsInput.value = students.join('\n');
            contestantCount.textContent = students.length;
            drawWheel();
            updatePointerAndTicks();
        }

        function openSettings() {
            settingsPanel.classList.add('open');
            backdrop.classList.add('active');
        }

        function closeSettings() {
            settingsPanel.classList.remove('open');
            if (!winnerModal.classList.contains('active')) {
                backdrop.classList.remove('active');
            }
        }

        function saveSettings() {
            const rawNames = contestantsInput.value.split('\n');
            updateRoster(rawNames);
            spinDuration = parseInt(spinDurationInput.value, 10);
            closeSettings();
        }

        // --- External Message Listener for Classroom Rosters ---
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'CLASSROOM_ROSTER_UPDATE') {
                const studentNames = event.data.roster; // Array of names e.g. ["Alex", "Sam", "Jordan"]
                console.log("Roster received:", studentNames);
                if (Array.isArray(studentNames)) {
                    updateRoster(studentNames);
                }
            }
        });

        // --- Event Listeners ---
        btnSpin.addEventListener('click', spin);
        
        btnSettings.addEventListener('click', openSettings);
        btnCloseSettings.addEventListener('click', closeSettings);
        backdrop.addEventListener('click', () => {
            closeSettings();
            winnerModal.classList.remove('active');
            backdrop.classList.remove('active');
        });

        btnSaveSettings.addEventListener('click', saveSettings);

        spinDurationInput.addEventListener('input', (e) => {
            durationValue.textContent = `${e.target.value}s`;
        });

        contestantsInput.addEventListener('input', () => {
            const actualCount = contestantsInput.value.split('\n').filter(n => n.trim() !== "").length;
            contestantCount.textContent = actualCount;
        });

        btnSound.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            btnSound.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Muted';
        });

        btnShuffle.addEventListener('click', () => {
            const rawNames = contestantsInput.value.split('\n').filter(n => n.trim() !== "");
            for (let i = rawNames.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rawNames[i], rawNames[j]] = [rawNames[j], rawNames[i]];
            }
            contestantsInput.value = rawNames.join('\n');
        });

        btnLoadSample.addEventListener('click', () => {
            updateRoster(DEFAULT_STUDENTS);
        });

        btnCloseWinner.addEventListener('click', () => {
            winnerModal.classList.remove('active');
            backdrop.classList.remove('active');
        });

        btnRemoveWinner.addEventListener('click', () => {
            if (lastWinnerIndex >= 0 && lastWinnerIndex < students.length) {
                students.splice(lastWinnerIndex, 1);
                updateRoster(students);
            }
            winnerModal.classList.remove('active');
            backdrop.classList.remove('active');
        });

        // Keyboard Shortcut: Spacebar to Spin
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== contestantsInput && !isSpinning) {
                e.preventDefault();
                spin();
            }
        });

        window.addEventListener('resize', resizeCanvas);

        // --- Initialize App ---
        updateRoster(DEFAULT_STUDENTS);
        resizeCanvas();
    </script>
</body>
</html>
