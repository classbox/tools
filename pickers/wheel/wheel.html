<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Wheel Spinner</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --panel-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            user-select: none;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            backdrop-filter: blur(5px);
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Fixed Top-Right Controls */
        .wheel-controls {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.75rem;
            z-index: 50;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 900px;
            padding: 1rem;
        }

        .wheel-wrapper {
            position: relative;
            width: min(85vw, calc(100vh - 120px));
            height: min(85vw, calc(100vh - 120px));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            transition: transform 0.05s ease;
        }

        /* Pointer / Indicator */
        .pointer-container {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            transition: transform 0.05s ease;
            transform-origin: 50% 0%;
        }

        .pointer-container.bounce {
            transform: translateX(-50%) rotate(-12deg) scale(1.1);
        }

        .pointer-svg {
            width: 48px;
            height: 56px;
        }

        #pointerPath {
            transition: fill 0.15s ease;
        }

        /* Wheel Canvas */
        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), 0 0 0 12px rgba(255, 255, 255, 0.1);
        }

        /* Spin Center Button */
        .center-spin-btn {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ffffff;
            color: var(--text-dark);
            border: 6px solid #f1f5f9;
            font-size: 1.25rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.05em;
        }

        .center-spin-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 14px 30px rgba(0,0,0,0.4);
            color: var(--primary);
        }

        .center-spin-btn:active {
            transform: scale(0.95);
        }

        .center-spin-btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
            transform: scale(1) !important;
        }

        /* Settings Drawer / Panel */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 100vw;
            height: 100%;
            background: var(--panel-bg);
            color: var(--text-dark);
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
            z-index: 100;
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            backdrop-filter: blur(20px);
            overflow-y: auto;
        }

        .settings-panel.open {
            right: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
        }

        .panel-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #64748b;
            line-height: 1;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .setting-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 0.75rem;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .preset-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 6px;
            background: #e2e8f0;
            color: #334155;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-small:hover {
            background: #cbd5e1;
        }

        /* Overlay Backdrop */
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Winner Modal Popup */
        .winner-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #ffffff;
            color: var(--text-dark);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 110;
            text-align: center;
            max-width: 90vw;
            width: 440px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .winner-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .winner-modal h3 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .winner-name {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 1.5rem;
            word-break: break-word;
            line-height: 1.2;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        /* Confetti Canvas */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 105;
        }

        /* Toggle Switches */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--primary);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        /* --- Random Events Visual Elements --- */

        /* 1. Monkey Container */
        .monkey-container {
            position: fixed;
            top: -240px;
            left: calc(50% + 110px);
            transform: translateX(-50%);
            width: 180px;
            height: 180px;
            z-index: 120;
            pointer-events: none;
            transition: top 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        .monkey-container.enter {
            top: max(10px, calc(50vh - min(42.5vw, calc(50vh - 60px)) - 100px));
        }

        .monkey-container.kick {
            animation: monkeyKickTopAnim 0.35s ease-in-out forwards;
        }

        @keyframes monkeyKickTopAnim {
            0% { transform: translateX(-50%) scale(1) rotate(0deg) translateY(0); }
            35% { transform: translateX(-50%) scale(1.15) rotate(15deg) translateY(-15px); }
            70% { transform: translateX(-50%) scale(1.25) rotate(-20deg) translateY(65px) translateX(-45px); }
            100% { transform: translateX(-50%) scale(1) rotate(0deg) translateY(0); }
        }

        .monkey-svg {
            width: 100%;
            height: 100%;
        }

        /* 2. Lightning Overlay & Bolt */
        .lightning-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 115;
            transition: opacity 0.1s ease;
        }

        .lightning-overlay.dim { opacity: 0.55; }
        .lightning-overlay.flash { opacity: 0.95; background: #ffffff; }

        .lightning-svg-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 60vh;
            z-index: 116;
            pointer-events: none;
            opacity: 0;
        }

        .lightning-svg-container.active {
            animation: lightningFlashAnim 0.35s ease-out forwards;
        }

        @keyframes lightningFlashAnim {
            0% { opacity: 0; transform: translateX(-50%) scaleY(0); }
            20% { opacity: 1; transform: translateX(-50%) scaleY(1); }
            50% { opacity: 0.3; }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) scaleY(1); }
        }

        /* 3. Enhanced Malfunction Effects & Particles */
        .wheel-wrapper.shake {
            animation: violentMalfunctionShake 0.06s linear infinite alternate;
        }

        @keyframes violentMalfunctionShake {
            0% { transform: translate(-8px, 6px) rotate(-2.5deg); }
            50% { transform: translate(7px, -5px) rotate(2deg); }
            100% { transform: translate(-6px, -7px) rotate(-1.8deg); }
        }

        .malfunction-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 116;
            overflow: hidden;
        }

        /* Tumbling Metallic Cogs */
        .m-cog {
            position: absolute;
            width: var(--size, 45px);
            height: var(--size, 45px);
            top: 50%;
            left: 50%;
            transform-origin: center center;
            animation: cogTumble 1.4s cubic-bezier(0.12, 0.8, 0.3, 1) forwards;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
        }

        @keyframes cogTumble {
            0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(var(--rot)); opacity: 0; }
        }

        /* Flying Electric Sparks */
        .m-spark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--size, 6px);
            height: var(--size, 6px);
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px #fffa65, 0 0 20px #ff3838;
            animation: sparkShoot 0.75s cubic-bezier(0.05, 0.9, 0.2, 1) forwards;
        }

        @keyframes sparkShoot {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.1); opacity: 0; }
        }

        /* Expanding Smoke Puffs */
        .m-smoke {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(220, 225, 235, 0.8) 0%, rgba(130, 140, 155, 0.5) 45%, rgba(50, 50, 60, 0) 70%);
            filter: blur(8px);
            animation: smokeExpand 1.6s ease-out forwards;
        }

        @keyframes smokeExpand {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 0.9; }
            50% { opacity: 0.7; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(3.8) rotate(120deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Top Right Corner Floating Controls -->
    <div class="wheel-controls">
        <button id="btnSound" class="btn" title="Toggle Sound">🔊 Sound On</button>
        <button id="btnSettings" class="btn btn-primary">⚙️ Settings</button>
    </div>

    <!-- Main Spinner Area -->
    <main>
        <div id="wheelWrapper" class="wheel-wrapper">
            <!-- Dynamic Arrow Pointer -->
            <div id="pointer" class="pointer-container">
                <svg class="pointer-svg" viewBox="0 0 40 50">
                    <path id="pointerPath" d="M 20 50 L 0 5 C 0 0, 40 0, 40 5 Z" fill="#ff4757" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <canvas id="wheelCanvas"></canvas>
            <button id="btnSpin" class="center-spin-btn">SPIN</button>
        </div>
    </main>

    <!-- Settings Slide-out Panel -->
    <div id="settingsPanel" class="settings-panel">
        <div class="panel-header">
            <h2>Wheel Settings</h2>
            <button id="btnCloseSettings" class="close-btn">&times;</button>
        </div>

        <div class="setting-group">
            <label for="contestantsInput">
                <span>Contestants / Students</span>
                <span id="contestantCount" style="color: var(--primary); font-weight:700;">0</span>
            </label>
            <textarea id="contestantsInput" placeholder="Enter student names, one per line..."></textarea>
            <div class="preset-btns">
                <button id="btnShuffle" class="btn-small">🔀 Shuffle</button>
                <button id="btnLoadSample" class="btn-small">📋 Load Sample Class</button>
            </div>
        </div>

        <div class="setting-group">
            <label for="spinDuration">
                <span>Spin Duration</span>
                <span id="durationValue">7s</span>
            </label>
            <input type="range" id="spinDuration" min="3" max="15" step="1" value="7">
        </div>

        <!-- Random Events Option Group -->
        <div class="setting-group" style="background: #f8fafc; padding: 1rem; border-radius: 12px; border: 1px solid #e2e8f0;">
            <label for="randomEventsToggle" style="margin-bottom: 0.25rem;">
                <span style="display:flex; align-items:center; gap:0.4rem; font-weight:700;">🎲 Random Chaos Events</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="randomEventsToggle">
                    <span class="toggle-slider"></span>
                </label>
            </label>
            
            <div id="randomEventsOptions" style="display: none; flex-direction: column; gap: 0.85rem; margin-top: 0.75rem;">
                <div>
                    <label for="randomEventsChance" style="font-size: 0.85rem;">
                        <span>Global Odds</span>
                        <span id="chanceValue" style="color: var(--primary); font-weight:700;">30%</span>
                    </label>
                    <input type="range" id="randomEventsChance" min="5" max="100" step="5" value="30">
                </div>

                <div style="border-top: 1px solid #e2e8f0; padding-top: 0.6rem; display: flex; flex-direction: column; gap: 0.5rem;">
                    <span style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em;">Allowed Events:</span>
                    
                    <label style="font-weight: 500; font-size: 0.85rem; cursor: pointer; justify-content: start; gap: 0.5rem;">
                        <input type="checkbox" id="evtMonkey" checked style="accent-color: var(--primary); width: 16px; height: 16px;">
                        <span>🐒 Monkey Kick</span>
                    </label>
                    
                    <label style="font-weight: 500; font-size: 0.85rem; cursor: pointer; justify-content: start; gap: 0.5rem;">
                        <input type="checkbox" id="evtLightning" checked style="accent-color: var(--primary); width: 16px; height: 16px;">
                        <span>⚡ Lightning Strike</span>
                    </label>
                    
                    <label style="font-weight: 500; font-size: 0.85rem; cursor: pointer; justify-content: start; gap: 0.5rem;">
                        <input type="checkbox" id="evtMalfunction" checked style="accent-color: var(--primary); width: 16px; height: 16px;">
                        <span>⚙️ Wheel Malfunction</span>
                    </label>
                </div>
            </div>
        </div>

        <div style="margin-top: auto; padding-top: 0.5rem;">
            <button id="btnSaveSettings" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem;">
                Apply & Close
            </button>
        </div>
    </div>

    <!-- Backdrop Overlay -->
    <div id="backdrop" class="backdrop"></div>

    <!-- Winner Modal Popup -->
    <div id="winnerModal" class="winner-modal">
        <h3>🎉 Selected Student 🎉</h3>
        <div id="winnerName" class="winner-name">Alex</div>
        <div class="modal-actions">
            <button id="btnRemoveWinner" class="btn-small" style="background: #fee2e2; color: #991b1b; padding: 0.6rem 1rem;">
                Remove Name
            </button>
            <button id="btnCloseWinner" class="btn btn-primary" style="padding: 0.6rem 1.2rem;">
                Keep & Close
            </button>
        </div>
    </div>

    <!-- Event 1: Animated Mischievous Monkey Container -->
    <div id="monkeyContainer" class="monkey-container">
        <svg class="monkey-svg" viewBox="0 0 120 120">
            <path d="M 30 85 Q 10 75 15 50 Q 20 25 35 35" fill="none" stroke="#6d3811" stroke-width="7" stroke-linecap="round"/>
            <ellipse cx="60" cy="80" rx="26" ry="28" fill="#8b4513"/>
            <ellipse cx="60" cy="82" rx="18" ry="20" fill="#e6c280"/>
            <circle cx="60" cy="45" r="26" fill="#8b4513"/>
            <circle cx="34" cy="45" r="9" fill="#8b4513"/>
            <circle cx="34" cy="45" r="5" fill="#e6c280"/>
            <circle cx="86" cy="45" r="9" fill="#8b4513"/>
            <circle cx="86" cy="45" r="5" fill="#e6c280"/>
            <path d="M 44 42 C 44 30, 76 30, 76 42 C 76 54, 44 54, 44 42 Z" fill="#e6c280"/>
            <ellipse cx="51" cy="40" rx="5" ry="6" fill="#ffffff"/>
            <ellipse cx="69" cy="40" rx="5" ry="6" fill="#ffffff"/>
            <circle cx="53" cy="41" r="3" fill="#000000"/>
            <circle cx="71" cy="41" r="3" fill="#000000"/>
            <path d="M 45 32 L 55 36" stroke="#3d1e0a" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 75 32 L 65 36" stroke="#3d1e0a" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 50 52 Q 60 62 70 52" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
            <path d="M 55 56 Q 60 63 65 56" fill="#ff4757"/>
            <path d="M 38 75 Q 25 65 20 50" fill="none" stroke="#8b4513" stroke-width="7" stroke-linecap="round"/>
            <path d="M 82 75 Q 98 70 108 80" fill="none" stroke="#8b4513" stroke-width="7" stroke-linecap="round"/>
            <path d="M 48 102 L 42 115" stroke="#8b4513" stroke-width="8" stroke-linecap="round"/>
            <path d="M 72 102 L 92 110" stroke="#8b4513" stroke-width="8" stroke-linecap="round"/>
        </svg>
    </div>

    <!-- Event 2: Lightning Elements -->
    <div id="lightningOverlay" class="lightning-overlay"></div>
    <div id="lightningContainer" class="lightning-svg-container">
        <svg viewBox="0 0 100 400" preserveAspectRatio="none" style="width:100%; height:100%;">
            <path d="M 50 0 L 30 130 L 60 120 L 20 270 L 55 250 L 10 400" 
                  stroke="#a5b4fc" fill="none" stroke-width="12" stroke-linejoin="round" 
                  style="filter: drop-shadow(0 0 20px #818cf8);"/>
            <path d="M 50 0 L 30 130 L 60 120 L 20 270 L 55 250 L 10 400" 
                  stroke="#ffffff" fill="none" stroke-width="5" stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- Event 3: Malfunction Particles Overlay -->
    <div id="malfunctionOverlay" class="malfunction-overlay"></div>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <script>
        // --- Default Roster ---
        const DEFAULT_STUDENTS = [
            "Alex", "Sam", "Jordan", "Taylor", 
            "Morgan", "Casey", "Riley", "Avery"
        ];

        // --- Application State ---
        let students = [...DEFAULT_STUDENTS];
        let colors = [];
        let spinDuration = 7; // seconds
        let soundEnabled = true;
        
        // Random Events State
        let randomEventsEnabled = false;
        let randomEventChance = 30; // 30% default
        let enabledEvents = {
            monkey: true,
            lightning: true,
            malfunction: true
        };

        let currentAngle = 0; // In radians
        let isSpinning = false;
        let lastTickIndex = -1;

        // --- Web Audio Synthesizer & Audio Elements ---
        let audioCtx = null;
        const monkeyAudio = new Audio('monkey.mp3');
        const thunderAudio = new Audio('thunder.mp3');
        const failAudio = new Audio('fail.mp3');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.03);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) {
                console.error(e);
            }
        }

        function playFanfareSound() {
            if (!soundEnabled) return;
            initAudio();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.4);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(audioCtx.currentTime + idx * 0.1);
                osc.stop(audioCtx.currentTime + idx * 0.1 + 0.4);
            });
        }

        // --- Custom File Audio triggers ---
        function playMonkeySound() {
            if (!soundEnabled) return;
            monkeyAudio.currentTime = 0;
            monkeyAudio.play().catch(e => console.log("Monkey audio play prevented:", e));
        }

        function playLightningSound() {
            if (!soundEnabled) return;
            thunderAudio.currentTime = 0;
            thunderAudio.play().catch(e => console.log("Thunder audio play prevented:", e));
        }

        function playMalfunctionSound() {
            if (!soundEnabled) return;
            failAudio.currentTime = 0;
            failAudio.play().catch(e => console.log("Fail audio play prevented:", e));
        }

        // --- Color Generator ---
        function generateColors(count) {
            const arr = [];
            for (let i = 0; i < count; i++) {
                const hue = (i * (360 / count) + 15) % 360;
                arr.push(`hsl(${hue}, 85%, 55%)`);
            }
            return arr;
        }

        // --- DOM Elements ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const wheelWrapper = document.getElementById('wheelWrapper');
        const pointer = document.getElementById('pointer');
        const pointerPath = document.getElementById('pointerPath');
        const btnSpin = document.getElementById('btnSpin');
        const btnSettings = document.getElementById('btnSettings');
        const btnCloseSettings = document.getElementById('btnCloseSettings');
        const settingsPanel = document.getElementById('settingsPanel');
        const backdrop = document.getElementById('backdrop');
        const contestantsInput = document.getElementById('contestantsInput');
        const contestantCount = document.getElementById('contestantCount');
        const spinDurationInput = document.getElementById('spinDuration');
        const durationValue = document.getElementById('durationValue');
        const btnSaveSettings = document.getElementById('btnSaveSettings');
        const btnSound = document.getElementById('btnSound');
        const btnShuffle = document.getElementById('btnShuffle');
        const btnLoadSample = document.getElementById('btnLoadSample');
        
        const randomEventsToggle = document.getElementById('randomEventsToggle');
        const randomEventsOptions = document.getElementById('randomEventsOptions');
        const randomEventsChanceInput = document.getElementById('randomEventsChance');
        const chanceValue = document.getElementById('chanceValue');
        const evtMonkey = document.getElementById('evtMonkey');
        const evtLightning = document.getElementById('evtLightning');
        const evtMalfunction = document.getElementById('evtMalfunction');

        const monkeyContainer = document.getElementById('monkeyContainer');
        const lightningOverlay = document.getElementById('lightningOverlay');
        const lightningContainer = document.getElementById('lightningContainer');
        const malfunctionOverlay = document.getElementById('malfunctionOverlay');

        const winnerModal = document.getElementById('winnerModal');
        const winnerNameEl = document.getElementById('winnerName');
        const btnRemoveWinner = document.getElementById('btnRemoveWinner');
        const btnCloseWinner = document.getElementById('btnCloseWinner');

        let lastWinnerIndex = -1;

        // --- Canvas Sizing & Rendering ---
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            drawWheel();
            updatePointerAndTicks();
        }

        function drawWheel() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const cx = width / 2;
            const cy = height / 2;
            const radius = Math.min(cx, cy) - 10;

            ctx.clearRect(0, 0, width, height);

            if (students.length === 0) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e2e8f0';
                ctx.fill();
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 18px system-ui';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Add contestants in settings!', cx, cy);
                return;
            }

            const arc = (2 * Math.PI) / students.length;

            const hubRadius = 58; 
            const outerMargin = 25; 
            const maxTextWidth = radius - hubRadius - outerMargin;

            for (let i = 0; i < students.length; i++) {
                const startAngle = currentAngle + i * arc;
                const endAngle = startAngle + arc;

                // Slice Segment
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i];
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Text Label Rendering
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + arc / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';

                const name = students[i];
                
                let fontSize = Math.min(radius * 0.16, Math.max(12, Math.floor((radius / students.length) * 1.25)));
                const minFontSize = 8;

                ctx.font = `800 ${fontSize}px system-ui, -apple-system, sans-serif`;
                while (ctx.measureText(name).width > maxTextWidth && fontSize > minFontSize) {
                    fontSize--;
                    ctx.font = `800 ${fontSize}px system-ui, -apple-system, sans-serif`;
                }

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = Math.max(2, Math.floor(fontSize / 5));
                ctx.lineJoin = 'round';
                ctx.miterLimit = 2;
                ctx.strokeText(name, radius - outerMargin, 0);

                ctx.fillStyle = '#ffffff';
                ctx.fillText(name, radius - outerMargin, 0);

                ctx.restore();

                // Outer Boundary Pegs
                const pegX = cx + Math.cos(startAngle) * (radius - 8);
                const pegY = cy + Math.sin(startAngle) * (radius - 8);
                ctx.beginPath();
                ctx.arc(pegX, pegY, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // Outer Shiny Rim
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 6;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.stroke();

            // Inner Doughnut Ring Outline
            ctx.beginPath();
            ctx.arc(cx, cy, hubRadius - 4, 0, 2 * Math.PI);
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.stroke();
        }

        // --- Dynamic Pointer Color & Tick Trigger ---
        function updatePointerAndTicks() {
            if (students.length === 0) return 0;

            const arc = (2 * Math.PI) / students.length;
            
            let pointerAngleOnWheel = (1.5 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
            if (pointerAngleOnWheel < 0) pointerAngleOnWheel += 2 * Math.PI;

            const currentIndex = Math.floor(pointerAngleOnWheel / arc) % students.length;

            if (colors[currentIndex]) {
                pointerPath.setAttribute('fill', colors[currentIndex]);
            }

            if (currentIndex !== lastTickIndex) {
                if (isSpinning) {
                    playTickSound();
                    triggerPointerBounce();
                }
                lastTickIndex = currentIndex;
            }

            return currentIndex;
        }

        function triggerPointerBounce() {
            pointer.classList.remove('bounce');
            void pointer.offsetWidth;
            pointer.classList.add('bounce');
            setTimeout(() => pointer.classList.remove('bounce'), 50);
        }

        // --- Wheel Spin Dynamics ---
        function spin() {
            if (isSpinning || students.length === 0) return;

            initAudio();
            isSpinning = true;
            btnSpin.disabled = true;

            const durationMs = spinDuration * 1000;
            const startAngle = currentAngle;

            const winningIndex = Math.floor(Math.random() * students.length);
            const arc = (2 * Math.PI) / students.length;

            const sliceOffset = (0.15 + Math.random() * 0.7) * arc;
            const targetWheelAngle = winningIndex * arc + sliceOffset;

            let finalAngleBase = 1.5 * Math.PI - targetWheelAngle;
            
            const minTurns = 6;
            const extraTurns = minTurns * 2 * Math.PI;

            let delta = (finalAngleBase - (startAngle % (2 * Math.PI)));
            if (delta <= 0) delta += 2 * Math.PI;

            const totalRotation = extraTurns + delta;
            const startTime = performance.now();

            // Determine active allowed random events
            const activeEvents = [];
            if (enabledEvents.monkey) activeEvents.push('monkey');
            if (enabledEvents.lightning) activeEvents.push('lightning');
            if (enabledEvents.malfunction) activeEvents.push('malfunction');

            const willTriggerEvent = randomEventsEnabled && 
                                     students.length >= 3 && 
                                     activeEvents.length > 0 && 
                                     (Math.random() * 100 < randomEventChance);

            const chosenEventType = willTriggerEvent ? activeEvents[Math.floor(Math.random() * activeEvents.length)] : null;
            let eventExecuted = false;

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / durationMs);

                // Quintic Ease-Out curve
                const ease = 1 - Math.pow(1 - progress, 5);

                currentAngle = startAngle + totalRotation * ease;
                drawWheel();
                updatePointerAndTicks();

                // Trigger Random Event at ~68% progress while spinning
                if (willTriggerEvent && !eventExecuted && progress >= 0.68) {
                    eventExecuted = true;
                    executeRandomEvent(chosenEventType, totalRotation, ease);
                    return;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else if (!willTriggerEvent) {
                    finishSpin(winningIndex);
                }
            }

            requestAnimationFrame(animate);
        }

        // --- Random Events Manager ---
        function executeRandomEvent(type, totalRotation, currentEase) {
            const shiftSlots = Math.floor(Math.random() * 4) + 2; // 2 to 5 slots
            const arc = (2 * Math.PI) / students.length;
            const remainingOriginalAngle = totalRotation * (1 - currentEase);
            const extraAngle = remainingOriginalAngle + (shiftSlots * arc);

            if (type === 'monkey') {
                playMonkeySound();
                monkeyContainer.classList.add('enter');

                setTimeout(() => {
                    monkeyContainer.classList.add('kick');
                    // Removed old synthetic kick sound to use monkey.mp3 solely

                    animateEventBoost(extraAngle, 1600, () => {
                        monkeyContainer.classList.remove('kick');
                        monkeyContainer.classList.remove('enter');
                    });
                }, 350);

            } else if (type === 'lightning') {
                lightningOverlay.classList.add('dim');

                setTimeout(() => {
                    lightningOverlay.classList.add('flash');
                    lightningContainer.classList.add('active');
                    playLightningSound();
                    wheelWrapper.classList.add('shake');

                    animateEventBoost(extraAngle, 1400, () => {
                        lightningOverlay.classList.remove('dim');
                        lightningOverlay.classList.remove('flash');
                        lightningContainer.classList.remove('active');
                        wheelWrapper.classList.remove('shake');
                    });
                }, 200);

            } else if (type === 'malfunction') {
                wheelWrapper.classList.add('shake');
                playMalfunctionSound();
                spawnMalfunctionParticles();

                animateEventBoost(extraAngle, 1800, () => {
                    wheelWrapper.classList.remove('shake');
                }, true);
            }
        }

        // Shared Event Re-spin Booster with optional Stutter
        function animateEventBoost(extraAngle, duration, cleanupCallback, isMalfunction = false) {
            const startKickAngle = currentAngle;
            const kickStartTime = performance.now();

            function step(now) {
                const elapsed = now - kickStartTime;
                const progress = Math.min(1, elapsed / duration);
                
                // Punchy surge ease-out
                const ease = 1 - Math.pow(1 - progress, 3);
                
                // Add physical stutter/jam jitter if malfunction
                let stutter = 0;
                if (isMalfunction && progress < 0.45) {
                    stutter = (Math.random() - 0.5) * 0.12 * (1 - progress * 2.2);
                }

                currentAngle = startKickAngle + extraAngle * ease + stutter;

                drawWheel();
                updatePointerAndTicks();

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    if (cleanupCallback) cleanupCallback();
                    const finalWinnerIndex = updatePointerAndTicks();
                    setTimeout(() => {
                        finishSpin(finalWinnerIndex);
                    }, 250);
                }
            }

            requestAnimationFrame(step);
        }

        function spawnMalfunctionParticles() {
            malfunctionOverlay.innerHTML = '';
            
            // 1. Spawn Expanding Smoke Clouds
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const smoke = document.createElement('div');
                    smoke.className = 'm-smoke';
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 30 + Math.random() * 100;
                    smoke.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                    smoke.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                    malfunctionOverlay.appendChild(smoke);
                }, i * 60);
            }

            // 2. Spawn Flying SVG Metallic Cogs
            const cogSvgPath = `<svg viewBox="0 0 24 24" fill="#cbd5e1" stroke="#334155" stroke-width="1.5">
                <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/>
            </svg>`;

            for (let i = 0; i < 7; i++) {
                setTimeout(() => {
                    const cog = document.createElement('div');
                    cog.className = 'm-cog';
                    cog.innerHTML = cogSvgPath;
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 120 + Math.random() * 220;
                    const size = 35 + Math.random() * 30;
                    const rot = (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 540);
                    
                    cog.style.setProperty('--size', `${size}px`);
                    cog.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                    cog.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                    cog.style.setProperty('--rot', `${rot}deg`);
                    malfunctionOverlay.appendChild(cog);
                }, i * 70);
            }

            // 3. Spawn Electric Sparks Spray
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const spark = document.createElement('div');
                    spark.className = 'm-spark';
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 90 + Math.random() * 260;
                    const size = 4 + Math.random() * 6;
                    
                    spark.style.setProperty('--size', `${size}px`);
                    spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                    spark.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                    if (Math.random() > 0.5) {
                        spark.style.boxShadow = '0 0 10px #60a5fa, 0 0 20px #3b82f6';
                    }
                    malfunctionOverlay.appendChild(spark);
                }, Math.random() * 400);
            }

            setTimeout(() => {
                malfunctionOverlay.innerHTML = '';
            }, 2200);
        }

        function finishSpin(winnerIdx) {
            isSpinning = false;
            btnSpin.disabled = false;
            lastWinnerIndex = winnerIdx;
            onSpinComplete(students[winnerIdx]);
        }

        // --- Winner Sequence & Confetti ---
        function onSpinComplete(winnerName) {
            playFanfareSound();
            winnerNameEl.textContent = winnerName;
            
            winnerModal.classList.add('active');
            backdrop.classList.add('active');
            
            launchConfetti();
        }

        // Built-in Particle Confetti Engine
        const confettiCanvas = document.getElementById('confettiCanvas');
        const cCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];

        function launchConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            confettiParticles = [];

            const particleColors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ffffff'];

            for (let i = 0; i < 120; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 4,
                    color: particleColors[Math.floor(Math.random() * particleColors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    life: 1
                });
            }

            animateConfetti();
        }

        function animateConfetti() {
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let activeParticles = false;

            confettiParticles.forEach(p => {
                if (p.life <= 0) return;
                activeParticles = true;

                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.vx *= 0.98;
                p.rotation += p.vRot;
                p.life -= 0.01;

                cCtx.save();
                cCtx.translate(p.x, p.y);
                cCtx.rotate((p.rotation * Math.PI) / 180);
                cCtx.fillStyle = p.color;
                cCtx.globalAlpha = Math.max(0, p.life);
                cCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                cCtx.restore();
            });

            if (activeParticles) {
                requestAnimationFrame(animateConfetti);
            }
        }

        // --- Roster & Settings Logic ---
        function updateRoster(newNames) {
            students = newNames.filter(name => name.trim() !== "");
            colors = generateColors(students.length);
            contestantsInput.value = students.join('\n');
            contestantCount.textContent = students.length;
            drawWheel();
            updatePointerAndTicks();
        }

        function openSettings() {
            settingsPanel.classList.add('open');
            backdrop.classList.add('active');
        }

        function closeSettings() {
            settingsPanel.classList.remove('open');
            if (!winnerModal.classList.contains('active')) {
                backdrop.classList.remove('active');
            }
        }

        function saveSettings() {
            const rawNames = contestantsInput.value.split('\n');
            updateRoster(rawNames);
            spinDuration = parseInt(spinDurationInput.value, 10);
            
            randomEventsEnabled = randomEventsToggle.checked;
            randomEventChance = parseInt(randomEventsChanceInput.value, 10);

            enabledEvents.monkey = evtMonkey.checked;
            enabledEvents.lightning = evtLightning.checked;
            enabledEvents.malfunction = evtMalfunction.checked;

            closeSettings();
        }

        // --- Event Listeners ---
        btnSpin.addEventListener('click', spin);
        
        btnSettings.addEventListener('click', openSettings);
        btnCloseSettings.addEventListener('click', closeSettings);
        backdrop.addEventListener('click', () => {
            closeSettings();
            winnerModal.classList.remove('active');
            backdrop.classList.remove('active');
        });

        btnSaveSettings.addEventListener('click', saveSettings);

        spinDurationInput.addEventListener('input', (e) => {
            durationValue.textContent = `${e.target.value}s`;
        });

        randomEventsToggle.addEventListener('change', (e) => {
            randomEventsOptions.style.display = e.target.checked ? 'flex' : 'none';
        });

        randomEventsChanceInput.addEventListener('input', (e) => {
            chanceValue.textContent = `${e.target.value}%`;
        });

        contestantsInput.addEventListener('input', () => {
            const actualCount = contestantsInput.value.split('\n').filter(n => n.trim() !== "").length;
            contestantCount.textContent = actualCount;
        });

        btnSound.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            btnSound.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Muted';
        });

        btnShuffle.addEventListener('click', () => {
            const rawNames = contestantsInput.value.split('\n').filter(n => n.trim() !== "");
            for (let i = rawNames.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rawNames[i], rawNames[j]] = [rawNames[j], rawNames[i]];
            }
            contestantsInput.value = rawNames.join('\n');
        });

        btnLoadSample.addEventListener('click', () => {
            updateRoster(DEFAULT_STUDENTS);
        });

        btnCloseWinner.addEventListener('click', () => {
            winnerModal.classList.remove('active');
            backdrop.classList.remove('active');
        });

        btnRemoveWinner.addEventListener('click', () => {
            if (lastWinnerIndex >= 0 && lastWinnerIndex < students.length) {
                students.splice(lastWinnerIndex, 1);
                updateRoster(students);
            }
            winnerModal.classList.remove('active');
            backdrop.classList.remove('active');
        });

        // External Message Listener for Classroom Integration
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'CLASSROOM_ROSTER_UPDATE') {
                const studentNames = event.data.roster;
                if (Array.isArray(studentNames)) {
                    updateRoster(studentNames);
                }
            }
        });

        // Keyboard Shortcut: Spacebar to Spin
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== contestantsInput && !isSpinning) {
                e.preventDefault();
                spin();
            }
        });

        window.addEventListener('resize', resizeCanvas);

        // --- Initialize App ---
        updateRoster(DEFAULT_STUDENTS);
        resizeCanvas();
    </script>
