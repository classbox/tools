<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTC Schedule Tracker</title>
    <script>
        (function() {
            function isMobileDevice() {
                // 1. Explicit override via query param ?view=mobile or ?view=desktop (or ?v=m / ?v=d)
                try {
                    var params = new URLSearchParams(window.location.search);
                    var v = (params.get('view') || params.get('v') || '').toLowerCase();
                    if (v === 'mobile' || v === 'm') {
                        sessionStorage.setItem('ptc_preferred_view', 'mobile');
                        return true;
                    }
                    if (v === 'desktop' || v === 'd') {
                        sessionStorage.setItem('ptc_preferred_view', 'desktop');
                        return false;
                    }
                    // 2. Check saved preference in this session
                    var saved = sessionStorage.getItem('ptc_preferred_view');
                    if (saved === 'mobile') return true;
                    if (saved === 'desktop') return false;
                } catch (e) {}

                // 3. User Agent test
                var ua = navigator.userAgent || navigator.vendor || window.opera || '';
                var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|Silk/i.test(ua);

                // 4. Screen / Viewport Width check
                var viewportWidth = window.innerWidth;
                try {
                    if (window.top && window.top.innerWidth) {
                        viewportWidth = window.top.innerWidth;
                    }
                } catch (e) {}

                var screenWidth = (window.screen && window.screen.width) ? window.screen.width : viewportWidth;
                var effectiveWidth = Math.min(viewportWidth, screenWidth);
                var hasTouch = (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) || ('ontouchstart' in window);

                if (isMobileUA && effectiveWidth <= 900) return true;
                if (effectiveWidth < 768) return true;
                if (hasTouch && effectiveWidth <= 820) return true;

                return false;
            }

            var target = isMobileDevice() ? 'ptc_tracker_mobile.html' : 'ptc_tracker.html';
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            window.location.replace(target + search + hash);
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f6;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            padding: 24px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        .btn-link {
            display: inline-block;
            margin: 8px 6px;
            padding: 10px 16px;
            background: #0f172a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>📋 PTC Schedule Tracker</h3>
        <p style="margin: 12px 0 16px; color: #475569; font-size: 0.95rem;">Opening the best view for your device...</p>
        <noscript>
            <p style="margin-bottom: 16px; color: #64748b; font-size: 0.85rem;">JavaScript is disabled. Please choose your view:</p>
            <a class="btn-link" href="ptc_tracker.html">💻 Desktop View</a>
            <a class="btn-link" href="ptc_tracker_mobile.html">📱 Mobile View</a>
        </noscript>
    </div>
</body>
</html>
