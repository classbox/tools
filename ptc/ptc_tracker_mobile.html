<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PTC Mobile Schedule Table — G2C & G2D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Kantumruy+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --grid-border: #94a3b8;
      --grid-outer: #334155;
      --header-bg: #d1e3d8;
      --text: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;

      --empty-bg: #f8fafc;
      --lunch-bg: #f1f5f9;

      --done-bg: #bbf7d0;
      --done-text: #14532d;

      --active-bg: #fef08a;
      --active-text: #713f12;

      --overdue-bg: #fed7aa;
      --overdue-text: #7c2d12;

      --critical-bg: #fecaca;
      --critical-text: #7f1d1d;

      --scrubber: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', 'Kantumruy Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 62px;
      line-height: 1.25;
    }

    /* Sticky Top Header */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 2px solid var(--grid-outer);
      padding: 8px 10px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .title {
      font-size: 0.88rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .clock-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      font-weight: 700;
      background: #0f172a;
      color: #fff;
      padding: 4px 8px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
    }

    .dot.sim {
      background: #f59e0b;
    }

    .day-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 2px solid var(--grid-outer);
      margin-bottom: 6px;
    }

    .tab-btn {
      border: none;
      border-right: 1px solid var(--grid-outer);
      background: #e2e8f0;
      padding: 6px 6px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn:last-child {
      border-right: none;
    }

    .tab-btn.active {
      background: #0f172a;
      color: #ffffff;
    }

    .tab-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .tab-btn:not(.active) .tab-badge {
      background: #cbd5e1;
      color: #0f172a;
    }

    .status-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .s-pill {
      font-size: 0.66rem;
      font-weight: 700;
      text-align: center;
      padding: 3px 4px;
      border: 1px solid var(--grid-outer);
    }

    .s-pill.done { background: var(--done-bg); color: var(--done-text); }
    .s-pill.active { background: var(--active-bg); color: var(--active-text); }
    .s-pill.overdue { background: var(--overdue-bg); color: var(--overdue-text); }
    .s-pill.critical { background: var(--critical-bg); color: var(--critical-text); }

    .sim-drawer {
      display: none;
      margin-top: 6px;
      padding: 6px 8px;
      background: #fffbeb;
      border: 1px solid #d97706;
      font-size: 0.74rem;
      color: #92400e;
    }

    .sim-drawer.visible {
      display: block;
    }

    /* Mobile Bordered Table */
    .table-wrap {
      position: relative;
      margin: 8px 6px 16px;
      background: var(--surface);
      border: 2px solid var(--grid-outer);
    }

    table.m-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.76rem;
    }

    table.m-table th,
    table.m-table td {
      border: 1px solid var(--grid-border);
      padding: 5px 5px;
      vertical-align: middle;
      overflow: hidden;
    }

    table.m-table thead th {
      background: var(--header-bg);
      color: var(--text);
      font-weight: 700;
      font-size: 0.7rem;
      text-align: center;
      border-bottom: 2px solid var(--grid-outer);
      padding: 6px 4px;
    }

    col.c-done { width: 34px; }
    col.c-time { width: 78px; }
    col.c-cls  { width: 46px; }
    col.c-stu  { width: auto; }
    col.c-late { width: 64px; }

    /* Uniform minimum height */
    table.m-table tbody tr {
      height: 38px;
    }

    tr.row-scheduled {
      background: #ffffff;
    }

    tr.row-empty {
      background: var(--empty-bg);
      color: var(--text-muted);
    }

    tr.row-empty.active-free-slot td {
      background: #e0f2fe;
      color: #0369a1;
    }

    /* Merged Lunch Break on Mobile */
    td.m-lunch-merged {
      background: var(--lunch-bg) !important;
      text-align: center !important;
      vertical-align: middle !important;
      border: 1px solid var(--grid-border) !important;
      border-left: 2px solid var(--grid-outer) !important;
      padding: 12px 8px !important;
    }

    .m-lunch-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .m-lunch-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.05em;
    }

    .m-lunch-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 600;
      color: #475569;
      background: #ffffff;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid #cbd5e1;
    }

    /* Status Fills */
    tr.state-done td {
      background-color: var(--done-bg) !important;
      color: var(--done-text);
      opacity: 0.55;
    }

    tr.state-done .stu-en,
    tr.state-done .stu-kh {
      text-decoration: line-through;
    }

    tr.state-active td {
      background-color: var(--active-bg) !important;
      color: var(--active-text);
    }

    tr.state-overdue td {
      background-color: var(--overdue-bg) !important;
      color: var(--overdue-text);
    }

    tr.state-critical td {
      background-color: var(--critical-bg) !important;
      color: var(--critical-text);
    }

    .m-cb {
      width: 20px;
      height: 20px;
      accent-color: #15803d;
      display: block;
      margin: 0 auto;
    }

    .m-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .m-time.red-paper {
      box-shadow: inset 3px 0 0 #ef4444;
    }

    .m-cls {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
    }

    .cls-G2C { color: #0369a1; }
    .cls-G2D { color: #6b21a8; }

    .kh-sub {
      font-size: 0.62rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stu-en {
      font-weight: 700;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stu-kh {
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 0.72rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .free-slot-text {
      font-size: 0.72rem;
      font-style: italic;
      color: #64748b;
    }

    .m-late {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .badge-mini {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0 3px;
      border-radius: 2px;
      background: #ef4444;
      color: #fff;
      margin-left: 3px;
    }

    /* Live Scrubber Line */
    .scrubber-line {
      position: absolute;
      left: -3px;
      right: -3px;
      height: 3px;
      background: var(--scrubber);
      box-shadow: 0 0 6px rgba(220, 38, 38, 0.7);
      z-index: 30;
      pointer-events: none;
      display: none;
    }

    .scrubber-line.visible {
      display: block;
    }

    .scrubber-tag {
      position: absolute;
      right: 2px;
      top: -17px;
      background: var(--scrubber);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 2px;
    }

    /* Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--surface);
      border-top: 2px solid var(--grid-outer);
      padding: 6px 8px;
      display: flex;
      gap: 6px;
    }

    .b-btn {
      flex: 1;
      border: 1px solid var(--grid-outer);
      background: #f8fafc;
      color: var(--text);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 4px;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>

      { id: "sat-12", date: "2026-10-24", startMin: 660, endMin: 675, khTime: "11:15-11:30", enClass: "G2D", khClass: "G2D", enName: "Ngoun Sereysokkhak", khName: "ងន់ សិរីសុខៈ", confirmed: "Yes", redEn: true, overlap: false },
      { id: "sat-13", date: "2026-10-24", startMin: 840, endMin: 855, khTime: "2:15-2:30", enClass: "G2C", khClass: "G3C", enName: "Uy Monichakravuth", khName: "អ៊ុយ មុនីចក្រាវុធ", confirmed: "Yes", redEn: false, overlap: false },
      { id: "sat-14", date: "2026-10-24", startMin: 855, endMin: 870, khTime: "2:45-3:00", enClass: "G2D", khClass: "G5B", enName: "Ly Kimcheng", khName: "លី គីមចេង", confirmed: "Yes", redEn: false, overlap: false },
      { id: "sat-15", date: "2026-10-24", startMin: 870, endMin: 885, khTime: "2:30-2:45", enClass: "G2D", khClass: "G5B", enName: "Ly Kimchou", khName: "លី គីមជូ", confirmed: "Yes", redEn: false, overlap: false },
      { id: "sat-16", date: "2026-10-24", startMin: 885, endMin: 900, khTime: "2:30-2:45", enClass: "G2D", khClass: "G2D", enName: "Luy Thavy", khName: "លុយ ថាវី", confirmed: "Yes", redEn: false, overlap: false },
      { id: "sat-17", date: "2026-10-24", startMin: 915, endMin: 930, khTime: "3:00-3:15", enClass: "G2D", khClass: "G3B", enName: "Ly Long Sreng", khName: "លី ឡុងស្រេង", confirmed: "Yes", redEn: false, overlap: false }
    ];

    const STORAGE_KEY = "makson_ptc_2026_state_v1";
    let appState = loadState();
    let currentDay = detectDefaultDay();
    let collapseLunch = false;
    let simMode = false;
    let simMinutes = 575;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { done: {}, doneAt: {}, notes: {} };
      } catch (e) {
        return { done: {}, doneAt: {}, notes: {} };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {}
    }

    function detectDefaultDay() {
      const now = new Date();
      const iso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      return iso === "2026-10-24" ? "2026-10-24" : "2026-10-23";
    }

    function formatMinTo12h(totalMinutes) {
      const hrs24 = Math.floor(totalMinutes / 60);
      const mins = Math.floor(totalMinutes % 60);
      const period = hrs24 >= 12 ? "PM" : "AM";
      const hrs12 = hrs24 % 12 === 0 ? 12 : hrs24 % 12;
      return `${hrs12}:${String(mins).padStart(2, "0")} ${period}`;
    }

    function formatCompactSlot(startMin, endMin) {
      const fmt = (m) => {
        const h24 = Math.floor(m / 60);
        const mins = Math.floor(m % 60);
        const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
        return `${h12}:${String(mins).padStart(2, "0")}`;
      };
      return `${fmt(startMin)}-${fmt(endMin)}`;
    }

    function getCurrentMinutes() {
      if (simMode) return simMinutes;
      const now = new Date();
      return now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    }

    function renderTable() {
      const tbody = document.getElementById("mBody");
      tbody.innerHTML = "";

      const dayAppts = APPOINTMENTS.filter(a => a.date === currentDay);
      const dayStart = 480;
      const dayEnd = currentDay === "2026-10-23" ? 900 : 930;

      const lunchStart = 675; // 11:15 AM
      const lunchEnd = currentDay === "2026-10-23" ? 810 : 840; // 1:30 PM (Fri) or 2:00 PM (Sat)
      const lunchRangeText = currentDay === "2026-10-23" ? "11:15 – 1:30 PM" : "11:15 – 2:00 PM";
      const totalLunchSlots = Math.round((lunchEnd - lunchStart) / 15);

      for (let t = dayStart; t < dayEnd; t += 15) {
        const isLunch = (t >= lunchStart && t < lunchEnd);

        if (isLunch && collapseLunch) {
          if (t === lunchStart) {
            const tr = document.createElement("tr");
            tr.className = "row-empty track-row";
            tr.dataset.startMin = lunchStart;
            tr.dataset.endMin = lunchEnd;
            tr.innerHTML = `
              <td></td>
              <td class="m-time">${formatCompactSlot(lunchStart, lunchEnd)}</td>
              <td colspan="3" class="m-lunch-merged" style="padding:6px !important;">
                <div class="m-lunch-box">
                  <span class="m-lunch-title">🍱 LUNCH BREAK</span>
                  <span class="m-lunch-sub">${lunchRangeText} (Tap Lunch to expand)</span>
                </div>
              </td>
            `;
            tbody.appendChild(tr);
          }
          continue;
        }

        if (isLunch && !collapseLunch) {
          const tr = document.createElement("tr");
          tr.className = "row-empty track-row";
          tr.dataset.startMin = t;
          tr.dataset.endMin = t + 15;

          if (t === lunchStart) {
            tr.innerHTML = `
              <td></td>
              <td class="m-time">${formatCompactSlot(t, t + 15)}</td>
              <td rowspan="${totalLunchSlots}" colspan="3" class="m-lunch-merged">
                <div class="m-lunch-box">
                  <div class="m-lunch-title">🍱 LUNCH BREAK</div>
                  <div class="m-lunch-sub">${lunchRangeText}</div>
                </div>
              </td>
            `;
          } else {
            tr.innerHTML = `
              <td></td>
              <td class="m-time">${formatCompactSlot(t, t + 15)}</td>
            `;
          }
          tbody.appendChild(tr);
          continue;
        }

        const slotAppts = dayAppts.filter(a => a.startMin === t);

        if (slotAppts.length === 0) {
          const tr = document.createElement("tr");
          tr.className = "row-empty track-row";
          tr.dataset.startMin = t;
          tr.dataset.endMin = t + 15;
          tr.innerHTML = `
            <td></td>
            <td class="m-time">${formatCompactSlot(t, t + 15)}</td>
            <td></td>
            <td class="free-slot-text">Free Slot</td>
            <td class="m-late free-slot-text">—</td>
          `;
          tbody.appendChild(tr);
        } else {
          slotAppts.forEach(item => {
            const isDone = !!appState.done[item.id];
            const tr = document.createElement("tr");
            tr.className = "row-scheduled track-row";
            tr.id = `mrow-${item.id}`;
            tr.dataset.id = item.id;
            tr.dataset.startMin = item.startMin;
            tr.dataset.endMin = item.endMin;

            tr.innerHTML = `
              <td>
                <input type="checkbox" class="m-cb" data-id="${item.id}" ${isDone ? "checked" : ""} />
              </td>
              <td class="m-time ${item.redEn ? "red-paper" : ""}">
                ${formatCompactSlot(item.startMin, item.endMin)}
              </td>
              <td class="m-cls">
                <div class="cls-${item.enClass}">${item.enClass}</div>
                <div class="kh-sub">${item.khClass}</div>
              </td>
              <td>
                <div class="stu-en">
                  ${item.enName}
                  ${item.overlap ? `<span class="badge-mini">2x</span>` : ""}
                  ${item.confirmed === "No" ? `<span class="badge-mini">No</span>` : ""}
                </div>
                <div class="stu-kh">${item.khName} · KH ${item.khTime}</div>
              </td>
              <td class="m-late" id="mlate-${item.id}">—</td>
            `;

            tr.addEventListener("click", (e) => {
              if (e.target.tagName === "INPUT") return;
              const cb = tr.querySelector(".m-cb");
              cb.checked = !cb.checked;
              toggleDone(item.id, cb.checked);
            });

            tr.querySelector(".m-cb").addEventListener("change", (e) => {
              toggleDone(item.id, e.target.checked);
            });

            tbody.appendChild(tr);
          });
        }
      }

      updateLiveStatus();
    }

    function toggleDone(id, checked) {
      if (checked) {
        appState.done[id] = true;
        appState.doneAt[id] = Math.floor(getCurrentMinutes());
      } else {
        delete appState.done[id];
        delete appState.doneAt[id];
      }
      saveState();
      updateLiveStatus();
    }

    function formatShortTimer(diffMin) {
      const secs = Math.max(0, Math.floor(diffMin * 60));
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      if (m >= 60) return `${Math.floor(m / 60)}h${m % 60}m`;
      if (simMode) return `${m}m`;
      return `${m}m ${String(s).padStart(2, "0")}s`;
    }

    function updateLiveStatus() {
      const now = new Date();
      const nowMin = getCurrentMinutes();

      const clockText = document.getElementById("clockText");
      const clockDot = document.getElementById("clockDot");
      if (simMode) {
        clockText.textContent = formatMinTo12h(nowMin);
        clockDot.classList.add("sim");
      } else {
        clockText.textContent = now.toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true
        });
        clockDot.classList.remove("sim");
      }

      const friAppts = APPOINTMENTS.filter(a => a.date === "2026-10-23");
      const satAppts = APPOINTMENTS.filter(a => a.date === "2026-10-24");
      document.getElementById("bFri").textContent = `${friAppts.filter(a => appState.done[a.id]).length}/${friAppts.length}`;
      document.getElementById("bSat").textContent = `${satAppts.filter(a => appState.done[a.id]).length}/${satAppts.length}`;

      let cDone = 0, cActive = 0, cOverdue = 0, cCritical = 0;

      APPOINTMENTS.filter(a => a.date === currentDay).forEach(item => {
        const tr = document.getElementById(`mrow-${item.id}`);
        const lateEl = document.getElementById(`mlate-${item.id}`);
        if (!tr || !lateEl) return;

        tr.classList.remove("state-done", "state-active", "state-overdue", "state-critical");

        const isDone = !!appState.done[item.id];
        const diff = nowMin - item.startMin;

        if (isDone) {
          tr.classList.add("state-done");
          lateEl.textContent = "✓ Done";
          cDone++;
        } else if (diff < 0) {
          lateEl.textContent = "—";
        } else if (nowMin >= item.startMin && nowMin < item.endMin) {
          tr.classList.add("state-active");
          lateEl.textContent = formatShortTimer(diff);
          cActive++;
        } else if (diff >= 45) {
          tr.classList.add("state-critical");
          lateEl.textContent = `+${formatShortTimer(diff)}`;
          cCritical++;
        } else {
          tr.classList.add("state-overdue");
          lateEl.textContent = `+${formatShortTimer(diff)}`;
          cOverdue++;
        }
      });

      document.querySelectorAll("tr.row-empty").forEach(tr => {
        const s = parseFloat(tr.dataset.startMin);
        const e = parseFloat(tr.dataset.endMin);
        tr.classList.toggle("active-free-slot", nowMin >= s && nowMin < e);
      });

      document.getElementById("sDone").textContent = cDone;
      document.getElementById("sActive").textContent = cActive;
      document.getElementById("sOverdue").textContent = cOverdue;
      document.getElementById("sCritical").textContent = cCritical;

      updateScrubber(nowMin);
    }

    function updateScrubber(nowMin) {
      const scrubber = document.getElementById("scrubberLine");
      const tag = document.getElementById("scrubberTag");
      const wrap = document.getElementById("tableWrap");
      const rows = Array.from(document.querySelectorAll("tr.track-row"));

      if (!rows.length) {
        scrubber.classList.remove("visible");
        return;
      }

      const groups = [];
      rows.forEach(r => {
        const s = parseFloat(r.dataset.startMin);
        const e = parseFloat(r.dataset.endMin);
        const last = groups[groups.length - 1];
        if (last && last.startMin === s && last.endMin === e) {
          last.rows.push(r);
        } else {
          groups.push({ startMin: s, endMin: e, rows: [r] });
        }
      });

      const firstMin = groups[0].startMin;
      const lastMin = groups[groups.length - 1].endMin;

      if (nowMin < firstMin - 20 || nowMin > lastMin + 20) {
        scrubber.classList.remove("visible");
        return;
      }

      scrubber.classList.add("visible");
      tag.textContent = `NOW · ${formatMinTo12h(nowMin)}`;

      const wrapRect = wrap.getBoundingClientRect();
      let y = 0;

      if (nowMin <= firstMin) {
        y = groups[0].rows[0].getBoundingClientRect().top - wrapRect.top;
      } else if (nowMin >= lastMin) {
        const lastRows = groups[groups.length - 1].rows;
        y = lastRows[lastRows.length - 1].getBoundingClientRect().bottom - wrapRect.top;
      } else {
        for (const g of groups) {
          if (nowMin >= g.startMin && nowMin <= g.endMin) {
            const topR = g.rows[0].getBoundingClientRect();
            const botR = g.rows[g.rows.length - 1].getBoundingClientRect();
            const topY = topR.top - wrapRect.top;
            const height = botR.bottom - topR.top;
            const ratio = (nowMin - g.startMin) / (g.endMin - g.startMin);
            y = topY + ratio * height;
            break;
          }
        }
      }

      scrubber.style.top = `${y}px`;
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.day === currentDay);
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentDay = btn.dataset.day;
        renderTable();
      });
    });

    document.getElementById("lunchBtn").addEventListener("click", () => {
      collapseLunch = !collapseLunch;
      renderTable();
    });

    const simDrawer = document.getElementById("simDrawer");
    const simRange = document.getElementById("simRange");
    const simLabel = document.getElementById("simLabel");

    document.getElementById("simBtn").addEventListener("click", () => {
      simMode = !simMode;
      simDrawer.classList.toggle("visible", simMode);
      if (simMode) {
        simMinutes = parseFloat(simRange.value);
        simLabel.textContent = formatMinTo12h(simMinutes);
      }
      updateLiveStatus();
    });

    simRange.addEventListener("input", (e) => {
      simMode = true;
      simMinutes = parseFloat(e.target.value);
      simLabel.textContent = formatMinTo12h(simMinutes);
      updateLiveStatus();
    });

    document.getElementById("liveBtn").addEventListener("click", () => {
      simMode = false;
      simDrawer.classList.remove("visible");
      updateLiveStatus();
    });

    document.getElementById("jumpBtn").addEventListener("click", () => {
      const scrubber = document.getElementById("scrubberLine");
      if (scrubber.classList.contains("visible")) {
        scrubber.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });

    window.addEventListener("storage", (e) => {
      if (e.key === STORAGE_KEY) {
        appState = loadState();
        renderTable();
      }
    });

    renderTable();
    setInterval(updateLiveStatus, 1000);
  </script>
</body>
</html>
